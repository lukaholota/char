name: Checks → Image → Deploy

# Один воркфлоу замість двох. Раніше `image.yml` збирав образ окремо, бо старий `deploy.yml`
# викочував на інший сервер і чіпати його було не можна; після переїзду ця причина зникла.
# Послідовність замість паралельності свідома: образ, який не пройшов тести, не має потрапляти
# в GHCR — а поки деплою не було, це нічого не коштувало, бо образ нікуди й не їхав.

on:
  push:
    branches:
      - main
    # Коміт, який змінює тільки доки, не має збирати образ і викочувати його.
    # Спрацьовує лише коли ВСІ змінені файли підпадають під шаблон — якщо в коміті є і код,
    # і доки, воркфлоу запуститься. У рантаймі жоден .md не використовується (перевірено).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # На pull request paths-ignore навмисно немає: checks там коштує ~1 хвилину і нічого не
  # викочує, а пропущена перевірка заблокувала б PR, якби колись з'явився branch protection.
  pull_request:
  workflow_dispatch:

jobs:
  rules-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: UI decomposition guard
        run: bun run check:ui-decomposition

      - name: Rules coverage
        run: bun run test:rules:coverage

  checks:
    needs: rules-coverage
    runs-on: ubuntu-latest
    # Тести роблять TRUNCATE у spells_ci_test. Дві джоби одночасно затирали б дані одна одній
    # і давали б плаваючі падіння. cancel-in-progress: false — щоб прогін не обривався на півдорозі.
    concurrency:
      group: spells-ci-database
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tunnel to database
        uses: ./.github/actions/db-tunnel
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma Generate
        run: bunx prisma generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      # Мусить іти перед tsc: spellsData.ts / magicItemsData.ts / featsData.ts /
      # backgroundsData.ts / armorData.ts / weaponsData.ts / infusionsData.ts /
      # invocationsData.ts імпортують згенеровані JSON, а ті в .gitignore. Без цього кроку
      # tsc падає з TS2307 на чистому клоні. Генераторів зараз вісім: додати девʼятий каталог
      # і забути крок — це впасти не тут, а десь усередині Next.
      - name: Generate content JSON
        run: bun run generate:content
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Types
        run: bunx tsc --noEmit

      - name: DB boundary
        run: bun run check:db-boundary

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  image:
    needs: checks
    # На PR збирати нема сенсу: образ нікуди не поїде, а збірка найдорожче, що тут є.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Збирати треба саме тут, а не на сервері: Hetzner має 2 ядра й ~2 GB вільної памʼяті,
    # а `next build` це 763 сторінки в 7 воркерів. Поряд із живим сайтом це шанс піймати OOM.
    permissions:
      contents: read
      packages: write
    # Групи `spells-ci-database` тут навмисно немає, хоч збірка й ходить у ту саму базу:
    # тести труncають лише таблиці користувача, а збірка читає контентні. Зате зайвий
    # учасник групи означав би скасування вже поставлених у чергу джоб при частих пушах.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Збірці потрібна база: generate:spells читає заклинання, а next build пререндерить
      # /char. База на Hetzner доступна лише з 127.0.0.1, тож спершу тунель.
      - name: Tunnel to database
        uses: ./.github/actions/db-tunnel
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma Generate
        run: bunx prisma generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      # Похідні з бази JSON у .gitignore, тож у свіжому клоні їх немає, а Dockerfile без них
      # відмовляється збиратись. Має стояти перед docker build, не після.
      - name: Generate content JSON
        run: bun run generate:content
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `network=host` обов'язковий: кроки RUN усередині збірки інакше живуть у власній
      # мережі, і 127.0.0.1:5454 там вказував би на сам build-контейнер, а не на тунель
      # до бази, піднятий на раннері. Та сама пастка, що з `localhost` у docker run.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # `next build` пререндерить /char, який читає базу, тож збірці потрібен живий Postgres.
      # Секрет монтується BuildKit-ом і в шарах образу не осідає (перевірено docker history).
      # Беремо spells_ci_test: контент той самий, у прод заради збірки ходити не треба.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          network: host
          push: true
          tags: |
            ghcr.io/lukaholota/char:latest
            ghcr.io/lukaholota/char:${{ github.sha }}
          # Не секрети: обидва значення однаково їдуть у браузер кожного користувача. Але без
          # них збірка вийшла б мовчки зламаною, тому Dockerfile падає на порожньому.
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          secrets: |
            database_url=${{ secrets.TEST_DATABASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Два деплої одночасно перемикали б upstream один одному під ногами.
    concurrency:
      group: char-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Порожній секрет завалив би смоук уже після перемикання трафіку, і відкат прибрав би
      # цілком робочий реліз через помилку конфігурації. Дешевше впасти тут, ще нічого не чіпавши.
      - name: Check smoke URL is configured
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SITE_URL }}" ]; then
            echo "NEXT_PUBLIC_SITE_URL порожній — смоуку не буде куди ходити."
            exit 1
          fi

      # Скрипт викочування живе в репозиторії, а не тільки на сервері: на сервері немає
      # чекауту, а копії, які розходяться, — задокументований клас багів цього проєкту.
      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/deploy-container.sh"
          target: "/home/luka/char-ops"

      # Піднімає новий контейнер на вільному слоті, перевіряє /api/health і лише тоді
      # перемикає upstream. Старий контейнер лишається живим — до кроку `retire` нижче.
      - name: Release new container
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Образ прибитий до SHA, а не :latest. Тег :latest за час прогону міг переїхати
          # на інший коміт, і тоді викотилося б не те, що показує історія.
          IMAGE: ghcr.io/lukaholota/char:${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE
          script_stop: true
          script: |
            chmod +x /home/luka/char-ops/scripts/deploy-container.sh
            /home/luka/char-ops/scripts/deploy-container.sh release "$IMAGE"

      # Смоук ганяється з раннера по публічному URL, а не з сервера по 127.0.0.1:PORT:
      # так він заразом перевіряє, що nginx після reload віддає саме новий контейнер.
      - name: Smoke check
        id: smoke
        run: ./scripts/smoke.sh "${{ secrets.NEXT_PUBLIC_SITE_URL }}"

      # Умова саме на крок смоуку, а не просто failure(): якщо впало раніше, трафік ще не
      # перемикався і відкочувати нема чого — відкат тоді зіпсував би цілий реліз на порожньому місці.
      - name: Rollback on failed smoke
        if: failure() && steps.smoke.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: /home/luka/char-ops/scripts/deploy-container.sh rollback

      # Тільки після зеленого смоуку. Доти старий контейнер тримає порт і памʼять — це і є
      # ціна миттєвого відкату, і вона свідома.
      - name: Retire previous container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: /home/luka/char-ops/scripts/deploy-container.sh retire
