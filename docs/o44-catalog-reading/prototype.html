вника 1 рівня на ваш вибір. Рекомендуються Виявлення магії [Detect Magic], Падіння пірʼїною [Feather Fall], Обладунок мага [Mage Armor], Магічний дротик [Magic missile], Сон [Sleep] та Громова хвиля [Thunderwave].\n\nЩоразу, коли ви отримуєте рівень чарівника після 1, додайте до своєї книги заклинань два заклинання чарівника на ваш вибір. Кожне з них має бути того рівня, для якого ви маєте слоти, як показано в таблиці фіч Чарівника. Ці заклинання — підсумок магічних досліджень, які ви ведете постійно.\n\n**Слоти заклинань.** Таблиця фіч Чарівника показує, скільки слотів заклинань ви маєте для накладання заклинань 1 рівня й вище. Ви відновлюєте всі витрачені слоти, коли завершуєте довгий відпочинок.\n\n**Підготовлені заклинання 1 рівня й вище.** Ви готуєте список заклинань 1 рівня й вище, доступних вам для накладання цією фічею. Для цього виберіть чотири заклинання зі своєї книги заклинань. Обрані заклинання мають бути того рівня, для якого ви маєте слоти.\n\nКількість заклинань у вашому списку зростає з рівнями чарівника, як показано в колонці «Підготовлені заклинання» таблиці фіч Чарівника. Щоразу, коли ця кількість зростає, виберіть додаткові заклинання чарівника, доки кількість заклинань у вашому списку не зрівняється з числом у таблиці. Обрані заклинання мають бути того рівня, для якого ви маєте слоти. Наприклад, якщо ви чарівник 3 рівня, ваш список підготовлених заклинань може містити шість заклинань 1 і 2 рівнів у будь-якому поєднанні, обраних із вашої книги заклинань.\n\nЯкщо інша фіча чарівника дає вам заклинання, які ви завжди маєте підготовленими, вони не враховуються в кількість заклинань, яку ви можете підготувати цією фічею, але в усьому іншому вважаються для вас заклинаннями чарівника.\n\n**Зміна підготовлених заклинань.** Щоразу, коли ви завершуєте довгий відпочинок, ви можете змінити список підготовлених заклинань, замінивши будь-які з них заклинаннями зі своєї книги заклинань.\n\n**Характеристика чаклування.** Інтелект є вашою характеристикою чаклування для заклинань чарівника.\n\n**Чаротворчий фокус.** Ви можете використовувати магічний фокус або свою книгу заклинань як чаротворчий фокус для заклинань чарівника.\n\n**Поповнення й заміна книги заклинань**\n\nЗаклинання, які ви додаєте до книги, зростаючи в рівнях, відображають ваші постійні магічні дослідження, але під час пригод ви можете знайти й інші заклинання, які можна вписати в книгу. Наприклад, ви можете виявити заклинання чарівника на Сувої заклинань і переписати його до своєї книги.\n\n**Переписування заклинання до книги.**\n\nКоли ви знаходите заклинання чарівника 1 рівня чи вище, ви можете переписати його до своєї книги заклинань, якщо воно того рівня, який ви можете підготувати, і якщо у вас є час на переписування. За кожен рівень заклинання переписування триває 2 години й коштує 50 зм. Після цього ви можете готувати це заклинання, як і решту заклинань у своїй книзі.\n\n**Переписування книги.**\n\nВи можете переписати заклинання зі своєї книги до іншої книги. Це схоже на переписування нового заклинання до вашої книги, але швидше, бо ви вже вмієте його накладати. Вам потрібно витратити лише 1 годину й 10 зм за кожен рівень переписуваного заклинання.\n\nЯкщо ви втратили книгу заклинань, ви можете тим самим способом переписати підготовлені вами заклинання чарівника до нової книги. Щоб заповнити решту нової книги, доведеться шукати нові заклинання. Саме тому багато чарівників тримають запасну книгу заклинань."},{"level":2,"name":"Науковець","engName":"Wizard: Scholar (2024)","description":"Вивчаючи магію, ви також спеціалізувалися в іншій галузі знань. Оберіть одну з таких навичок, якою ви володієте: Магія, Історія, Розслідування, Медицина, Природа або Релігія. Ви маєте Експертизу в обраній навичці."},{"level":3,"name":"Підклас Чарівника","engName":"Wizard: Wizard Subclass (2024)","description":"Ви отримуєте підклас Чарівника на ваш вибір. Підкласи Заборонець, Провидець, Заклинач Стихій та Ілюзіоніст описані після опису цього класу. Підклас — це спеціалізація, яка дає вам фічі на певних рівнях чарівника. До кінця вашої карʼєри ви отримуєте кожну фічу свого підкласу, рівень якої не перевищує вашого рівня чарівника."},{"level":4,"name":"Покращення Характеристик","engName":"Wizard: Ability Score Improvement (2024)","description":"Ви отримуєте рису Покращення Характеристик або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Ви отримуєте цю фічу знову на 8, 12 і 16 рівнях чарівника."},{"level":5,"name":"Запамʼятовування заклинання","engName":"Wizard: Memorize Spell (2024)","description":"Щоразу, коли ви завершуєте короткий відпочинок, ви можете вивчити свою книгу заклинань і замінити одне із заклинань чарівника 1 рівня чи вище, підготовлених для фічі Чаклування, іншим заклинанням 1 рівня чи вище з книги."},{"level":18,"name":"Майстерність заклинань","engName":"Wizard: Spell Mastery (2024)","description":"Ви досягли такої майстерності в певних заклинаннях, що можете накладати їх за бажанням. Оберіть у своїй книзі заклинань одне заклинання 1 рівня й одне 2 рівня, час використання яких — дія. Ви завжди маєте ці заклинання підготовленими й можете накладати їх на найнижчому рівні, не витрачаючи слот заклинань. Щоб накласти будь-яке з них на вищому рівні, ви мусите витратити слот заклинань.\n\nЩоразу, коли ви завершуєте довгий відпочинок, ви можете вивчити свою книгу заклинань і замінити одне з цих заклинань придатним заклинанням того самого рівня з книги."},{"level":19,"name":"Епічний Дар","engName":"Wizard: Epic Boon (2024)","description":"Ви отримуєте рису Епічного Дару або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Рекомендується Дар Пригадування Заклинань."},{"level":20,"name":"Підписні заклинання","engName":"Wizard: Signature Spells (2024)","description":"Оберіть у своїй книзі заклинань два заклинання 3 рівня як свої підписні заклинання. Ви завжди маєте ці заклинання підготовленими й можете накласти кожне з них один раз на 3 рівні, не витрачаючи слот заклинань. Зробивши так, ви не можете накласти їх у такий спосіб знову, доки не завершите короткий або довгий відпочинок. Щоб накласти будь-яке з них на вищому рівні, ви мусите витратити слот заклинань."}],"children":[{"name":"Заборонець","engName":"Abjurer","slug":"abjurer","kind":"Підклас","description":"Ваше вивчення магії зосереджене на заклинаннях, що блокують, виганяють чи захищають — припиняючи шкідливі ефекти, виганяючи злі впливи та захищаючи слабких. До Заборонців звертаються, коли потрібен екзорцизм зловісних духів, коли місця потрібно захистити від магічного стеження чи коли потрібно закрити портали до інших планів існування. Пригодницькі загони цінують Заборонців за захист, який ті забезпечують від різноманітної ворожої магії та інших атак.","features":[{"level":3,"name":"Знавець Захисту","engName":"Abjurer: Abjuration Savant (2024)","description":"Оберіть два заклинання Чарівника зі школи Захист, кожне з яких не вище 2 рівня, і додайте їх до своєї книги заклинань безкоштовно.\n\nКрім того, щоразу, коли ви отримуєте доступ до нового рівня слотів заклинань у цьому класі, ви можете додати одне заклинання Чарівника школи Захист до своєї книги заклинань безкоштовно. Обране заклинання повинно бути рівня, для якого у вас є слоти заклинань."},{"level":3,"name":"Магічний Оберіг","engName":"Abjurer: Arcane ward (2024)","description":"Ви можете сплести магію навколо себе для захисту. Коли ви накладаєте заклинання школи Захист за допомогою слота заклинань, ви можете одночасно використати нитку магії цього заклинання, щоб створити на собі магічний оберіг, що триває, доки ви не завершите довгий відпочинок. Оберіг має максимум ХП, що дорівнює подвоєному вашому рівню Чарівника плюс модифікатор Інтелекту. Щоразу, коли ви отримуєте шкоду, оберіг отримує цю шкоду замість вас, і якщо у вас є будь-які опори чи вразливості, застосуйте їх до того, як зменшити ХП оберега. Якщо ця шкода зменшує ХП оберега до 0, ви отримуєте всю решту шкоди. Поки оберіг має 0 ХП, він не може поглинати шкоду, але його магія залишається.\n\nЩоразу, коли ви накладаєте заклинання школи Захист за допомогою слота заклинань, оберіг відновлює кількість ХП, що дорівнює подвоєному рівню витраченого слота заклинань. Крім того, бонусною дією ви можете витратити слот заклинань, і оберіг відновить кількість ХП, що дорівнює подвоєному рівню витраченого слота заклинань.\n\nСтворивши оберіг, ви не можете створити його знову, доки не завершите довгий відпочинок."},{"level":6,"name":"Проєктований Оберіг","engName":"Abjurer: Projected Ward (2024)","description":"Коли істота, яку ви бачите, в межах 30 футів від себе отримує шкоду, ви можете реакцією змусити свій Магічний Оберіг поглинути цю шкоду. Якщо ця шкода зменшує ХП оберега до 0, захищена істота отримує всю решту шкоди. Якщо ця істота має будь-які опори чи вразливості, застосуйте їх до того, як зменшити ХП оберега."},{"level":10,"name":"Руйнівник Заклинань","engName":"Abjurer: Spell Breaker (2024)","description":"Ви завжди маєте підготовані заклинання Контрчари [Counterspell] і Розвіювання магії [Dispel Magic]. Крім того, ви можете накласти Розвіювання магії [Dispel Magic] бонусною дією і можете додати свій Бонус Майстерності до перевірки характеристики цього заклинання.\n\nКоли ви накладаєте будь-яке з цих заклинань за допомогою слота заклинань, цей слот не витрачається, якщо заклинання не вдається зупинити."},{"level":14,"name":"Опір Заклинанням","engName":"Abjurer: Spell Resistance (2024)","description":"Ви маєте перевагу на рятівні кидки проти заклинань і маєте опір до шкоди від заклинань."}]},{"name":"Заклинач Стихій","engName":"Evoker","slug":"evoker","kind":"Підклас","description":"Ваше навчання зосереджене на магії, що створює потужні стихійні ефекти, як-от лютий холод, пекучий вогонь, розкотистий грім, тріскучу блискавку та їдку кислоту. Деякі Заклиначі Стихій знаходять службу у військових силах, слугуючи артилерією, що вражає армії здалеку. Інші використовують свою силу, щоб захищати інших, тоді як дехто шукає власної вигоди.","features":[{"level":3,"name":"Знавець Втілення","engName":"Evoker: Evocation Savant (2024)","description":"Оберіть два заклинання Чарівника зі школи Втілення, кожне з яких не вище 2 рівня, і додайте їх до своєї книги заклинань безкоштовно.\n\nКрім того, щоразу, коли ви отримуєте доступ до нового рівня слотів заклинань у цьому класі, ви можете додати одне заклинання Чарівника школи Втілення до своєї книги заклинань безкоштовно. Обране заклинання повинно бути рівня, для якого у вас є слоти заклинань."},{"level":3,"name":"Потужне Замовляння","engName":"Evoker: Potent Cantrip (2024)","description":"Ваші замовляння, що завдають шкоди, вражають навіть істот, яким вдається уникнути основного ефекту. Коли ви накладаєте замовляння на істоту й промахуєтеся кидком атаки, або ціль успішно проходить рятівний кидок проти замовляння, ціль отримує половину шкоди замовляння (якщо така є), але не зазнає жодного додаткового ефекту від замовляння."},{"level":6,"name":"Формування Заклинань","engName":"Evoker: Sculpt Spells (2024)","description":"Ви можете створювати острівці відносної безпеки всередині ефектів своїх заклинань школи Втілення. Коли ви накладаєте заклинання школи Втілення, що впливає на інших істот, яких ви бачите, ви можете обрати кількість із них, що дорівнює 1 плюс рівень заклинання. Обрані істоти автоматично проходять рятівні кидки проти цього заклинання й не отримують шкоди, якщо зазвичай отримали б половину шкоди при успішному рятівному кидку."},{"level":10,"name":"Посилене Втілення","engName":"Evoker: Empowered Evocation (2024)","description":"Щоразу, коли ви накладаєте заклинання Чарівника школи Втілення, ви можете додати модифікатор Інтелекту до одного кидка ушкоджень цього заклинання."},{"level":14,"name":"Перенапруга","engName":"Evoker: Overchannel (2024)","description":"Ви можете посилити потужність своїх заклинань. Коли ви накладаєте заклинання Чарівника за допомогою слота заклинань 1–5 рівня, що завдає шкоди, ви можете завдати максимальної шкоди цим заклинанням у хід, коли його накладаєте.\n\nПершого разу, коли ви робите це, ви не зазнаєте жодного негативного ефекту. Якщо ви використовуєте цю рису знову до завершення довгого відпочинку, ви отримуєте 2к12 некротичної шкоди за кожен рівень витраченого слота заклинань одразу після накладання заклинання. Ця шкода ігнорує опір та імунітет.\n\nКожного разу, коли ви використовуєте цю рису знову до завершення довгого відпочинку, некротична шкода за рівень заклинання збільшується на 1к12."}]},{"name":"Зачарувальник","engName":"Enchanter","slug":"enchanter","kind":"Підклас","description":"Магія Зачарувальника затуманює або полонить розум. Одні Зачарувальники використовують свій хист, щоб плекати мир і помʼякшувати жорстокість, інші звертають магію зміни розуму на власну користь.","features":[{"level":3,"name":"Гіпнотична присутність","engName":"Enchanter: Hypnotic Presence (2024)","description":"Ваші чарівливі слова й погляд можуть полонити іншу істоту. Дією Магія оберіть видиму істоту в межах 10 футів. Якщо ціль бачить або чує вас, вона мусить успішно пройти ряткидок Мудрості проти КС ваших заклинань, інакше буде Причарована на 1 хвилину або доки не опиниться далі ніж за 10 футів, перестане бачити й чути вас чи отримає шкоду. Причарована ціль Недієздатна, а її Швидкість дорівнює 0. Ви можете використати рису кількість разів, що дорівнює модифікатору Інтелекту (щонайменше один раз), і відновлюєте всі використання після довгого відпочинку."},{"level":3,"name":"Знавець зачарування","engName":"Enchanter: Enchantment Savant (2024)","description":"Оберіть два заклинання чарівника школи Зачарування не вище 2-го рівня й безкоштовно додайте їх до книги заклинань. Щоразу, коли в цьому класі отримуєте доступ до слотів нового рівня, можете безкоштовно додати до книги ще одне заклинання чарівника школи Зачарування того рівня, для якого маєте слоти."},{"level":3,"name":"Чарівливий співрозмовник","engName":"Enchanter: Enchanting Conversationalist (2024)","description":"Ви отримуєте володіння однією навичкою на вибір: Обман, Залякування або Переконання. Крім того, коли робите перевірку характеристики з обраною навичкою, додаєте до неї бонус, що дорівнює модифікатору Інтелекту (щонайменше +1)."},{"level":6,"name":"Розділене зачарування","engName":"Enchanter: Split Enchantment (2024)","description":"Коли ви витрачаєте слот на заклинання Зачарування, яке можна застосувати слотом вищого рівня для додаткової цілі, як-от Причарування особи, можете збільшити ефективний рівень заклинання на 1. Ви можете використати рису кількість разів, що дорівнює модифікатору Інтелекту, і відновлюєте всі використання після довгого відпочинку."},{"level":10,"name":"Інстинктивне зачарування","engName":"Enchanter: Instinctive Charm (2024)","description":"Коли видима вам істота в межах 30 футів влучає у вас атакою, ви можете реакцією змусити нападника зробити ряткидок Мудрості проти КС ваших заклинань. У разі провалу атака натомість промахується; якщо в її дальності є інша істота, крім нападника, той атакує цю істоту тим самим кидком. Якщо можливих цілей кілька, обираєте ви. Після цієї реакції риса відновлюється після довгого відпочинку або коли ви застосуєте заклинання Зачарування, витративши слот."},{"level":14,"name":"Зміна спогадів","engName":"Enchanter: Alter Memories (2024)","description":"Ви можете приховати від істоти свій магічний вплив. Коли слотом застосовуєте заклинання Зачарування, яке накладає стан Причарований, оберіть одну його ціль: вона не усвідомлює, що ви її Причарували. Крім того, один раз до завершення заклинання ви можете дією Магія змусити її зробити ряткидок Інтелекту проти КС ваших заклинань. У разі провалу істота втрачає спогади за кількість годин, що дорівнює 1 + модифікатор Інтелекту (щонайменше 1 година). Ви можете стерти менший проміжок, але не довший за тривалість заклинання."}]},{"name":"Ілюзіоніст","engName":"Illusionist","slug":"illusionist","kind":"Підклас","description":"Ви спеціалізуєтесь на магії, що засліплює чуття й обманює розум, а ілюзії, які ви створюєте, роблять неможливе схожим на реальне.","features":[{"level":3,"name":"Знавець Ілюзії","engName":"Illusionist: Illusion Savant (2024)","description":"Оберіть два заклинання Чарівника зі школи Ілюзія, кожне з яких не вище 2 рівня, і додайте їх до своєї книги заклинань безкоштовно.\n\nКрім того, щоразу, коли ви отримуєте доступ до нового рівня слотів заклинань у цьому класі, ви можете додати одне заклинання Чарівника школи Ілюзія до своєї книги заклинань безкоштовно. Обране заклинання повинно бути рівня, для якого у вас є слоти заклинань."},{"level":3,"name":"Покращені Ілюзії","engName":"Illusionist: Improved Illusions (2024)","description":"Ви можете накладати заклинання школи Ілюзія без вербального компонента, і якщо заклинання школи Ілюзія, яке ви накладаєте, має дистанцію 10+ футів, ця дистанція збільшується на 60 футів.\n\nВи також знаєте замовляння Мала ілюзія [Minor Illusion]. Якщо ви вже знаєте його, ви вивчаєте інше замовляння Чарівника на свій вибір. Це замовляння не враховується у кількість відомих вам замовлянь. Одне накладання заклинання Мала ілюзія [Minor Illusion] дозволяє вам створити водночас і звук, і зображення, а накласти його ви можете бонусною дією."},{"level":6,"name":"Примарні Створіння","engName":"Illusionist: Phantasmal Creatures (2024)","description":"Ви завжди маєте підготовані заклинання Виклик Звіра [Summon Beast] і Виклик феї [Summon Fey]. Щоразу, коли ви накладаєте будь-яке з цих заклинань, ви можете змінити його школу на Ілюзія, через що призвана істота набуває примарного вигляду. Ви можете накласти версію заклинання школи Ілюзія без витрати слота заклинань, але накладання без слота зменшує ХП істоти вдвічі. Наклавши будь-яке з цих заклинань без слота заклинань, ви повинні завершити довгий відпочинок, перш ніж зможете накласти заклинання в такий спосіб знову."},{"level":10,"name":"Ілюзорний Двійник","engName":"Illusionist: Illusory Self (2024)","description":"Коли істота влучає по вас кидком атаки, ви можете реакцією поставити ілюзорного двійника себе між нападником і собою. Атака автоматично промахується повз вас, після чого ілюзія розсіюється.\n\nВикориставши цю рису, ви не можете використати її знову, доки не завершите короткий чи довгий відпочинок. Ви також можете відновити можливість її використання, витративши слот заклинань 2 рівня чи вищого (дія не потрібна)."},{"level":14,"name":"Ілюзорна Реальність","engName":"Illusionist: Illusory Reality (2024)","description":"Ви навчилися вплітати магію тіней у свої ілюзії, надаючи їм напівреальності. Коли ви накладаєте заклинання школи Ілюзія за допомогою слота заклинань, ви можете обрати один неживий немагічний предмет, що є частиною ілюзії, і зробити цей предмет реальним. Ви можете зробити це на своєму ході бонусною дією, поки заклинання триває. Предмет залишається реальним протягом 1 хвилини, протягом якої він не може завдавати шкоди чи накладати будь-які стани. Наприклад, ви можете створити ілюзію мосту через прірву, а потім зробити його реальним і перейти по ньому."}]},{"name":"Некромант","engName":"Necromancer","slug":"necromancer","kind":"Підклас","description":"Ви досліджуєте сили життя, смерті й нежиті. Як некромант, ви вчитеся керувати енергією, що оживлює всіх істот, і черпаєте дедалі більшу силу із заборонених таємниць своєї книги заклинань. Хоч багато хто бачить у Некромантах загрозу чи лиходійство, не всі Некроманти злі.","features":[{"level":3,"name":"Знавець некромантії","engName":"Necromancer: Necromancy Savant (2024)","description":"Оберіть два заклинання чарівника школи Некромантії не вище 2-го рівня й безкоштовно додайте їх до книги заклинань. Щоразу, коли в цьому класі отримуєте доступ до слотів нового рівня, можете безкоштовно додати до книги ще одне заклинання чарівника школи Некромантії того рівня, для якого маєте слоти."},{"level":3,"name":"Некромантична книга заклинань","engName":"Necromancer: Necromancy Spellbook (2024)","description":"Некромантичні таємниці вашої книги дають такі сили.\n\n**Опір некрозу.** Ви маєте опір некротичній шкоді.\n\n**Невмерлий фамільяр.** У вашій книзі зʼявляється Пошук фамільяра. Застосовуючи його, можете обрати звичайну форму або скелета чи зомбі; для звичайної форми можете обрати тип істоти Невмерлий. Виконуючи дію Атака, ви також можете відмовитися від однієї своєї атаки, щоб фамільяр реакцією зробив одну власну.\n\n**Життєва сила невмерлих.** Коли ви витрачаєте слот на заклинання Некромантії, можете обрати видимого Невмерлого в межах 60 футів, який відновить хіти в кількості рівень витраченого слота + ваш рівень чарівника."},{"level":6,"name":"Невмерлі раби","engName":"Necromancer: Undead Thralls (2024)","description":"Підіймання мерців завжди підготовлене у вас, і ви можете один раз застосувати його без слота; ця здатність відновлюється після довгого відпочинку. Щоразу на початку застосування можете збільшити ефективний рівень заклинання на 1.\n\nТримаючи книгу, ви також маєте такі переваги.\n\n**Міць невмерлих.** Коли заклинання Некромантії створює або прикликає Невмерлого, його максимальні й поточні хіти збільшуються на модифікатор Інтелекту + половину рівня чарівника з округленням донизу.\n\n**Виснажливий удар.** Коли контрольований вами Невмерлий у межах 60 футів влучає атакою, він завдає додаткової некротичної шкоди, що дорівнює модифікатору Інтелекту (щонайменше 1)."},{"level":6,"name":"Сила могили","engName":"Necromancer: Grave Power (2024)","description":"Ви записали до книги нові некромантичні прозріння. Тримаючи її, маєте такі переваги.\n\n**Стійкість могили.** Коли ви використовуєте Арканне відновлення, ваш рівень Виснаження, якщо він є, зменшується на 1.\n\n**Нездоланний некроз.** Некротична шкода ваших заклинань і рис чарівника ігнорує опір некротичній шкоді."},{"level":10,"name":"Жнива невмерлих","engName":"Necromancer: Harvest Undead (2024)","description":"Одразу після того, як від шкоди ви стаєте Закривавленими, але ваші хіти не зменшуються до 0, ви можете реакцією зменшити до 0 хіти видимого контрольованого вами Невмерлого. Після цього ви негайно відновлюєте хіти в кількості вашого рівня чарівника."},{"level":14,"name":"Володар смерті","engName":"Necromancer: Death's Master (2024)","description":"Таємні ритуали у книзі дають владу над невмертям. Тримаючи її, ви маєте такі переваги.\n\n**Зміцнення невмерлих.** Бонусною дією оберіть будь-яку кількість Невмерлих у межах 60 футів, створених або прикликаних вашим заклинанням Некромантії. Кожен отримує тимчасові хіти в кількості вашого рівня чарівника. Перевага відновлюється після довгого відпочинку.\n\n**Знищення невмерлого.** Коли видимий Невмерлий зменшує хіти до 0, ви можете підірвати його некротичною енергією. Киньте кількість к6, що дорівнює половині його невитрачених Кубиків хітів з округленням угору (щонайменше 1к6). Кожна істота в межах 10-футової еманації робить ряткидок Спритності: у разі провалу отримує суму як некротичну шкоду й не може виконувати реакції до початку наступного ходу, у разі успіху — лише половину шкоди. Щоб підірвати неконтрольованого вами Невмерлого, ви мусите реакцією витратити слот 5-го або вищого рівня."}]},{"name":"Прикликач","engName":"Conjurer","slug":"conjurer","kind":"Підклас","description":"Прикликач вважає відстань і матерію радше гнучкими настановами, ніж законами природи. Прикликачі опановують магію, що миттєво переносить істот крізь простір і прикликає створінь битися замість них.","features":[{"level":3,"name":"Доброзичливе переміщення","engName":"Conjurer: Benign Transposition (2024)","description":"Бонусною дією ви телепортуєтеся на відстань до 30 футів у видимий вільний простір. Натомість можете обрати простір у межах дальності, зайнятий істотою Середнього або меншого розміру. Якщо вона згодна, ви обоє телепортуєтеся, міняючись місцями.\n\nВи можете використати цю рису кількість разів, що дорівнює модифікатору Інтелекту (щонайменше один раз), і відновлюєте всі використання після довгого відпочинку."},{"level":3,"name":"Знавець прикликання","engName":"Conjurer: Conjuration Savant (2024)","description":"Оберіть два заклинання чарівника школи Прикликання не вище 2-го рівня й безкоштовно додайте їх до своєї книги заклинань.\n\nКрім того, щоразу, коли в цьому класі отримуєте доступ до слотів нового рівня, можете безкоштовно додати до книги одне заклинання чарівника школи Прикликання того рівня, для якого маєте слоти."},{"level":6,"name":"Далеке переміщення","engName":"Conjurer: Distant Transposition (2024)","description":"Дальність вашого Доброзичливого переміщення збільшується до 60 футів. Крім того, ви можете відновити одне його використання, витративши слот заклинань 3-го або вищого рівня (дія не потрібна)."},{"level":6,"name":"Стійкі прикликані істоти","engName":"Conjurer: Durable Summons (2024)","description":"Коли ви витрачаєте слот, щоб застосувати заклинання Прикликання, яке прикликає або створює істоту, при першій появі ця істота отримує тимчасові хіти в кількості, що дорівнює подвоєному вашому рівню чарівника. Поки вона має ці тимчасові хіти, вона має опір усім типам шкоди, крім силової, некротичної, психічної та променевої."},{"level":10,"name":"Зосереджене прикликання","engName":"Conjurer: Focused Conjuration (2024)","description":"Отримання шкоди не може перервати вашу Концентрацію на заклинаннях Прикликання."},{"level":14,"name":"Розділене прикликання","engName":"Conjurer: Splintered Summons (2024)","description":"Коли ви витрачаєте слот, щоб застосувати заклинання Прикликання, яке прикликає духа з блоком статистики в описі заклинання, як-от Виклик аберації, можете змінити заклинання, щоб прикликати двох істот замість однієї. Обидві істоти одного виду, використовують зазначені блок статистики й правила та зʼявляються в різних обраних вами вільних просторах у межах дальності, але максимальні й поточні хіти кожної зменшуються вдвічі. Якщо ви втрачаєте Концентрацію, зникають обидві істоти.\n\nПісля такої зміни заклинання ви не можете зробити це знову до завершення довгого відпочинку. Також можна відновити використання, витративши слот 5-го або вищого рівня (дія не потрібна)."}]},{"name":"Провидець","engName":"Diviner","slug":"diviner","kind":"Підклас","description":"До поради Провидця звертаються ті, хто прагне яснішого розуміння минулого, теперішнього й майбутнього. Як Провидець, ви прагнете розсунути завіси простору, часу й свідомості. Ви працюєте над опануванням заклинань розпізнавання, віддаленого спостереження, надприродного знання й передбачення.","features":[{"level":3,"name":"Знавець Ворожіння","engName":"Diviner: Divination Savant (2024)","description":"Оберіть два заклинання Чарівника зі школи Ворожіння, кожне з яких не вище 2 рівня, і додайте їх до своєї книги заклинань безкоштовно.\n\nКрім того, щоразу, коли ви отримуєте доступ до нового рівня слотів заклинань у цьому класі, ви можете додати одне заклинання Чарівника школи Ворожіння до своєї книги заклинань безкоштовно. Обране заклинання повинно бути рівня, для якого у вас є слоти заклинань."},{"level":3,"name":"Передвістя","engName":"Diviner: Portent (2024)","description":"Проблиски майбутнього починають тиснути на вашу свідомість. Щоразу, коли ви завершуєте довгий відпочинок, киньте два к20 і запишіть отримані числа. Ви можете замінити будь-яку Перевірку к20, зроблену вами чи істотою, яку ви бачите, одним з цих провісних кидків. Ви повинні обрати це до кидка, і ви можете замінити кидок у такий спосіб лише раз на хід.\n\nКожен провісний кидок можна використати лише один раз. Коли ви завершуєте довгий відпочинок, ви втрачаєте всі невикористані провісні кидки."},{"level":6,"name":"Майстерне Ворожіння","engName":"Diviner: Expert Divination (2024)","description":"Накладання заклинань школи Ворожіння дається вам настільки легко, що витрачає лише частину ваших зусиль на накладання заклинань. Коли ви накладаєте заклинання школи Ворожіння за допомогою слота заклинань 2 рівня чи вищого, ви відновлюєте один витрачений слот заклинань. Відновлений слот повинен бути нижчого рівня, ніж витрачений, і не може бути вищим за 5 рівень."},{"level":10,"name":"Третє Око","engName":"Diviner: The Third Eye (2024)","description":"Ви можете посилити свою здатність до сприйняття. Бонусною дією оберіть одну з наведених нижче переваг, яка триває, доки ви не почнете короткий чи довгий відпочинок. Ви не можете використати цю рису знову, доки не завершите короткий чи довгий відпочинок.\n\n**Темнозір.** Ви отримуєте темнозір з дистанцією 120 футів.\n\n**Більше Розуміння.** Ви можете читати будь-якою мовою.\n\n**Бачення невидимого [See Invisibility].** Ви можете накласти Бачення невидимого [See Invisibility] без витрати слота заклинань."},{"level":14,"name":"Більше Передвістя","engName":"Diviner: Greater Portent (2024)","description":"Видіння у ваших снах посилюються й малюють у вашій свідомості точнішу картину того, що на вас чекає. Кидайте три к20 для своєї риси Передвістя замість двох."}]},{"name":"Співець клинка","engName":"Bladesinger","slug":"bladesinger","kind":"Підклас","description":"Співці клинка опановують традицію чарівництва, що поєднує фехтування з танцем. У бою співець клинка виконує складні, витончені маневри, які відводять шкоду й дозволяють спрямовувати магію в нищівні атаки та хитромудрий захист. Багато хто, побачивши співця клинка в дії, памʼятає це видовище як одне з найпрекрасніших у своєму житті — величний танець під спів клинка.","features":[{"level":3,"name":"Навчання війни й пісні","engName":"Bladesinger: Training in War and Song (2024)","description":"Ви отримуєте володіння всією рукопашною військовою зброєю без властивостей Дворучна або Важка. Рукопашну зброю, якою володієте, ви можете використовувати як Заклинальне фокусування для заклинань чарівника.\n\nТакож ви отримуєте володіння однією навичкою на вибір: Акробатика, Атлетика, Виступ або Переконання."},{"level":3,"name":"Пісня клинка","engName":"Bladesinger: Bladesong (2024)","description":"Бонусною дією ви закликаєте ельфійську магію Пісні клинка, якщо не носите обладунків і не використовуєте щит.\n\nПісня триває 1 хвилину й завершується достроково, якщо ви Недієздатні, надягаєте обладунок або щит чи використовуєте дві руки для атаки зброєю. Ви можете припинити її будь-коли без дії.\n\nВи можете закликати Пісню клинка кількість разів, що дорівнює модифікатору Інтелекту (щонайменше один раз), відновлюєте всі використання після довгого відпочинку й одне використання після застосування Арканного відновлення. Поки пісня активна, ви маєте такі переваги.\n\n**Спритність.** Ви отримуєте бонус до КЗ, що дорівнює модифікатору Інтелекту (щонайменше +1), ваша Швидкість збільшується на 10 футів, а перевірки Спритності (Акробатики) мають перевагу.\n\n**Робота клинком.** Атакуючи зброєю, якою володієте, ви можете використовувати модифікатор Інтелекту замість Сили чи Спритності для кидків атаки й шкоди.\n\n**Зосередження.** До ряткидка Статури для підтримання Концентрації ви можете додати модифікатор Інтелекту."},{"level":6,"name":"Додаткова атака","engName":"Bladesinger: Extra Attack (2024)","description":"Коли у свій хід ви виконуєте дію Атака, то можете атакувати двічі замість одного разу. Крім того, замість однієї з цих атак можете застосувати замовляння чарівника з часом застосування одна дія."},{"level":10,"name":"Пісня захисту","engName":"Bladesinger: Song of Defense (2024)","description":"Коли ви отримуєте шкоду під час дії Пісні клинка, то можете реакцією витратити слот заклинань і зменшити шкоду на величину, що дорівнює пʼятикратному рівню слота."},{"level":14,"name":"Пісня перемоги","engName":"Bladesinger: Song of Victory (2024)","description":"Після застосування заклинання з часом застосування одна дія ви можете бонусною дією зробити одну атаку зброєю."}]},{"name":"Трансмутаційник","engName":"Transmuter","slug":"transmuter","kind":"Підклас","description":"Ви вивчаєте заклинання, що змінюють енергію й матерію, — для вас світ цілком мінливий. Своєю магією ви стаєте ковалем біля горнила реальності.","features":[{"level":3,"name":"Дивовижна зміна","engName":"Transmuter: Wondrous Alteration (2024)","description":"Зміна вигляду завжди підготовлена у вас, і ви можете один раз застосувати її без слота; здатність відновлюється після довгого відпочинку. Під дією заклинання кожна його опція дає додаткову перевагу.\n\n**Водна адаптація.** Під водою ви можете бонусною дією виконувати Ривок.\n\n**Зміна зовнішності.** Ви маєте перевагу на перевірки Харизми (Обману).\n\n**Природна зброя.** Шкода нового наросту стає 2к6 відповідного типу; ви також маєте перевагу на ряткидки Статури для підтримання Концентрації."},{"level":3,"name":"Знавець трансмутації","engName":"Transmuter: Transmutation Savant (2024)","description":"Оберіть два заклинання чарівника школи Трансмутації не вище 2-го рівня й безкоштовно додайте їх до книги заклинань. Щоразу, коли в цьому класі отримуєте доступ до слотів нового рівня, можете безкоштовно додати ще одне заклинання чарівника школи Трансмутації того рівня, для якого маєте слоти."},{"level":3,"name":"Камінь трансмутаційника","engName":"Transmuter: Transmuter's Stone (2024)","description":"Після довгого відпочинку ви можете створити Крихітний магічний камінь, що існує до наступного використання риси й може бути Заклинальним фокусуванням для ваших заклинань чарівника. Істота, яка його носить, отримує володіння ряткидками Статури й одну обрану під час створення перевагу. Ви можете змінити перевагу, коли витрачаєте слот на заклинання Трансмутації.\n\n**Темний зір.** Носій отримує темний зір 60 футів або збільшує дальність на 60 футів.\n\n**Опір.** Носій отримує опір кислотній, холодній, вогняній, блискавичній, отруйній або громовій шкоді на ваш вибір.\n\n**Швидкість.** Швидкість носія збільшується на 10 футів."},{"level":6,"name":"Посилена трансмутація","engName":"Transmuter: Empowered Transmutation (2024)","description":"Коли ви витрачаєте слот на заклинання Трансмутації, яке не робить кидка атаки й не змушує робити ряткидок, як-от Політ або Магічна зброя, можете збільшити його ефективний рівень на 1. Ви можете використати рису кількість разів, що дорівнює модифікатору Інтелекту (щонайменше один раз), і відновлюєте всі використання після довгого відпочинку."},{"level":10,"name":"Могутній камінь","engName":"Transmuter: Potent Stone (2024)","description":"Ваш Камінь трансмутаційника стає універсальнішим. Створюючи його, можете обрати до двох переваг. Кожну, крім Опору, можна обрати лише раз; обираючи Опір двічі, треба взяти різні типи шкоди. Коли витрачаєте слот на заклинання Трансмутації, можете змінити одну або обидві переваги. Також відкриваються нові опції.\n\n**Могутня статура.** Носій має перевагу на ряткидки Сили й вважається на один розмір більшим для вантажності.\n\n**Віброчуття.** Носій отримує віброчуття на 30 футів."},{"level":10,"name":"Перевертень","engName":"Transmuter: Shape-Shifter (2024)","description":"Перевтілення завжди підготовлене у вас, і ви можете один раз застосувати його без слота; здатність відновлюється після довгого відпочинку. Один раз за довгий відпочинок, обираючи себе ціллю, ви можете змінити заклинання.\n\n**Ігрові показники.** Окрім рис, збережених за текстом заклинання, ви зберігаєте памʼять і здатність спілкуватися, показники Інтелекту, Мудрості й Харизми, володіння, класові риси та риси.\n\n**Трансмутаційні заклинання.** У зміненій формі ви можете застосовувати заклинання, але лише Трансмутації без матеріального компонента з указаною вартістю або такого, що витрачається."},{"level":14,"name":"Майстер трансмутації","engName":"Transmuter: Master Transmuter (2024)","description":"Несучи Камінь трансмутаційника, ви можете дією Магія витратити запас магії всередині й обрати одну перевагу, після чого камінь розсипається. Ви можете запобігти цьому, витративши слот 7-го або вищого рівня як частину дії.\n\n**Велике перетворення.** За 10 хвилин роботи ви перетворюєте немагічний предмет розміром не більше 10-футового куба або восьми суміжних 5-футових кубів на інший немагічний предмет подібних розміру й маси та не більшої вартості.\n\n**Панацея.** Ви торкаєтеся істоти; вона відновлює половину максимуму хітів з округленням донизу, зцілюється від усіх магічних заражень і проклять, включно з Налаштуванням на проклятий предмет, а стани Отруєний і Скамʼянілий завершуються.\n\n**Повернення до життя.** Ви застосовуєте Оживлення мерців без слота, використовуючи камінь замість матеріальних компонентів.\n\n**Повернення молодості.** Ви торкаєтеся згодної істоти; її рівень Виснаження стає 0, а вигляд назавжди молодшає на 3к10 років, але не нижче ранньої дорослості."}]}]},{"edition":"2024","name":"Варвар","engName":"Barbarian","slug":"barbarian","description":"Варвари — могутні воїни, яких живлять первісні сили мультивсесвіту, що проявляються як Лють. Ця Лють — більше, ніж просто емоція, і не зводиться до гніву: у ній втілені несамовитість хижака, шал бурі й буремність моря. Дехто з варварів уособлює свою Лють як грізного духа чи шанованого предка. Інші бачать у ній звʼязок із болем і стражданнями світу, безособовий клубок дикої магії або вияв власного найглибшого «я». Для кожного варвара Лють — це сила, що живить не лише бойову майстерність, а й неймовірні рефлекси та загострені чуття.\n\nВарвари часто стають захисниками й провідниками своїх громад. Вони стрімголов кидаються назустріч небезпеці, щоб тим, кого вони захищають, не довелося цього робити. Мужність перед лицем небезпеки робить варварів якнайкраще придатними до пригод.","facts":["Кістка хітів: к12","Підклас з 3 рівня","4 підкласів"],"features":[{"level":1,"name":"Захист без броні","engName":"Barbarian: Unarmored Defense (2024)","description":"Поки ви не носите жодних обладунків, ваш базовий Клас Броні дорівнює 10 плюс ваші модифікатори Спритності та Статури. Ви можете користуватися Щитом і все одно отримувати цю перевагу."},{"level":1,"name":"Лють","engName":"Barbarian: Rage (2024)","description":"Ви можете наповнити себе первісною силою, що зветься Лють, — вона дарує вам надзвичайну міць і стійкість. Ви входите в неї бонусною дією, якщо не носите важкі обладунки.\n\nВи можете входити в Лють стільки разів, скільки показано для вашого рівня варвара в колонці «Лють» таблиці фіч Варвара. Ви відновлюєте одне витрачене використання, коли завершуєте короткий відпочинок, і всі витрачені використання — коли завершуєте довгий відпочинок.\n\nПоки Лють активна, вона підпорядковується наведеним нижче правилам.\n\n**Опір до шкоди.** Ви маєте опір дроблячій, колючій і рублячій шкоді.\n\n**Шкода від Люті.** Коли ви робите атаку на основі Сили — зброєю або Беззбройним ударом — і завдаєте шкоди цілі, ви отримуєте бонус до шкоди, який зростає з вашими рівнями варвара, як показано в колонці «Шкода від Люті» таблиці фіч Варвара.\n\n**Перевага на Силу.** Ви маєте Перевагу на перевірки Сили та ряткидки Сили.\n\n**Ні Концентрації, ні заклинань.** Ви не можете підтримувати Концентрацію і не можете накладати заклинання.\n\n**Тривалість.** Лють триває до кінця вашого наступного ходу й закінчується раніше, якщо ви вдягаєте важкі обладунки або отримуєте стан Недієздатний. Якщо ваша Лють усе ще активна у ваш наступний хід, ви можете продовжити її ще на раунд, зробивши одне з такого:\n\n- Зробити кидок атаки проти ворога.\n- Змусити ворога зробити ряткидок.\n- Витратити бонусну дію, щоб продовжити Лють.\n\nЩоразу, коли Лють продовжується, вона триває до кінця вашого наступного ходу. Ви можете підтримувати Лють до 10 хвилин."},{"level":1,"name":"Майстерність зброї","engName":"Barbarian: Weapon Mastery (2024)","description":"Ваше тренування зі зброєю дозволяє вам користуватися властивостями майстерності двох видів простої або бойової зброї ближнього бою на ваш вибір, наприклад Великих сокир і Ручних сокир. Щоразу, коли ви завершуєте довгий відпочинок, ви можете попрактикуватися у вправах зі зброєю і змінити один із цих виборів.\n\nКоли ви досягаєте певних рівнів варвара, ви отримуєте здатність користуватися властивостями майстерності більшої кількості видів зброї, як показано в колонці «Майстерність зброї» таблиці фіч Варвара."},{"level":2,"name":"Безрозсудна атака","engName":"Barbarian: Reckless Attack (2024)","description":"Ви можете відкинути будь-яку турботу про захист і атакувати з подвоєною люттю. Коли ви робите свій перший кидок атаки у свій хід, ви можете вирішити атакувати безрозсудно. Це дає вам Перевагу на кидки атаки на основі Сили до початку вашого наступного ходу, але кидки атаки проти вас теж мають Перевагу протягом цього часу."},{"level":2,"name":"Відчуття небезпеки","engName":"Barbarian: Danger Sense (2024)","description":"Ви набуваєте надприродного чуття на те, коли щось іде не так, і це дає вам перевагу, коли ви ухиляєтеся від небезпек. Ви маєте Перевагу на ряткидки Спритності, якщо тільки не маєте стану Недієздатний."},{"level":3,"name":"Первісне знання","engName":"Barbarian: Primal Knowledge (2024)","description":"Ви отримуєте Володіння ще однією навичкою на ваш вибір зі списку навичок, доступних Варварам на 1 рівні.\n\nКрім того, поки ваша Лють активна, ви можете спрямовувати первісну силу, беручись за певні завдання: щоразу, коли ви робите перевірку характеристики з однією з наведених навичок, ви можете зробити її як перевірку Сили, навіть якщо зазвичай вона використовує іншу характеристику: Акробатика, Залякування, Уважність, Непомітність або Виживання. Коли ви користуєтеся цією здібністю, ваша Сила уособлює первісну міць, що тече крізь вас, загострюючи вашу спритність, поставу й чуття."},{"level":3,"name":"Підклас Варвара","engName":"Barbarian: Barbarian Subclass (2024)","description":"Ви отримуєте підклас Варвара на ваш вибір. Підкласи Шлях берсерка, Шлях Дикого Серця, Шлях Світового Дерева та Шлях фанатика описані після опису цього класу. Підклас — це спеціалізація, яка дає вам фічі на певних рівнях варвара. До кінця вашої карʼєри ви отримуєте кожну фічу свого підкласу, рівень якої не перевищує вашого рівня варвара."},{"level":4,"name":"Покращення Характеристик","engName":"Barbarian: Ability Score Improvement (2024)","description":"Ви отримуєте рису Покращення Характеристик або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Ви отримуєте цю фічу знову на 8, 12 і 16 рівнях варвара."},{"level":5,"name":"Додаткова атака","engName":"Barbarian: Extra Attack (2024)","description":"Ви можете атакувати двічі замість одного разу щоразу, коли у свій хід виконуєте дію Атака."},{"level":5,"name":"Швидкий рух","engName":"Barbarian: Fast Movement (2024)","description":"Ваша Швидкість збільшується на 10 футів, поки ви не носите важкі обладунки."},{"level":7,"name":"Дикий інстинкт","engName":"Barbarian: Feral Instinct (2024)","description":"Ваші інстинкти загострені настільки, що ви маєте Перевагу на кидки Ініціативи."},{"level":7,"name":"Інстинктивний стрибок","engName":"Barbarian: Instinctive Pounce (2024)","description":"У межах тієї ж бонусної дії, якою ви входите в Лють, ви можете пересунутися на відстань до половини своєї Швидкості."},{"level":9,"name":"Жорстокий удар","engName":"Barbarian: Brutal Strike (2024)","description":"Якщо ви застосовуєте Безрозсудну атаку, ви можете відмовитися від будь-якої Переваги на один кидок атаки на основі Сили на ваш вибір у свій хід. Обраний кидок атаки не повинен мати Перешкоди. Якщо обраний кидок атаки влучає, ціль отримує додаткові 1к10 шкоди того самого типу, що завдає зброя або Беззбройний удар, і ви можете викликати один ефект Жорстокого удару на ваш вибір.\n\nВи маєте такі варіанти ефектів.\n\n**Могутній удар.** Ціль відштовхується на 15 футів прямо від вас. Після цього ви можете пересунутися на відстань до половини своєї Швидкості прямо до цілі, не провокуючи Принагідних атак.\n\n**Підріз.** Швидкість цілі зменшується на 15 футів до початку вашого наступного ходу. На ціль може діяти лише один Підріз одночасно — найновіший."},{"level":11,"name":"Невпинна лють","engName":"Barbarian: Relentless Rage (2024)","description":"Ваша Лють може тримати вас у бою навіть попри тяжкі рани. Якщо ви падаєте до 0 ХП, поки ваша Лють активна, і не гинете відразу, ви можете зробити ряткидок Статури зі СК 10. При успіху ваші ХП натомість змінюються на число, що дорівнює подвоєному рівню варвара.\n\nЩоразу, коли ви користуєтеся цією фічею після першого разу, СК зростає на 5. Коли ви завершуєте короткий або довгий відпочинок, СК повертається до 10."},{"level":13,"name":"Покращений жорстокий удар","engName":"Barbarian: Improved Brutal Strike L13 (2024)","description":"Ви відточили нові способи люто атакувати. Наведені ефекти тепер теж входять до ваших варіантів Жорстокого удару.\n\n**Приголомшливий удар.** Ціль має Перешкоду на наступний ряткидок, який робить, і не може робити Принагідних атак до початку вашого наступного ходу.\n\n**Розколюючий удар.** До початку вашого наступного ходу наступний кидок атаки, зроблений іншим створінням проти цієї цілі, отримує бонус +5. Кидок атаки може отримати лише один бонус від Розколюючого удару."},{"level":15,"name":"Постійна лють","engName":"Barbarian: Persistent Rage (2024)","description":"Коли ви кидаєте Ініціативу, ви можете відновити всі витрачені використання Люті. Відновивши використання Люті в такий спосіб, ви не можете зробити це знову, доки не завершите довгий відпочинок.\n\nКрім того, ваша Лють настільки шалена, що тепер триває 10 хвилин без потреби робити щось для її продовження з раунду в раунд. Ваша Лють закінчується раніше, якщо ви отримуєте стан Непритомний (а не просто стан Недієздатний) або вдягаєте важкі обладунки."},{"level":17,"name":"Покращений жорстокий удар","engName":"Barbarian: Improved Brutal Strike L17 (2024)","description":"Додаткова шкода вашого Жорстокого удару зростає до 2к10. Крім того, ви можете застосувати два різні ефекти Жорстокого удару щоразу, коли користуєтеся фічею Жорстокий удар."},{"level":18,"name":"Незламна міць","engName":"Barbarian: Indomitable Might (2024)","description":"Якщо ваш підсумок перевірки Сили або ряткидка Сили менший за ваше значення Сили, ви можете використати це значення замість підсумку."},{"level":19,"name":"Епічний Дар","engName":"Barbarian: Epic Boon (2024)","description":"Ви отримуєте рису Епічного Дару або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Рекомендується Дар Незворотного Нападу."},{"level":20,"name":"Первісний чемпіон","engName":"Barbarian: Primal Champion (2024)","description":"Ви уособлюєте первісну силу. Ваші значення Сили та Статури зростають на 4, до максимуму 25."}],"children":[{"name":"Шлях берсерка","engName":"Path of the Berserker","slug":"path-of-the-berserker","kind":"Підклас","description":"Варвари, що йдуть Шляхом берсерка, спрямовують свою Лють насамперед на насильство. Їхній шлях — це шлях нестримної люті: вони тішаться хаосом бою, дозволяючи Люті охопити й наповнити їх силою.","features":[{"level":3,"name":"Шаленство","engName":"Path of the Berserker: Frenzy (2024)","description":"Якщо ви застосовуєте Безрозсудну атаку, поки ваша Лють активна, ви завдаєте додаткової шкоди першій цілі, по якій влучаєте у свій хід атакою на основі Сили. Щоб визначити додаткову шкоду, киньте кількість к6, що дорівнює вашому бонусу шкоди від Люті, і додайте результати. Шкода має той самий тип, що й зброя чи Беззбройний удар, використані для атаки."},{"level":6,"name":"Безтямна Лють","engName":"Path of the Berserker: Mindless Rage (2024)","description":"Поки ваша Лють активна, ви маєте імунітет до станів Причарований та Наляканий. Якщо ви Причаровані або Налякані на момент входу в Лють, цей стан на вас закінчується."},{"level":10,"name":"Відплата","engName":"Path of the Berserker: Retaliation (2024)","description":"Коли ви отримуєте шкоду від створіння, яке перебуває в межах 5 футів від вас, ви можете реакцією зробити одну атаку ближнього бою проти цього створіння, використовуючи зброю або Беззбройний удар."},{"level":14,"name":"Заляклива Присутність","engName":"Path of the Berserker: Intimidating Presence (2024)","description":"Бонусною дією ви можете вселити жах в інших своєю грізною присутністю та первісною силою. Роблячи так, кожне обране вами створіння у 30-футовому Випромінюванні від вас має пройти ряткидок Мудрості (СК 8 плюс ваш модифікатор Сили та Бонус Майстерності). При провалі створіння отримує стан Наляканий на 1 хвилину. Наприкінці кожного свого ходу налякане створіння повторює ряткидок, припиняючи ефект на собі при успіху.\n\nВикориставши цю рису, ви не можете застосувати її знову, доки не завершите довгий відпочинок, хіба що витратите використання Люті (дія не потрібна), щоб відновити можливість її застосування."}]},{"name":"Шлях Дикого Серця","engName":"Path of the Wild Heart","slug":"path-of-the-wild-heart","kind":"Підклас","description":"Варвари, що йдуть Шляхом Дикого Серця, вважають себе спорідненими з тваринами. Ці варвари опановують магічні способи спілкування з тваринами, а їхня Лють посилює цей звʼязок, наповнюючи їх надприродною міццю.","features":[{"level":3,"name":"Лють Дикого Світу","engName":"Path of the Wild Heart: Rage of the Wilds (2024)","description":"Ваша Лють черпає первісну силу тварин. Щоразу, активуючи Лють, ви отримуєте один із варіантів на вибір.\n\n**Ведмідь.** Поки ваша Лють активна, ви маєте опір до всіх типів шкоди, крім шкоди Силовим Полем, некротичної, психічної та променевої.\n\n**Орел.** Активуючи Лють, ви можете виконати дії Відступ та Ривок як частину цієї бонусної дії. Поки ваша Лють активна, ви можете бонусною дією виконати обидві ці дії.\n\n**Вовк.** Поки ваша Лють активна, ваші союзники мають перевагу на кидки атаки проти будь-якого вашого ворога в межах 5 футів від вас."},{"level":3,"name":"Розмова з Тваринами","engName":"Path of the Wild Heart: Animal Speaker (2024)","description":"Ви можете накладати заклинання Тваринне чуття [Beast Sense] та Розмова з тваринами [Speak with Animals], але лише як Ритуали. Мудрість — ваша характеристика чаротворення для них."},{"level":6,"name":"Подоба Дикого Світу","engName":"Path of the Wild Heart: Aspect of the Wilds (2024)","description":"Ви отримуєте один із варіантів на вибір. Щоразу, завершуючи довгий відпочинок, ви можете змінити свій вибір.\n\n**Сова.** Ви маєте темнозір у радіусі 60 футів. Якщо у вас уже є темнозір, його радіус збільшується на 60 футів.\n\n**Пантера.** Ви маєте швидкість лазіння, що дорівнює вашій швидкості ходьби.\n\n**Лосось.** Ви маєте швидкість плавання, що дорівнює вашій швидкості ходьби."},{"level":10,"name":"Розмова з Природою","engName":"Path of the Wild Heart: Nature Speaker (2024)","description":"Ви можете накладати заклинання Звернення до природи [Commune with Nature], але лише як Ритуал. Мудрість — ваша характеристика чаротворення для нього."},{"level":14,"name":"Сила Дикого Світу","engName":"Path of the Wild Heart: Power of the Wilds (2024)","description":"Щоразу, активуючи Лють, ви отримуєте один із варіантів на вибір.\n\n**Сокіл.** Поки ваша Лють активна, ви маєте швидкість польоту, що дорівнює вашій швидкості ходьби, якщо ви не носите броню.\n\n**Лев.** Поки ваша Лють активна, будь-які ваші вороги в межах 5 футів від вас мають перешкоду на кидки атаки проти цілей, відмінних від вас або іншого варвара з активним цим варіантом.\n\n**Баран.** Поки ваша Лють активна, ви можете повалити Велике або менше створіння (стан Повалений), якщо влучаєте по ньому атакою ближнього бою."}]},{"name":"Шлях Світового Дерева","engName":"Path of the World Tree","slug":"path-of-the-world-tree","kind":"Підклас","description":"Варвари, що йдуть Шляхом Світового Дерева, через свою Лють зʼєднуються з космічним деревом Іґґдрасіль. Це дерево росте серед Зовнішніх Планів, зʼєднуючи їх одна з одною та з Матеріальним Планом. Ці варвари черпають з магії дерева життєву силу, а також використовують її як засіб мандрів між вимірами.","features":[{"level":3,"name":"Життєва Сила Дерева","engName":"Path of the World Tree: Vitality of the Tree (2024)","description":"Ваша Лють черпає життєву силу Світового Дерева. Ви отримуєте такі переваги.\n\n**Сплеск Життєвої Сили.** Активуючи Лють, ви отримуєте тимчасові ХП у кількості, що дорівнює вашому рівню варвара.\n\n**Життєдайна Сила.** На початку кожного свого ходу, поки ваша Лють активна, ви можете обрати інше створіння в межах 10 футів від себе, щоб воно отримало тимчасові ХП. Щоб визначити кількість тимчасових ХП, киньте кількість к6, що дорівнює вашому бонусу шкоди від Люті, і додайте результати. Якщо ці тимчасові ХП лишаються невитраченими, коли ваша Лють закінчується, вони зникають."},{"level":6,"name":"Гілки Дерева","engName":"Path of the World Tree: Branches of the Tree (2024)","description":"Щоразу, коли створіння, яке ви бачите, починає свій хід у межах 30 футів від вас, поки ваша Лють активна, ви можете реакцією викликати примарні гілки Світового Дерева навколо нього. Ціль має пройти ряткидок Сили (СК 8 плюс ваш модифікатор Сили та Бонус Майстерності), інакше телепортується у вільний простір, який ви бачите в межах 5 футів від себе, або в найближчий вільний простір, який ви бачите. Після телепортації цілі ви можете знизити її швидкість до 0 до кінця поточного ходу."},{"level":10,"name":"Таранне Коріння","engName":"Path of the World Tree: Battering Roots (2024)","description":"У свій хід ваша досяжність будь-якою зброєю ближнього бою з властивістю Важка або Універсальна на 10 футів більша, оскільки від вас простягаються пагони Світового Дерева. Коли ви влучаєте такою зброєю у свій хід, ви можете застосувати властивість майстерності Поштовх або Повалення на додачу до іншої властивості майстерності, яку використовуєте з цією зброєю."},{"level":14,"name":"Мандрівка по Дереву","engName":"Path of the World Tree: Travel along the Tree (2024)","description":"Активуючи Лють, а також бонусною дією, поки ваша Лють активна, ви можете телепортуватися на відстань до 60 футів у вільний простір, який бачите. Крім того, раз за Лють ви можете збільшити дальність цієї телепортації до 150 футів. Роблячи так, ви можете також узяти із собою до шести згодних створінь у межах 10 футів від себе. Кожне створіння телепортується у вільний простір на ваш вибір у межах 10 футів від вашого пункту призначення."}]},{"name":"Шлях фанатика","engName":"Path of the Zealot","slug":"path-of-the-zealot","kind":"Підклас","description":"Варвари, що йдуть Шляхом фанатика, отримують дари від бога чи пантеону. Ці варвари переживають свою Лють як екстатичний момент божественної єдності, що наповнює їх силою. Вони часто стають союзниками жерців та інших послідовників свого бога чи пантеону.","features":[{"level":3,"name":"Божественна Лють","engName":"Path of the Zealot: Divine Fury (2024)","description":"Ви можете спрямовувати божественну силу у свої удари. У кожен свій хід, поки ваша Лють активна, перше створіння, по якому ви влучаєте зброєю чи Беззбройним ударом, отримує додаткову шкоду 1к6 плюс половина вашого рівня варвара (округлено вниз). Додаткова шкода — некротична або променева; ви обираєте тип щоразу, завдаючи цю шкоду."},{"level":3,"name":"Воїн Богів","engName":"Path of the Zealot: Warrior of the Gods (2024)","description":"Божественна сутність допомагає вам і надалі продовжувати бій. Ви маєте запас із чотирьох к12, які можете витрачати, щоб зцілювати себе. Бонусною дією ви можете витратити кубики із запасу, кинути їх і відновити кількість ХП, що дорівнює сумі кидка.\n\nВаш запас відновлює всі витрачені кубики, коли ви завершуєте довгий відпочинок.\n\nМаксимальна кількість кубиків у запасі збільшується на один, коли ви досягаєте рівнів варвара 6 (5 кубиків), 12 (6 кубиків) та 17 (7 кубиків)."},{"level":6,"name":"Фанатична Зосередженість","engName":"Path of the Zealot: Fanatical Focus (2024)","description":"Раз за активну Лють, якщо ви провалюєте ряткидок, ви можете перекинути його з бонусом, що дорівнює вашому бонусу шкоди від Люті, і мусите використати новий результат."},{"level":10,"name":"Фанатична Присутність","engName":"Path of the Zealot: Zealous Presence (2024)","description":"Бонусною дією ви видаєте бойовий клич, наповнений божественною енергією. До десяти інших обраних вами створінь у межах 60 футів від вас отримують перевагу на кидки атаки та ряткидки до початку вашого наступного ходу.\n\nВикориставши цю рису, ви не можете застосувати її знову, доки не завершите довгий відпочинок, хіба що витратите використання Люті (дія не потрібна), щоб відновити можливість її застосування."},{"level":14,"name":"Лють Богів","engName":"Path of the Zealot: Rage of the Gods (2024)","description":"Активуючи Лють, ви можете набути подоби божественного воїна. Ця подоба триває 1 хвилину або доки ваші ХП не впадуть до 0. Використавши цю рису, ви не можете застосувати її знову, доки не завершите довгий відпочинок.\n\nПеребуваючи в цій подобі, ви отримуєте переваги нижче.\n\n**Політ.** Ви маєте швидкість польоту, що дорівнює вашій швидкості ходьби, і можете зависати в повітрі.\n\n**Опір.** Ви маєте опір до некротичної, психічної та променевої шкоди.\n\n**Воскресіння.** Коли ХП створіння в межах 30 футів від вас мали б впасти до 0, ви можете реакцією витратити використання Люті, щоб замість цього ХП цілі стали числом, що дорівнює вашому рівню варвара."}]}]}],"races":[{"edition":"2014","name":"Ельф","engName":"Elf","slug":"elf","description":"Ельфи — чарівний народ неземної грації: вони живуть у світі, але не цілком належать йому. Їхні домівки — місця примарної краси посеред прадавніх лісів чи в сріблястих шпилях, що мерехтять казковим світлом, де повітрям пливе тиха музика. Ельфи люблять природу й магію, мистецтво й ремесло, музику й поезію та все добре, що є у світі.\n\nВитончені й стрункі, ельфи живуть понад 700 років, тож на дрібні негаразди, які тривожать короткоживучі народи, дивляться спокійно й відсторонено. Вони частіше розважаються, ніж хвилюються, і частіше цікавляться, ніж жадають. Друзів і ворогів ельфи набувають повільно, а забувають ще повільніше. Перед небезпекою вони гнучкі, як гілля молодого дерева, і воліють дипломатію, та за потреби показують сувору вправність із мечем, луком і стратегією.\n\nБільшість ельфів живе в невеликих лісових селищах, прихованих серед дерев, а за межами своїх земель ельфи найчастіше мандрують як менестрелі, митці чи мудреці.","facts":["30 футів","Середній","9 гілок"],"features":[{"name":"Темнозір","engName":"Darkvision","description":"Ви можете бачити в тьмяному світлі на відстані 60 футів так, ніби це яскраве світло, і в темряві так, ніби це тьмяне світло. Ви не можете розрізняти кольори в темряві, лише відтінки сірого."},{"name":"Гострі чуття","engName":"Keen Senses","description":"Ви маєте володіння навичкою Уважність."},{"name":"Фейське походження","engName":"Fey Ancestry","description":"Ви маєте перевагу при ряткидках проти зачарування, і вас неможливо магічно приспати."},{"name":"Транс","engName":"Trance","description":"Ельфи не потребують сну. Замість цього вони глибоко медитують, перебуваючи в напівсвідомому стані, протягом 4 годин на день. Під час медитації ви можете бачити сни по-своєму; такі сни насправді є розумовими вправами, які стали рефлективними через роки практики. Після такого відпочинку ви отримуєте ті самі переваги, що й людина після 8 годин сну."}],"children":[{"name":"Високий ельф","engName":"High Elf","slug":"subrace:ELF_HIGH_2014","kind":"Підраса","description":"Високі ельфи мають гострий розум і опановують принаймні основи магії. У багатьох світах D&D їх два різновиди: одні зверхні й відлюдькуваті й вважають себе вищими не лише за не-ельфів, а й за інших ельфів, інші — поширеніші, привітніші й часто живуть поруч із людьми.","features":[{"name":"Ельфійська зброя","engName":"Elf Weapon Training","description":"Ви володієте довгим мечем, коротким мечем, коротким луком і довгим луком."},{"name":"Додаткова мова","engName":"Extra Language","description":"Ви можете розмовляти, читати та писати однією додатковою мовою на ваш вибір."},{"name":"Замовляння вищого ельфа","engName":"High Elf Cantrip","description":"Ви знаєте одне замовляння на ваш вибір зі списку заклинань чарівника. Інтелект є вашою заклинальною характеристикою для нього."}]},{"name":"Лісовий ельф","engName":"Wood Elf","slug":"subrace:ELF_WOOD_2014","kind":"Підраса","description":"Лісові ельфи мають гострі чуття й інтуїцію, а легкі ноги швидко й непомітно несуть їх рідними лісами. Здебільшого вони відлюдькуваті й не довіряють не-ельфам.","features":[{"name":"Ельфійська зброя","engName":"Elf Weapon Training","description":"Ви володієте довгим мечем, коротким мечем, коротким луком і довгим луком."},{"name":"Маскування в дикій природі","engName":"Mask of the Wild","description":"Ви можете спробувати сховатися, навіть коли ви лише трохи закриті листям, сильним дощем, снігопадом, туманом або іншим природним явищем."}]},{"name":"Темний ельф (Дроу)","engName":"Dark Elf (Drow)","slug":"subrace:ELF_DARK_DROW_2014","kind":"Підраса","description":"Дроу наповнює магія Підмороку — підземного царства див і жахів, яке рідко бачать із поверхні; вроджена магія вчить їх викликати і світло, і темряву. Культ Лолт, Королеви Павуків, розбестив деякі з найдавніших міст дроу, і герої-дроу стоять на передовій війни проти нього.","features":[{"name":"Вищий темнозір (Дроу)","engName":"Superior Darkvision (Drow)","description":"Ваш темнозір має радіус 120 футів."},{"name":"Чутливість до сонячного світла","engName":"Sunlight Sensitivity","description":"Ви маєте перешкоду на кидки атаки та на перевірки  Уважність (Мудрість), які покладаються на зір, коли ви, ціль вашої атаки або те, що ви намагаєтеся сприйняти, знаходиться під прямим сонячним світлом."},{"name":"Дроуське бойове навчання","engName":"Drow Weapon Training","description":"Ви володієте рапірами, короткими мечами та ручними арбалетами."},{"name":"Магія дроу","engName":"Drow Magic","description":"Ви знаєте заклинання Мерехтливі вогники [Dancing Lights]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Вогники фей [Faerie Fire]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Темрява [Darkness]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою характеристикою для цих заклинань."}]},{"name":"Еладрін (DMG)","engName":"Eladrin (DMG)","slug":"subrace:ELF_ELADRIN_DMG","kind":"Підраса","description":"","features":[{"name":"Ельфійська зброя","engName":"Elf Weapon Training","description":"Ви володієте довгим мечем, коротким мечем, коротким луком і довгим луком."},{"name":"Фейський крок (DMG)","engName":"Fey Step (DMG)","description":"Ви можете використати заклинання Туманний крок [Misty Step] один раз, використовуючи цю рису. Ви відновлюєте можливість зробити це, коли завершуєте короткий або довгий відпочинок."}]},{"name":"Еладрін (MPMM)","engName":"Eladrin (MPMM)","slug":"subrace:ELF_ELADRIN_MPMM","kind":"Підраса","description":"Еладріни — ельфи Фейвайлду, царства небезпечної краси й безмежної магії. Кожен еладрін перегукується з однією з пір року, і вона впливає на його настрій і вигляд; пора може змінюватися, хоча деякі еладріни назавжди лишаються в одній.","features":[{"name":"Фейський крок","engName":"Fey Step","description":"Бонусною дією ви можете магічно телепортуватися на відстань до 30 футів у вільний простір, який ви бачите. Ви можете використовувати цю здібність кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення довгого відпочинку.\n\nКоли ви досягаєте 3-го рівня, ваш Фейський крок отримує додатковий ефект залежно від вашого сезону; якщо ефект вимагає ряткидку, СК дорівнює 8 + ваш Бонус Майстерності + ваш модифікатор Інтелекту, Мудрості або Харизми (ви обираєте при виборі цієї раси):\n\nОсінь. Одразу після того, як ви використовуєте свій Фейський крок, до двох істот на ваш вибір, яких ви бачите у межах 10 футів від вас, повинні здійснити ряткидок Мудрості або стати зачарованими вами на 1 хвилину, або доки ви чи ваші союзники не завдасте будь-якої шкоди цим істотам.\n\nЗима. Коли ви використовуєте свій Фейський крок, одна істота на ваш вибір, яку ви бачите у межах 5 футів від вас перед телепортацією, повинна здійснити ряткидок Мудрості або стати переляканою вами до кінця вашого наступного ходу.\n\nВесна. Коли ви використовуєте свій Фейський крок, ви можете торкнутися однієї бажаючої істоти у межах 5 футів від вас. Ця істота телепортується замість вас, зʼявляючись у вільному просторі на ваш вибір, який ви бачите у межах 30 футів від вас.\n\nЛіто. Одразу після того, як ви використовуєте свій Фейський крок, кожна істота на ваш вибір, яку ви бачите у межах 5 футів від вас, отримує вогняну шкоду, що дорівнює вашому Бонусу Майстерності."}]},{"name":"Морський ельф","engName":"Sea Elf","slug":"subrace:ELF_SEA_MTOF","kind":"Підраса","description":"Морські ельфи закохалися в дику красу океану ще на світанку мультивсесвіту: поки інші ельфи мандрували з царства в царство, вони досліджували глибинні течії й води сотні світів. Нині морські ельфи живуть невеликими прихованими громадами на мілководді й на Стихійному плані Води, а найлютіші їхні вороги — сахуагіни, які вважають усе море своїм.","features":[{"name":"Дитя моря","engName":"Child of the Sea (Sea Elf Subrace)","description":"Ви маєте швидкість плавання 30 футів, і ви можете дихати повітрям і водою."},{"name":"Друг моря","engName":"Friend of the Sea (Sea Elf Subrace)","description":"Використовуючи жести та звуки, ви можете спілкуватися з будь-яким звіром, який має вроджену швидкість плавання."}]},{"name":"Шадар-Кай","engName":"Shadar-Kai","slug":"subrace:ELF_SHADAR_KAI_MPMM","kind":"Підраса","description":"Шадар-каї — ельфи Царства тіней, яких колись привабила туди Королева Воронів. Похмура енергія цього плану змінила їх, і тепер вони існують у стані між життям і смертю; одні й досі служать Королеві, інші вирушили на Матеріальний план кувати власну долю.","features":[{"name":"Гострі чуття","engName":"Keen Senses","description":"Ви маєте володіння навичкою Уважність."},{"name":"Благословення Королеви Воронів","engName":"Blessing of the Raven Queen (Shadar-kai Subrace)","description":"Бонусною дією ви можете магічно телепортуватися на відстань до 30 футів у вільний простір, який ви бачите. Ви можете використовувати цю рису кількість разів, що дорівнює вашому бонусу майстерності, і відновлюєте всі витрачені використання, коли закінчуєте довгий відпочинок.\\n\\nПочинаючи з 3-го рівня, ви також отримуєте опір до всіх видів шкоди, коли телепортуєтеся за допомогою цієї риси. Опір триває до початку вашого наступного ходу. Протягом цього часу ви виглядаєте примарним і напівпрозорим."},{"name":"Опір некротичній енергії","engName":"Necrotic Resistance (Shadar-kai Subrace)","description":"Ви маєте опір до некротичної шкоди."}]},{"name":"Блідий ельф","engName":"Pallid Elf","slug":"subrace:ELF_PALLID_EGTW","kind":"Підраса","description":"Бліді ельфи — містичний і проникливий народ зі шкірою, блідою, як поверхня найбільшого місяця їхнього світу. Вони зʼявилися лише в цьому столітті й мандрують світом із дитячою допитливістю.","features":[{"name":"Проникливе чуття","engName":"Incisive Sense","description":"Ви маєте перевагу на перевірки Історії [Investigation] та Аналіз Поведінки [Insight]."},{"name":"Благословення Ткалі Місяця","engName":"Blessing of the Moon Weaver","description":"Ви знаєте заклинання Світло [Light]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Сон [Sleep]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Невидимість [Invisibility]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою характеристикою для цих заклинань."}]},{"name":"Ельф (Мітка Тіні)","engName":"Elf (Mark of Shadow)","slug":"variant:ELF_MARK_OF_SHADOW_EBERRON","kind":"Варіант","description":"","features":[{"name":"Хитра інтуїція","engName":"Cunning Intuition","description":"Коли ви робите перевірку Харизми (Виступ [Performance]) або Спритності (Скритність [Stealth]), ви можете кинути к4 і додати результат до перевірки."},{"name":"Формування тіней","engName":"Shape Shadows","description":"Ви знаєте замовляння Мала ілюзія [Minor Illusion]. Починаючи з 3-го рівня, ви можете використовувати заклинання Невидимість [Invisibility] один раз за допомогою цією рисою і не можете робити це знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."},{"name":"Закляття марки тіні","engName":"Spells of the Mark (Shadow)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Маскування [Disguise Self], Мовчазний образ [Silent Image], Невидимість [Invisibility], Переміщення без сліду [Pass without Trace], Підглядання [Clairvoyance], Оживлений образ [Major Image], Вища невидимість [Greater Invisibility], Галюциногенна місцевість [Hallucinatory Terrain], Омана [Mislead]."}]}]},{"edition":"2014","name":"Людина","engName":"Human","slug":"human","description":"Людей у більшості світів вважають наймолодшим із поширених народів: вони прийшли у світ пізно й живуть недовго порівняно з дворфами, ельфами й драконами. Можливо, саме через коротке життя вони прагнуть досягти якомога більшого за відведені роки, а може, хочуть щось довести старшим народам — і тому зводять могутні імперії на завоюваннях і торгівлі. Хоч що ними рухає, люди — новатори, звершувачі й першопрохідці світів.\n\nТипової людини не існує: схильність до мандрів і завоювань зробила людей найрозмаїтішими на вигляд серед поширених народів. Вони дорослішають наприкінці підліткового віку й рідко доживають до сотні років. Осівши, люди будують міста на віки й королівства, що стоять століттями, а їхні культури зберігають традиції, давніші за памʼять будь-якої окремої людини.\n\nЛюди, що шукають пригод, — найсміливіші й найамбітніші представники сміливого й амбітного народу: вони прагнуть слави, сили, багатства й визнання.","facts":["30 футів","Середній","6 гілок"],"features":[{"name":"Покращення характеристик","engName":"Human: Ability Score Increase","description":"Кожна ваша характеристика збільшується на 1."},{"name":"Вік","engName":"Human: Age","description":"Люди досягають повноліття наприкінці підліткового віку й живуть менше століття."},{"name":"Світогляд","engName":"Human: Alignment","description":"Люди не тяжіють до жодного конкретного світогляду. Серед них трапляються і найкращі, і найгірші."}],"children":[{"name":"Варіант людини","engName":"Human Variant","slug":"variant:HUMAN_VARIANT","kind":"Варіант","description":"","features":[{"name":"Покращення характеристик","engName":"Human Variant: Ability Score Increase","description":"Дві характеристики на ваш вибір збільшуються на 1."},{"name":"Навички","engName":"Human Variant: Skills","description":"Ви отримуєте володіння однією навичкою на ваш вибір."},{"name":"Риса","engName":"Human Variant: Feat","description":"Ви отримуєте одну рису на ваш вибір, вимогам якої ви відповідаєте."}]},{"name":"Людина (Мітка Пошуку)","engName":"Human (Mark of Finding)","slug":"variant:HUMAN_MARK_OF_FINDING_EBERRON","kind":"Варіант","description":"","features":[{"name":"Інтуїція мисливця","engName":"Hunter's Intuition","description":"Коли ви робите перевірку Мудрості (Уважність [Perception]) або Мудрості (Виживання [Survival]), ви можете кинути к4 і додати результат до перевірки."},{"name":"Магія шукача","engName":"Finder's Magic","description":"Ви можете використовувати заклинання Мисливська мітка [Hunter's Mark]. Починаючи з 3-го рівня, ви також можете використовувати заклинання Пошук предмета [Locate Object]. Після того, як ви використали будь-яке з цих заклинань за допомогою цієї риси, ви не можете використовувати його знову, доки не завершите довгий відпочинок. Мудрість є вашою заклинальною характеристикою для цих заклинань."},{"name":"Закляття марки пошуку (Людина)","engName":"Spells of the Mark (Finding)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Мисливська мітка [Hunter's Mark], Розпізнавання [Identify], Пошук предмета [Locate Object], Пошук тварин або рослин [Locate Animals or Plants], Підглядання [Clairvoyance], Розмова з рослинами [Speak with Plants]."}]},{"name":"Людина (Мітка Поводження)","engName":"Human (Mark of Handling)","slug":"variant:HUMAN_MARK_OF_HANDLING_EBERRON","kind":"Варіант","description":"","features":[{"name":"Дика інтуїція","engName":"Wild Intuition","description":"Коли ви робите перевірку Мудрості (Поводження з тваринами [Animal Handling]) або Інтелекту (Природа [Nature]), ви можете кинути к4 і додати результат до перевірки."},{"name":"Первісний звʼязок","engName":"Primal Connection","description":"Ви можете використовувати заклинання Дружба з тваринами [Animal Friendship] та Розмова з тваринами [Speak with Animals]. Починаючи з 3-го рівня, ви також можете використовувати заклинання Звірячі узи [Beast Bond]. Після того, як ви використали будь-яке з цих заклинань за допомогою цієї риси, ви не можете використовувати його знову, доки не завершите довгий відпочинок. Мудрість є вашою заклинальною характеристикою для цих заклинань."},{"name":"Чим вони більші","engName":"The Bigger They Are","description":"Коли ви накладаєте заклинання Дружба з тваринами [Animal Friendship] або Розмова з тваринами [Speak with Animals], ви можете націлюватися на Істот (Monstrosity), якщо їхній показник Інтелекту 3 або нижче."},{"name":"Закляття марки поводження","engName":"Spells of the Mark (Handling)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Дружба з тваринами [Animal Friendship], Розмова з тваринами [Speak with Animals], Звірячі узи [Beast Bond], Тваринне чуття [Beast Sense], Вгамування емоцій [Calm Emotions], Накликання тварин [Conjure Animals], Підкорення звіра [Dominate Beast]."}]},{"name":"Людина (Мітка Створення)","engName":"Human (Mark of Making)","slug":"variant:HUMAN_MARK_OF_MAKING_EBERRON","kind":"Варіант","description":"","features":[{"name":"Інтуїція ремісника","engName":"Artisan's Intuition","description":"Коли ви робите перевірку Інтелекту (Магія [Arcana]) або перевірку характеристики з використанням ремісничих інструментів [artisan's tools], ви можете кинути к4 і додати результат до перевірки."},{"name":"Дарунок творця","engName":"Maker's Gift","description":"Ви знаєте замовляння Лагодження [Mending]."},{"name":"Заклинач предметів","engName":"Spellsmith","description":"Ви можете накласти заклинання Магічна зброя [Magic Weapon] цією рисою. Коли ви робите це, заклинання триває 1 годину і не потребує Концентрації. Починаючи з 3-го рівня, ви також можете накласти заклинання Розпізнавання [Identify] цією рисою. Після того, як ви використали будь-яке з цих заклинань за допомогою цієї риси, ви не можете використовувати його знову за допомогою цією рисою, доки не завершите довгий відпочинок. Інтелект є вашою заклинальною характеристикою для цих заклинань."},{"name":"Закляття марки творення","engName":"Spells of the Mark (Making)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Розпізнавання [Identify], Літаючий диск Тензера [Tenser's Floating Disk], Безперервне полумʼя [Continual Flame], Магічна зброя [Magic Weapon], Стихійна зброя [Elemental Weapon], Виготовлення [Fabricate], Творення [Creation]."}]},{"name":"Людина (Мітка Переходу)","engName":"Human (Mark of Passage)","slug":"variant:HUMAN_MARK_OF_PASSAGE_EBERRON","kind":"Варіант","description":"","features":[{"name":"Інтуїція мандрівника","engName":"Intuition of the Voyager","description":"Коли ви робите перевірку Спритності (Акробатика [Acrobatics]) або перевірку характеристики з використанням сухопутних транспортних засобів [land vehicles], ви можете кинути к4 і додати результат до перевірки."},{"name":"Магічний перехід","engName":"Magical Passage","description":"Ви можете використовувати заклинання Туманний крок [Misty Step] як бонусну дію. Починаючи з 3-го рівня, ви також можете використовувати заклинання Негайний відступ [Expeditious Retreat]. Після того, як ви використали будь-яке з цих заклинань за допомогою цієї риси, ви не можете використовувати його знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."},{"name":"Закляття марки переходу","engName":"Spells of the Mark (Passage)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Негайний відступ [Expeditious Retreat], Стрибок [Jump], Туманний крок [Misty Step], Переміщення без сліду [Pass without Trace], Політ [Fly], Двері між вимірами [Dimension Door], Коло телепортації [Teleportation Circle]."}]},{"name":"Людина (Мітка Вартового)","engName":"Human (Mark of Sentinel)","slug":"variant:HUMAN_MARK_OF_SENTINEL_EBERRON","kind":"Варіант","description":"","features":[{"name":"Інтуїція вартового","engName":"Sentinel's Intuition","description":"Коли ви робите перевірку Мудрості (Аналіз Поведінки [Insight]) або Мудрості (Уважність [Perception]), ви можете кинути к4 і додати результат до перевірки."},{"name":"Щит захисника","engName":"Guardian's Shield","description":"Ви можете використовувати заклинання Щит [Shield]. Починаючи з 3-го рівня, ви також можете використовувати заклинання Охоронний звʼязок [Warding Bond]. Після того, як ви використали будь-яке з цих заклинань за допомогою цієї риси, ви не можете використовувати його знову, доки не завершите довгий відпочинок. Мудрість є вашою заклинальною характеристикою для цих заклинань."},{"name":"Пильний охоронець","engName":"Vigilant Guardian","description":"Коли істота, яку ви бачите в межах 5 футів від вас, отримує влучання атакою, ви можете використати свою реакцію, щоб магічно помінятися місцями з цією істотою. Ви отримуєте влучання цією атакою замість неї. Ви не можете використовувати цю здатність знову, доки не завершите довгий відпочинок."},{"name":"Закляття марки вартового","engName":"Spells of the Mark (Sentinel)","description":"Якщо ви маєте здатність Spellcasting або Pact Magic, заклинання в цьому списку додаються до списку заклинань вашого класу: Виклик на дуель [Compelled Duel], Щит віри [Shield of Faith], Підтримка [Aid], Охоронний звʼязок [Warding Bond], Захист від енергії [Protection from Energy], Захист від смерті [Death Ward], Вартовий віри [Guardian of Faith]."}]}]},{"edition":"2014","name":"Тифлінг","engName":"Tiefling","slug":"tiefling","description":"Ловити на собі погляди й перешіптування, терпіти насильство й образи на вулиці, бачити недовіру й страх у кожних очах — така доля тифлінга. Гірше того, тифлінги знають причину: пакт, укладений покоління тому, влив у їхній родовід сутність Асмодея, володаря Девʼяти Пекл. Їхній вигляд і вдача — не їхня провина, а наслідок давнього гріха, за який відповідатимуть і вони, і діти їхніх дітей.\n\nТифлінги походять від людських родоводів і в найширшому сенсі досі схожі на людей, але пекельна спадщина лишила на них чіткий слід: великі роги, товстий хвіст, гострі ікла й суцільно забарвлені очі без видимих зіниць, а шкіра може мати й червоні відтінки.\n\nНе маючи батьківщини, тифлінги знають, що мусять самі прокладати собі шлях і бути сильними, щоб вижити. Вони не поспішають довіряти тим, хто називає себе другом, та коли друзі доводять свою довіру, тифлінг відповідає тим самим — і стає союзником на все життя.","facts":["30 футів","Середній","12 гілок"],"features":[{"name":"Темнозір","engName":"Darkvision","description":"Ви можете бачити в тьмяному світлі на відстані 60 футів так, ніби це яскраве світло, і в темряві так, ніби це тьмяне світло. Ви не можете розрізняти кольори в темряві, лише відтінки сірого."},{"name":"Пекельний опір","engName":"Hellish Resistance","description":"Ви маєте опір до вогняної шкоди."},{"name":"Інфернальна спадщина","engName":"Infernal Legacy","description":"Ви знаєте заклинання Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Пекельна відсіч [Hellish Rebuke] як заклинання 2-го рівня. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Темрява [Darkness]. Після використання Пекельної відсічі [Hellish Rebuke] або Темряви [Darkness] ви не
