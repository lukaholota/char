play:block;font-size:19px}.cards p{font-size:14px;color:var(--muted);margin:8px 0}.prose{white-space:pre-line}details{border:1px solid var(--line);border-radius:10px;margin:10px 0;scroll-margin-top:20px}summary{padding:14px;font-weight:bold}details .prose{padding:0 16px 16px;color:#d8d4e2}.level{margin-top:26px;color:var(--accent)}.feature-target{outline:2px solid var(--accent);outline-offset:2px;background:#261d36}.reader-bar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}#reader-location{flex-basis:100%;font-size:14px;color:var(--accent)}.reader-bar button{font-size:14px}.tools{display:flex;gap:10px;margin-bottom:16px}dialog{width:min(780px,calc(100vw - 40px));max-height:90dvh;border:1px solid #67527d;border-radius:18px;background:var(--panel);color:inherit;padding:0}dialog::backdrop{background:#05040cbb}#reader-scroll{overflow-y:auto;max-height:calc(90dvh - 112px);padding:24px}.breadcrumb{font-size:14px;color:var(--accent);margin-bottom:8px}#close-reader{position:sticky;top:0;background:var(--panel)}@media(max-width:760px){.wrap{padding:16px}.layout{display:block}#detail{display:none}.catalog-list{grid-template-columns:repeat(2,minmax(0,1fr))}.catalog-list button{padding:14px}.catalog-list strong{font-size:18px}.cards{grid-template-columns:1fr}.surface{padding:18px}dialog{width:calc(100vw - 12px);max-height:96dvh;border-radius:14px}#reader-scroll{max-height:calc(96dvh - 112px);padding:18px}h1{font-size:26px}.top{gap:8px}.search{flex-basis:100%}}

<script id="catalog-data" type="application/json">{"classes":[{"edition":"2014","name":"Бард","engName":"Bard","slug":"bard","description":"Хай то вчений, скальд чи шахрай, бард сплітає магію зі слів і музики, щоб надихати союзників, знеохочувати ворогів, підкоряти розум, створювати ілюзії й навіть зцілювати рани.\n\nУ світах D&D слова й музика — не просто коливання повітря, а голоси з власною силою. Барди кажуть, що мультивсесвіт було створено словом, а відлуння первісних Слів Творіння досі лунає космосом; їхня музика прагне вловити ці відлуння й вплести в заклинання. Найбільша сила бардів — розмаїття: вони надихають союзників здалеку, а за потреби боронять себе й у ближньому бою.\n\nСправжні барди трапляються рідко: не кожен менестрель у корчмі чи блазень при дворі є бардом. Життя барда минає в мандрах, збиранні переказів і на вдячності слухачів, а спрага нових історій робить пригоди його природним покликанням.","facts":["Кістка хітів: к8","Підклас з 3 рівня","8 підкласів"],"features":[{"level":1,"name":"Бардське натхнення","engName":"Bardic Inspiration","description":"Бонусною дією ви обираєте одну істоту (крім себе) в межах 60 футів, яка може вас чути. Вона отримує кістку Бардського натхнення (к6).\n\nПротягом наступних 10 хвилин істота може один раз кинути цю кістку і додати результат до однієї перевірки характеристики, кидка атаки або ряткидка. Істота може вирішити використати кістку після кидка d20, але до того, як Майстер оголосить успіх чи провал. Після кидка кістка натхнення витрачається. Істота може мати лише одну кістку Бардського натхнення одночасно.\n\nКількість використань дорівнює вашому модифікатору Харизми (мінімум 1). Використання відновлюються після тривалого відпочинку (з 5 рівня — після короткого або тривалого завдяки рисі Джерело натхнення).\n\nПрогресія кістки Бардського натхнення:\n• 1-4 рівні: к6\n• 5-9 рівні: к8\n• 10-14 рівні: к10\n• 15-20 рівні: к12"},{"level":1,"name":"Чаротворство (Бард)","engName":"Spellcasting (Bard)","description":"Ви вмієте вплітати магію у слова й музику, накладаючи заклинання барда.\n\n**Відомі заклинання**: ви знаєте певну кількість заклинань барда, указаних у таблиці барда. Коли отримуєте рівень, ви можете замінити одне відоме заклинання іншим зі списку барда (нове має бути рівня, на який у вас є слоти).\n\n**Замовляння**: ви знаєте замовляння зі списку барда (кількість зростає з рівнем).\n\n**Слоти заклинань**: витрачені слоти відновлюються після тривалого відпочинку.\n\n**Характеристика заклинань**: Харизма є вашою характеристикою заклинань.\n\nСК ряткидку заклинань = 8 + Бонус Майстерності (БМ) + модифікатор Харизми.\nМодифікатор атаки заклинаннями = БМ + модифікатор Харизми."},{"level":2,"name":"Майстер на всі руки","engName":"Jack of All Trades","description":"Починаючи з 2 рівня, ви додаєте половину вашого Бонусу Майстерності (БМ), округлюючи вниз, до будь-якої перевірки характеристики, у якій ви не додаєте БМ."},{"level":2,"name":"Пісня відпочинку","engName":"Song of Rest","description":"Починаючи з 2 рівня, під час короткого відпочинку ви можете допомогти союзникам відновлюватися музикою чи промовою. Якщо ви (або дружні істоти, що вас чують) витрачаєте ХК для відновлення ХП під час короткого відпочинку, кожна така істота додатково відновлює ХП від кістки Пісні відпочинку (її розмір зростає з рівнем барда)."},{"level":3,"name":"Експертиза (Бард)","engName":"Expertise (Bard)","description":"Починаючи з 3 рівня, оберіть дві навички, якими ви володієте. Ваш Бонус Майстерності (БМ) подвоюється для будь-якої перевірки характеристики, яку ви робите, використовуючи одну з обраних навичок."},{"level":3,"name":"Колегія Бардів","engName":"Bard College","description":"Ви заглиблюєтесь у техніки певної колегії."},{"level":4,"name":"Покращення Характеристик","engName":"Ability Score Improvement","description":"+2 до однієї або +1 до двох характеристик."},{"level":5,"name":"Джерело натхнення","engName":"Font of Inspiration","description":"Починаючи з 5 рівня, ви відновлюєте всі витрачені використання Бардського натхнення після короткого або тривалого відпочинку."},{"level":6,"name":"Контрчари","engName":"Countercharm","description":"Починаючи з 6 рівня, ви можете дією розпочати виступ, який допомагає вам і союзникам протистояти переляку та зачаруванню. Доки ви продовжуєте виступ, ви та дружні істоти в межах 30 футів, які можуть вас чути, отримують перевагу на ряткидки проти переляку та зачарування."},{"level":10,"name":"Експертиза (Бард) 2","engName":"Expertise (Bard) 2","description":"Починаючи з 10 рівня, ви можете обрати ще дві навички, якими володієте. Ваш Бонус Майстерності (БМ) подвоюється для будь-якої перевірки характеристики, яку ви робите, використовуючи одну з обраних навичок."},{"level":10,"name":"Магічні таємниці","engName":"Magical Secrets","description":"На 10 рівні ви вивчаєте додаткові заклинання за межами репертуару барда: оберіть 2 заклинання з будь-яких списків класів. Обрані заклинання стають для вас заклинаннями барда. На вищих рівнях ви отримуєте ще заклинання через цю рису."},{"level":20,"name":"Вище натхнення","engName":"Superior Inspiration","description":"На 20 рівні, якщо ви кидаєте ініціативу і у вас немає використань Бардського натхнення, ви відновлюєте одне використання."}],"children":[{"name":"Колегія гламуру","engName":"College of Glamour","slug":"college-of-glamour","kind":"Підклас","description":"Колегія гламуру — дім бардів, що опанували своє мистецтво в яскравому Фейвайлді або в того, хто там жив. Навчені сатирами, еладрінами й іншими феями, вони чарують і захоплюють магією, тож до них ставляться із сумішшю захвату й страху: пісня такого барда може змусити викрадачів відпустити його, а розлюченого дракона — заспокоїтися.","features":[{"level":3,"name":"Зачаровуючий виступ","engName":"Enthralling Performance","description":"Починаючи з 3 рівня, ви можете наповнювати свої виступи спокусливою фейською магією.\n\nЯкщо ви виступаєте щонайменше 1 хвилину, ви можете спробувати вселити захоплення у свою публіку співом, декламацією вірша або танцем. Наприкінці виступу оберіть певну кількість гуманоїдів у межах 60 футів від себе, які весь цей час дивилися й слухали вас, — до числа, що дорівнює вашому модифікатору Харизми (мінімум один гуманоїд). Кожна ціль повинна успішно пройти ряткидок Мудрості проти СК ряткидку ваших заклинань, інакше стане Причарованою вами. Поки ціль Причарована таким чином, вона боготворить вас, захоплено говорить про вас з кожним, хто до неї звертається, і перешкоджає всім, хто виступає проти вас, уникаючи насильства, хіба що й без того була схильна битися за вас. Цей ефект закінчується для цілі через 1 годину, якщо вона зазнає будь-якої шкоди, якщо ви атакуєте її або якщо вона бачить, як ви атакуєте чи завдаєте шкоди будь-кому з її союзників.\n\nЯкщо ціль успішно проходить ряткидок, вона не здогадується, що ви намагалися її причарувати.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите короткий або довгий відпочинок."},{"level":3,"name":"Мантія натхнення","engName":"Mantle of Inspiration","description":"Коли на 3 рівні ви вступаєте до Колегії гламуру, ви здобуваєте здатність вплітати у пісню фейську магію, що наповнює ваших союзників жвавістю й швидкістю.\n\nБонусною дією ви можете витратити одне використання Бардського натхнення, щоб надати собі чудесної зовнішності. Коли ви це робите, оберіть певну кількість істот, яких ви бачите й які бачать вас у межах 60 футів від вас, — до числа, що дорівнює вашому модифікатору Харизми (мінімум одна істота). Кожна з них отримує 5 тимчасових хіт-поінтів. Коли істота отримує ці тимчасові хіт-поінти, вона може негайно використати свою реакцію, щоб переміститися зі швидкістю до свого показника швидкості, не провокуючи принагідних атак.\n\nКількість тимчасових хіт-поінтів зростає, коли ви досягаєте певних рівнів у цьому класі: до 8 на 5 рівні, 11 на 10 рівні та 14 на 15 рівні."},{"level":6,"name":"Мантія величі","engName":"Mantle of Majesty","description":"На 6 рівні ви здобуваєте здатність огортати себе фейською магією, що змушує інших хотіти вам служити. Бонусною дією ви накладаєте Наказ [Command] без витрати слота заклинань і водночас набуваєте вигляду неземної краси на 1 хвилину або доки не втратите концентрацію (ніби концентруєтеся на заклинанні). Протягом цього часу ви можете накладати Наказ [Command] бонусною дією в кожен свій хід, не витрачаючи слот заклинань.\n\nБудь-яка істота, Причарована вами, автоматично провалює ряткидок проти Наказу [Command], накладеного цією рисою.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите довгий відпочинок."},{"level":14,"name":"Незламна велич","engName":"Unbreakable Majesty","description":"На 14 рівні ваша зовнішність назавжди набуває потойбічного відтінку, що робить вас водночас прекраснішим і грізнішим.\n\nКрім того, бонусною дією ви можете на 1 хвилину, або доки не станете недієздатним, набути магічно величної присутності. Протягом цього часу, коли будь-яка істота вперше за хід намагається атакувати вас, нападник повинен зробити ряткидок Харизми проти СК ряткидку ваших заклинань. У разі невдачі він не може атакувати вас цього ходу й мусить обрати нову ціль для своєї атаки, інакше атака втрачається. У разі успіху він може атакувати вас цього ходу, але має перешкоду на будь-який ряткидок, який робитиме проти ваших заклинань у ваш наступний хід.\n\nЩойно ви набули цієї величної присутності, ви не можете зробити це знову, доки не завершите короткий або довгий відпочинок."}]},{"name":"Колегія доблесті","engName":"College of Valor","slug":"college-of-valor","kind":"Підклас","description":"Барди Колегії доблесті — відважні скальди, чиї оповіді бережуть памʼять про великих героїв і надихають нове покоління. Вони співають про звитяги в медових залах і біля великих вогнищ, мандрують, щоб на власні очі побачити великі події, і своїми піснями кличуть інших сягнути висот героїв давнини.","features":[{"level":3,"name":"Бойове натхнення","engName":"Combat Inspiration","description":"Також на 3 рівні ви вчитеся надихати інших у бою. Істота, яка має від вас кістку Бардського натхнення, може кинути цю кістку й додати число, яке випало, до кидка шкоди зброєю, щойно зробленого нею. Або, коли проти цієї істоти робиться кидок атаки, вона може використати свою реакцію, щоб кинути кістку Бардського натхнення й додати число, яке випало, до свого КБ проти цієї атаки, після того як побачить кидок, але до того, як дізнається, влучає атака чи ні."},{"level":3,"name":"Додаткові володіння (Valor)","engName":"Bonus Proficiencies (Valor)","description":"Коли на 3 рівні ви вступаєте до Колегії доблесті, ви отримуєте володіння середніми обладунками, щитами та військовою зброєю."},{"level":6,"name":"Додаткова атака","engName":"Extra Attack (Bard)","description":"Починаючи з 6 рівня, ви можете атакувати двічі, а не один раз, коли ви робите дію Атака у свій хід."},{"level":14,"name":"Бойова магія","engName":"Battle Magic","description":"На 14 рівні ви опановуєте мистецтво вплітати накладання заклинань і володіння зброєю в один гармонійний акт. Коли ви використовуєте свою дію, щоб накласти заклинання барда, ви можете зробити одну атаку зброєю бонусною дією."}]},{"name":"Колегія духів","engName":"College of Spirits","slug":"college-of-spirits","kind":"Підклас","description":"Барди Колегії духів шукають оповіді, що мають власну силу, — легенди, хроніки чи вигадки — і оживлюють їхніх героїв. За допомогою окультних атрибутів вони викликають духів, що втілюють могутні сили й знову змінюють світ. Проте такі духи примхливі, і те, що кличе бард, не завжди цілком йому підкоряється.","features":[{"level":3,"name":"Історії з потойбіччя","engName":"Tales from Beyond","description":"На 3 рівні ви звертаєтеся до духів, які розповідають свої історії через вас. Поки ви тримаєте свій Спіритичний фокус, ви можете бонусною дією витратити одне використання Бардського натхнення й кинути на таблиці Історій духів, використовуючи для визначення історії кістку Бардського натхнення. Ви зберігаєте цю історію в памʼяті, доки не передасте її ефект або доки не завершите короткий чи довгий відпочинок.\n\nДією ви можете обрати одну істоту, яку бачите в межах 30 футів від себе (це можете бути й ви самі), і зробити її ціллю ефекту цієї історії. Зробивши це, ви не можете знову передати ефект цієї історії, доки знову не отримаєте її кидком.\n\nВи можете утримувати в памʼяті лише одну таку історію одночасно, і новий кидок на таблиці Історій духів негайно припиняє ефект попередньої історії. Якщо історія вимагає ряткидка, СК дорівнює СК ряткидку ваших заклинань.\n\n**Історії духів**\n1 — **Історія кмітливої тварини.** Протягом наступних 10 хвилин щоразу, коли ціль робить перевірку Інтелекту, Мудрості або Харизми, вона може кинути додаткову кістку одразу після кидка д20 й додати результат до перевірки. Додаткова кістка має той самий тип, що й ваша кістка Бардського натхнення.\n2 — **Історія уславленого дуелянта.** Ви робите рукопашну атаку заклинанням по цілі. У разі влучання ціль отримує шкоду силовим полем, що дорівнює двом кидкам вашої кістки Бардського натхнення + ваш модифікатор Харизми.\n3 — **Історія любих друзів.** Ціль і ще одна істота на її вибір, яку вона бачить у межах 5 футів від себе, отримують тимчасові хіт-поінти, що дорівнюють кидку вашої кістки Бардського натхнення + ваш модифікатор Харизми.\n4 — **Історія втікача.** Ціль може негайно використати реакцію, щоб телепортуватися на відстань до 30 футів у незайнятий простір, який вона бачить. Коли ціль телепортується, вона може обрати певну кількість істот, яких бачить у межах 30 футів від себе, — до вашого модифікатора Харизми (мінімум 0), — і вони також можуть негайно використати ту саму реакцію.\n5 — **Історія месника.** Протягом 1 хвилини будь-яка істота, що влучає по цілі рукопашною атакою, отримує шкоду силовим полем, що дорівнює кидку вашої кістки Бардського натхнення.\n6 — **Історія мандрівника.** Ціль отримує тимчасові хіт-поінти, що дорівнюють кидку вашої кістки Бардського натхнення + ваш рівень барда. Поки вона має ці тимчасові хіт-поінти, її швидкість ходьби збільшується на 10 футів і вона отримує бонус +1 до КБ.\n7 — **Історія спокусника.** Ціль повинна успішно пройти ряткидок Мудрості, інакше отримає психічну шкоду, що дорівнює двом кидкам вашої кістки Бардського натхнення, і стане Недієздатною до кінця свого наступного ходу.\n8 — **Історія примари.** Ціль стає Невидимою до кінця свого наступного ходу або доки не влучить атакою по істоті. Якщо під час цієї невидимості вона влучає по істоті атакою, та істота отримує некротичну шкоду, що дорівнює кидку вашої кістки Бардського натхнення, і стає Наляканою цілі до кінця свого наступного ходу.\n9 — **Історія брутала.** Кожна істота на вибір цілі, яку та бачить у межах 30 футів від себе, повинна зробити ряткидок Сили. У разі провалу істота отримує громову шкоду, що дорівнює трьом кидкам вашої кістки Бардського натхнення, і падає долілиць. У разі успіху істота отримує лише половину цієї шкоди й не падає долілиць.\n10 — **Історія дракона.** Ціль вивергає полумʼя з рота у 30-футовому конусі. Кожна істота в цій зоні повинна зробити ряткидок Спритності, отримуючи вогняну шкоду, що дорівнює чотирьом кидкам вашої кістки Бардського натхнення, у разі провалу або половину цієї шкоди в разі успіху.\n11 — **Історія ангела.** Ціль відновлює хіт-поінти, що дорівнюють двом кидкам вашої кістки Бардського натхнення + ваш модифікатор Харизми, і ви припиняєте один із таких станів, що діє на ціль: Засліплений, Оглухлий, Паралізований, Окамʼянілий або Отруєний.\n12 — **Історія викривлювача розуму.** Ви прикликаєте незбагненну байку з потойбічної сутності. Ціль повинна успішно пройти ряткидок Інтелекту, інакше отримає психічну шкоду, що дорівнює трьом кидкам вашої кістки Бардського натхнення, і стане Приголомшеною до кінця свого наступного ходу."},{"level":3,"name":"Направляючі шепоти","engName":"Guiding Whispers","description":"На 3 рівні ви можете звертатися до духів, щоб вони спрямовували вас та інших. Ви вивчаєте замовляння Настанова [Guidance], і воно не зараховується до кількості відомих вами замовлянь барда. Для вас дальність цього замовляння становить 60 футів, коли ви його накладаєте."},{"level":3,"name":"Спіритичний фокус","engName":"Spiritual Focus","description":"На 3 рівні ви послуговуєтеся знаряддями, що допомагають вам проводити духів — чи то історичних постатей, чи вигаданих архетипів. Ви можете використовувати такі предмети як заклинальний фокус для своїх заклинань барда: свічку, кришталеву кулю, череп, спіритичну дошку або колоду тарокка.\n\nПочинаючи з 6 рівня, коли ви накладаєте заклинання барда, що завдає шкоди або відновлює хіт-поінти через цей Спіритичний фокус, киньте к6 і додайте число, яке випало, до одного кидка шкоди або лікування цього заклинання."},{"level":6,"name":"Спіритичний сеанс","engName":"Spirit Session","description":"На 6 рівні духи дарують вам надприродні осяяння. Ви можете провести годинний ритуал, спрямовуючи духів за допомогою свого Спіритичного фокуса (це можна зробити під час короткого або довгого відпочинку). Ви можете провести ритуал разом із певною кількістю добровільних істот, що дорівнює вашому бонусу майстерності, включно з собою. Наприкінці ритуалу ви тимчасово вивчаєте одне заклинання на свій вибір із будь-якого класу.\n\nОбране заклинання має бути рівня, що дорівнює кількості істот, які проводили ритуал, або нижчого; крім того, це має бути рівень, який ви здатні накладати, і заклинання має належати до школи Ворожіння або Некромантії. Обране заклинання вважається для вас заклинанням барда, але не зараховується до кількості заклинань барда, які ви знаєте.\n\nЩойно ви провели цей ритуал, ви не можете провести його знову, доки не почнете довгий відпочинок, а обране заклинання ви знаєте до початку довгого відпочинку."},{"level":14,"name":"Містичний звʼязок","engName":"Mystical Connection","description":"На 14 рівні ви здобуваєте здатність схиляти духів Історій з потойбіччя до певних історій. Щоразу, коли ви кидаєте на таблиці Історій духів, ви можете кинути кістку двічі й обрати, який із двох ефектів передати. Якщо на обох кістках випадає те саме число, ви можете проігнорувати цей результат і обрати будь-який ефект із таблиці."}]},{"name":"Колегія знань","engName":"College of Lore","slug":"college-of-lore","kind":"Підклас","description":"Барди Колегії знань знають потроху про все, збираючи відомості й з учених трактатів, і з селянських переказів. Вони вірні красі й правді, а не монархові чи догматам божества, тож радше скажуть чесно, ніж догідливо. Збираючись у бібліотеках і на святах, вони викривають корупцію, розплутують брехню й кепкують із пихатих можновладців.","features":[{"level":3,"name":"Додаткові володіння","engName":"Bonus Proficiencies (Lore)","description":"Коли на 3 рівні ви вступаєте до Колегії знань, ви отримуєте володіння трьома навичками на ваш вибір."},{"level":3,"name":"Ріжучі слова","engName":"Cutting Words","description":"Також на 3 рівні ви вчитеся використовувати свою дотепність, щоб відволікати, бентежити й підточувати чужу впевненість та вправність. Коли істота, яку ви бачите в межах 60 футів від себе, робить кидок атаки, перевірку характеристики або кидок шкоди, ви можете реакцією витратити одне зі своїх використань Бардського натхнення, кинути кістку Бардського натхнення й відняти число, яке випало, від кидка цієї істоти. Ви можете вирішити використати цю рису після того, як істота зробила кидок, але до того, як Майстер визначить, чи кидок атаки або перевірка характеристики були успішними чи провальними, або до того, як істота завдасть своєї шкоди. Істота є несприйнятливою до цього ефекту, якщо вона не чує вас або якщо має імунітет до стану Причарований."},{"level":6,"name":"Додаткові магічні таємниці","engName":"Additional Magical Secrets","description":"На 6 рівні ви вивчаєте два заклинання на ваш вибір із будь-якого класу. Заклинання, яке ви обираєте, має бути рівня, який ви можете накладати, як показано в таблиці барда, або це може бути замовляння. Обрані заклинання вважаються для вас заклинаннями барда, але не зараховуються до кількості заклинань барда, які ви знаєте."},{"level":14,"name":"Незрівнянна майстерність","engName":"Peerless Skill","description":"Починаючи з 14 рівня, коли ви робите перевірку характеристики, ви можете витратити одне використання Бардського натхнення. Киньте кістку Бардського натхнення й додайте число, яке випало, до своєї перевірки характеристики. Ви можете вирішити зробити це після кидка д20 для перевірки характеристики, але до того, як Майстер скаже, чи ви досягли успіху, чи провалилися."}]},{"name":"Колегія красномовства","engName":"College of Eloquence","slug":"college-of-eloquence","kind":"Підклас","description":"Прихильники Колегії красномовства опановують мистецтво ораторства. Переконання для них — високе мистецтво, а добре обґрунтований і гарно виголошений аргумент часто важить більше за факти. Поєднуючи логіку й театральну гру слів, ці барди перемагають скептиків і недоброзичливців доказами, а слухачів — зворушуючи їхні серця.","features":[{"level":3,"name":"Срібний язик","engName":"Silver Tongue","description":"Починаючи з 3 рівня, ви майстер говорити саме те, що треба, і саме в слушну мить. Коли ви робите перевірку Харизми (Переконання) або Харизми (Обман), ви можете вважати результат 9 або менше на д20 за 10."},{"level":3,"name":"Тривожні слова","engName":"Unsettling Words","description":"Також на 3 рівні ви можете вплітати у слова магію, що тривожить істоту й змушує її сумніватися в собі. Бонусною дією ви можете витратити одне використання Бардського натхнення й обрати одну істоту, яку бачите в межах 60 футів від себе. Киньте кістку Бардського натхнення. Істота повинна відняти число, яке випало, від наступного ряткидка, який вона зробить до початку вашого наступного ходу."},{"level":6,"name":"Безвідмовне натхнення","engName":"Unfailing Inspiration","description":"На 6 рівні ваші надихаючі слова настільки переконливі, що інші відчувають, ніби просто зобовʼязані досягти успіху. Коли істота додає одну з ваших кісток Бардського натхнення до перевірки характеристики, кидка атаки або ряткидка, і цей кидок усе одно провалюється, істота зберігає кістку Бардського натхнення."},{"level":6,"name":"Універсальна мова","engName":"Universal Speech","description":"Також на 6 рівні ви здобуваєте здатність робити свою мову зрозумілою будь-якій істоті. Дією оберіть одну або більше істот у межах 60 футів від вас — до кількості, що дорівнює вашому модифікатору Харизми (мінімум одна істота). Протягом 1 години обрані істоти можуть магічним чином розуміти вас незалежно від того, якою мовою ви говорите.\n\nЩойно ви скористалися цією рисою, ви не можете використати її знову, доки не завершите довгий відпочинок, хіба що витратите слот заклинань, щоб скористатися нею ще раз."},{"level":14,"name":"Заразливе натхнення","engName":"Infectious Inspiration","description":"На 14 рівні, коли ви успішно надихаєте когось, сила вашого красномовства може поширитися далі. Коли істота в межах 60 футів від вас додає одну з ваших кісток Бардського натхнення до перевірки характеристики, кидка атаки або ряткидка і цей кидок виявляється успішним, ви можете реакцією підбадьорити іншу істоту (крім себе), яка може вас чути в межах 60 футів, і дати їй кістку Бардського натхнення без витрати ваших використань Бардського натхнення.\n\nВи можете використати цю реакцію кількість разів, що дорівнює вашому модифікатору Харизми (мінімум один раз), і відновлюєте всі витрачені використання, коли завершуєте довгий відпочинок."}]},{"name":"Колегія мечів","engName":"College of Swords","slug":"college-of-swords","kind":"Підклас","description":"Бардів Колегії мечів звуть клинками: вони розважають публіку зухвалими трюками зі зброєю — ковтанням мечів, метанням і жонглюванням ножами, показовими двобоями, — але водночас є вправними воїнами. Через це багато клинків живуть подвійним життям: одні ховають за цирковою трупою вбивства й шантаж, інші карають жорстоких і могутніх.","features":[{"level":3,"name":"Бойовий стиль (Swords)","engName":"Fighting Style (Swords)","description":"На 3 рівні ви обираєте особливий бойовий стиль. Оберіть один із наведених варіантів. Ви не можете взяти одну й ту саму опцію Бойового стилю більше одного разу, навіть якщо пізніше знову отримаєте право вибору.\n\n**Дуелянт.** Коли ви тримаєте рукопашну зброю в одній руці й не тримаєте іншої зброї, ви отримуєте бонус +2 до кидків шкоди цією зброєю.\n\n**Бій двома зброями.** Коли ви бʼєтеся двома зброями, ви можете додавати модифікатор характеристики до шкоди другої атаки."},{"level":3,"name":"Додаткові володіння (Swords)","engName":"Bonus Proficiencies (Swords)","description":"Коли на 3 рівні ви вступаєте до Колегії мечів, ви отримуєте володіння середніми обладунками й скімітаром. Якщо ви володієте простою або воїнською зброєю ближнього бою, то можете використовувати її як заклинальний фокус для своїх заклинань барда."},{"level":3,"name":"Розчерк клинка","engName":"Blade Flourish","description":"На 3 рівні ви вчитеся демонструвати вражаючу бойову вправність і швидкість. Щоразу, коли ви виконуєте дію Атака у свій хід, ваша швидкість ходьби збільшується на 10 футів до кінця ходу, і якщо атака зброєю, яку ви робите як частину цієї дії, влучає по істоті, ви можете використати один із наведених нижче варіантів Розчерку клинка на свій вибір. Ви можете використати лише один варіант Розчерку клинка за хід.\n\n**Захисний розчерк.** Ви можете витратити одне використання Бардського натхнення, щоб зброя завдала цілі додаткової шкоди. Ця шкода дорівнює числу, яке випало на кістці Бардського натхнення. Ви також додаєте це число до свого КБ до початку свого наступного ходу.\n\n**Ріжучий розчерк.** Ви можете витратити одне використання Бардського натхнення, щоб зброя завдала додаткової шкоди цілі, в яку ви влучили, а також будь-якій іншій істоті на ваш вибір, яку ви бачите в межах 5 футів від себе. Додаткова шкода дорівнює числу, яке випало на кістці Бардського натхнення.\n\n**Мобільний розчерк.** Ви можете витратити одне використання Бардського натхнення, щоб зброя завдала додаткової шкоди цілі, в яку ви влучили. Додаткова шкода дорівнює числу, яке випало на кістці Бардського натхнення. Ви також можете відштовхнути ціль від себе на 5 футів плюс кількість футів, що дорівнює числу, яке випало на цій кістці. Після цього ви можете негайно використати реакцію, щоб переміститися зі швидкістю до своєї швидкості ходьби в незайнятий простір у межах 5 футів від цілі."},{"level":6,"name":"Додаткова атака","engName":"Extra Attack (Bard)","description":"Починаючи з 6 рівня, ви можете атакувати двічі, а не один раз, коли ви робите дію Атака у свій хід."},{"level":14,"name":"Майстерний розчерк","engName":"Master's Flourish","description":"Починаючи з 14 рівня, щоразу, коли ви використовуєте один із варіантів Розчерку клинка, ви можете кинути к6 і використати його замість витрати кістки Бардського натхнення."}]},{"name":"Колегія творення","engName":"College of Creation","slug":"college-of-creation","kind":"Підклас","description":"Барди вірять, що космос — витвір мистецтва перших драконів і богів, а його гармонії досі відлунюють у бутті силою, відомою як Пісня творення. Барди Колегії творення черпають із цієї первісної пісні через танець, музику й поезію. Її шанують дворфи й гноми, а дракононароджені — особливо, бо за легендами найбільші дракони були її першими співцями.","features":[{"level":3,"name":"Виступ творення","engName":"Performance of Creation","description":"Також на 3 рівні ви можете дією спрямувати магію Пісні творення, щоб створити один немагічний предмет на ваш вибір у незайнятому просторі в межах 10 футів від вас. Предмет має зʼявитися на поверхні або в рідині, що здатна його підтримати. Його вартість у зм не може перевищувати 20 × ваш рівень барда, а сам предмет має бути Середнього розміру або меншим. Створений предмет мʼяко мерехтить, а істота, яка торкається його, ледь чутно чує музику. Предмет зникає через кількість годин, що дорівнює вашому бонусу майстерності.\n\nЩойно ви створили предмет цією рисою, ви не можете зробити це знову, доки не завершите довгий відпочинок, хіба що витратите слот заклинань 2 рівня або вищого, щоб скористатися цією рисою ще раз. Водночас у вас може існувати лише один предмет, створений цією рисою; якщо ви використовуєте цю дію, уже маючи такий предмет, попередній негайно зникає.\n\nРозмір предмета, який ви можете створити цією рисою, збільшується на одну категорію, коли ви досягаєте 6 рівня (Великий) і 14 рівня (Величезний)."},{"level":3,"name":"Іскра потенціалу","engName":"Mote of Potential","description":"На 3 рівні, коли ви вступаєте до Колегії творення, щоразу, коли ви даєте істоті кістку Бардського натхнення, ви можете проспівати ноту з Пісні творення й створити Крихітну іскру потенціалу, що обертається в межах 5 футів від цієї істоти. Іскра невідчутна й невразлива, і вона існує, доки кістку Бардського натхнення не буде втрачено. Іскра має вигляд музичної ноти, зірки, квітки або іншого символу мистецтва чи життя на ваш вибір.\n\nКоли істота використовує кістку Бардського натхнення, іскра дає додатковий ефект залежно від того, до чого саме додається кістка:\n\n**Перевірка характеристики.** Коли істота кидає кістку Бардського натхнення, щоб додати її до перевірки характеристики, вона може кинути цю кістку ще раз і обрати, який із двох результатів використати; водночас іскра лускає й на мить висипає яскраві, безпечні іскри.\n\n**Кидок атаки.** Одразу після того, як істота кидає кістку Бардського натхнення, щоб додати її до кидка атаки проти цілі, іскра з оглушливим тріском розлітається. Ціль і кожна істота на ваш вибір, яку ви бачите в межах 5 футів від неї, повинні успішно пройти ряткидок Статури проти СК ряткидку ваших заклинань, інакше отримують громову шкоду, що дорівнює числу, яке випало на кістці Бардського натхнення.\n\n**Ряткидок.** Одразу після того, як істота кидає кістку Бардського натхнення й додає її до ряткидка, іскра зникає під звук мʼякої музики, а істота отримує тимчасові хіт-поінти, що дорівнюють числу, яке випало на кістці Бардського натхнення, + ваш модифікатор Харизми (мінімум 1 тимчасовий хіт-поінт)."},{"level":3,"name":"Нота потенціалу","engName":"Note of Potential","description":"На 3 рівні ви можете маніпулювати піснею творення. Коли ви даєте комусь Бардське натхнення, воно стає Нотою потенціалу. Вона дає додатковий ефект при використанні:\n\n**Перевірка характеристики**: Кістка натхнення кидається двічі, обирається кращий результат.\n**Кидок атаки**: Якщо атака влучає, ціль і всі вороги в 5 футах від неї отримують додаткову громову шкоду рівну кидку кістки натхнення.\n**Ряткидок**: Істота отримує тимчасові хіти рівні кидку кістки натхнення + ваш модифікатор Харизми."},{"level":6,"name":"Пожвавлюючий виступ","engName":"Animating Performance","description":"Починаючи з 6 рівня, ви можете дією оживити один Великий або менший немагічний предмет у межах 30 футів від вас, якщо його ніхто не носить і не тримає. Оживлений предмет використовує блок характеристик Танцюючого предмета, який застосовує ваш бонус майстерності. Предмет дружній до вас і ваших супутників та виконує ваші накази. Він існує 1 годину, доки його хіт-поінти не зменшаться до 0 або доки ви не помрете.\n\nУ бою предмет ділить з вами значення ініціативи, але діє відразу після вас. Він може самостійно рухатися й використовувати реакцію, але єдина дія, яку він виконує у свій хід, — це Ухилення [Dodge], якщо тільки ви не витратите бонусну дію у свій хід, щоб наказати йому виконати іншу дію. Цією дією може бути дія з його блоку характеристик або якась інша дія. Якщо ви стаєте недієздатним, предмет може виконувати будь-яку дію на власний вибір, а не лише Ухилення.\n\nКоли ви використовуєте свою рису Бардське натхнення, ви можете віддати наказ предмету як частину тієї самої бонусної дії, яку використовуєте для Бардського натхнення.\n\nЩойно ви оживили предмет цією рисою, ви не можете зробити це знову, доки не завершите довгий відпочинок, хіба що витратите слот заклинань 3 рівня або вищого, щоб скористатися цією рисою ще раз. Водночас у вас може бути лише один предмет, оживлений цією рисою; якщо ви використовуєте цю дію, уже маючи Танцюючий предмет, попередній негайно стає неживим.\n\n**Танцюючий предмет**\nВеликий або менший конструкт\n\n**Клас Броні:** 16 (природний обладунок)\n**Хіт-поінти:** 10 + 5 × ваш рівень барда\n**Швидкість:** 30 футів, політ 30 футів (зависання)\n\n**СИЛ** 18 (+4)   **СПР** 14 (+2)   **СТА** 16 (+3)   **ІНТ** 4 (−3)   **МУД** 10 (+0)   **ХАР** 6 (−2)\n\n**Імунітет до шкоди:** отрута, психічна\n**Імунітет до станів:** Причарований, Виснаження, Отруєний, Наляканий\n**Чуття:** темнозір 60 футів, пасивна Уважність 10\n**Мови:** розуміє мови, якими говорите ви\n**Небезпека:** —\n**Бонус майстерності (БМ):** дорівнює вашому бонусу\n\n**Незмінна форма.** Предмет має імунітет до будь-якого заклинання чи ефекту, що змінював би його форму.\n\n**Нестримний танок.** Коли будь-яка істота починає свій хід у межах 10 футів від предмета, предмет може збільшити або зменшити (на ваш вибір) швидкість ходьби цієї істоти на 10 футів до кінця ходу, якщо предмет не є недієздатним.\n\n**Дії**\n**Силовий удар.** *Рукопашна атака зброєю:* ваш модифікатор атаки заклинанням до влучання, досяжність 5 футів, одна ціль, яку ви бачите. *Влучання:* 1к10 + БМ шкоди силовим полем."},{"level":14,"name":"Творче крещендо","engName":"Creative Crescendo","description":"На 14 рівні, коли ви використовуєте рису Виступ творення, ви можете створити більше ніж один предмет водночас. Кількість предметів дорівнює вашому модифікатору Харизми (мінімум два предмети). Якщо ви створюєте предмет, через який перевищили б цю кількість, ви самі обираєте, який із раніше створених предметів зникає. Лише один із цих предметів може бути найбільшого розміру, який ви здатні створити; усі інші мають бути Малими або Крихітними.\n\nКрім того, створюючи предмети Виступом творення, ви більше не обмежені їхньою вартістю у зм."}]},{"name":"Колегія шепотів","engName":"College of Whispers","slug":"college-of-whispers","kind":"Підклас","description":"Барда охоче приймають будь-де, і Колегія шепотів обертає це собі на користь. Її барди поводяться як інші — діляться новинами, співають і розповідають історії, — але вчаться бути вовками серед овець: знання й магію вони використовують, щоб викривати таємниці й шантажем та погрозами обертати їх проти інших. Тому свою справжню природу вони рідко розкривають.","features":[{"level":3,"name":"Психічні леза","engName":"Psychic Blades (College of Whispers)","description":"На 3 рівні, коли ви вступаєте до Колегії шепотів, ви здобуваєте здатність робити свої атаки зброєю магічно згубними для розуму істоти.\n\nКоли ви влучаєте по істоті атакою зброєю, ви можете витратити одне використання Бардського натхнення, щоб завдати цій цілі додатково 2к6 психічної шкоди. Ви можете робити це лише один раз за раунд у свій хід.\n\nПсихічна шкода зростає, коли ви досягаєте певних рівнів у цьому класі: до 3к6 на 5 рівні, 5к6 на 10 рівні та 8к6 на 15 рівні."},{"level":3,"name":"Слова жаху","engName":"Words of Terror","description":"На 3 рівні ви вчитеся наповнювати невинні на вигляд слова підступною магією, що може вселяти жах.\n\nЯкщо ви говорите з гуманоїдом наодинці щонайменше 1 хвилину, ви можете спробувати посіяти в його розумі параною та страх. Наприкінці розмови ціль повинна зробити ряткидок Мудрості проти СК ряткидку ваших заклинань, інакше вона стає Наляканою вами або іншою істотою на ваш вибір. У такий спосіб ціль залишається Наляканою 1 годину, доки її не атакують чи не завдадуть їй шкоди, або доки вона не побачить, як атакують чи завдають шкоди її союзникам.\n\nЯкщо ціль успішно проходить ряткидок, вона не здогадується, що ви намагалися її налякати.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите короткий або довгий відпочинок."},{"level":6,"name":"Мантія шепотів","engName":"Mantle of Whispers","description":"На 6 рівні ви здобуваєте здатність переймати подобу гуманоїда. Коли гуманоїд помирає в межах 30 футів від вас, ви можете реакцією чарівним чином захопити його тінь. Ви зберігаєте цю тінь, доки не використаєте її або доки не завершите довгий відпочинок.\n\nВи можете використати тінь дією. Коли ви це робите, вона зникає, чарівним чином перетворюючись на маскування, що зʼявляється на вас. Тепер ви виглядаєте як померла особа, тільки здоровою і живою. Це маскування триває 1 годину або доки ви не припините його бонусною дією.\n\nПоки ви перебуваєте в цьому маскуванні, ви маєте доступ до всієї інформації, якою гуманоїд охоче поділився б із випадковим знайомим. Це, зокрема, загальні відомості про його минуле й особисте життя, але не таємниці. Цієї інформації достатньо, щоб ви могли видавати себе за цю особу, спираючись на її спогади.\n\nІнша істота може розпізнати це маскування, якщо успішно пройде перевірку Мудрості (Аналіз Поведінки) у змаганні з вашою перевіркою Харизми (Обман). Ви отримуєте бонус +5 до своєї перевірки.\n\nЩойно ви захопили тінь за допомогою цієї риси, ви не можете захопити іншу, доки не завершите короткий або довгий відпочинок."},{"level":14,"name":"Тіньові знання","engName":"Shadow Lore","description":"На 14 рівні ви здобуваєте здатність вплітати темну магію у свої слова й торкатися найглибших страхів істоти.\n\nДією ви чарівним чином шепочете фразу, яку може почути лише одна істота на ваш вибір у межах 30 футів від вас. Ціль повинна зробити ряткидок Мудрості проти СК ряткидку ваших заклинань. Вона автоматично досягає успіху, якщо не розуміє жодної мови, спільної з вами, або якщо не може вас чути. У разі успішного ряткидка ваш шепіт звучить як нерозбірливе бурмотіння й не має жодного ефекту.\n\nЯкщо ціль провалює ряткидок, вона стає Причарованою вами на наступні 8 годин або доки ви чи ваші союзники не атакуєте її і не завдасте їй шкоди. Вона сприймає ваш шепіт як опис своєї найганебнішої таємниці.\n\nХоча ви не дізнаєтеся цієї таємниці, ціль переконана, що ви її знаєте. Поки істота Причарована таким чином, вона виконує ваші накази, боячись, що ви розкриєте її секрет. Вона не ризикуватиме заради вас життям і не битиметься за вас, хіба що й без того була до цього схильна. Вона надає вам послуги й дарунки, які запропонувала б близькому другові.\n\nКоли ефект закінчується, істота не розуміє, чому так вас боялася.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите довгий відпочинок."}]}]},{"edition":"2014","name":"Клірик","engName":"Cleric","slug":"cleric","description":"Клірики — посередники між світом смертних і далекими планами богів. Такі ж розмаїті, як боги, яким вони служать, клірики прагнуть утілювати волю своїх божеств. Клірик — не звичайний священник: його наповнює божественна магія.\n\nБожественна магія — це сила богів, що ллється від них у світ, а клірики — її провідники. Боги дарують цю силу не кожному, хто її шукає, а лише обраним для високого покликання, і залежить вона не від навчання, а від відданості й чуття волі божества. Клірики поєднують цілющу й надихаючу магію із заклинаннями, що ранять і стримують ворогів, а за потреби йдуть у ближній бій із силою богів на своєму боці.\n\nНе кожен служитель храму є кліриком, і справжні клірики рідкісні. У пригоди клірика найчастіше веде воля бога: знищувати зло, шукати святі реліквії чи захищати вірян свого божества.","facts":["Кістка хітів: к8","Підклас з 1 рівня","14 підкласів"],"features":[{"level":1,"name":"Божественний домен","engName":"Divine Domain","description":"На 1 рівні ви обираєте божественний домен, повʼязаний з вашим божеством. Домен визначає частину ваших здібностей і дає доменні риси на вищих рівнях."},{"level":1,"name":"Чаротворство (Клірик)","engName":"Spellcasting (Cleric)","description":"Ви є провідником божественної сили й накладаєте заклинання клірика.\n\n**Підготовлені заклинання**: ви щодня готуєте список заклинань клірика. Кількість підготовлених заклинань дорівнює вашому модифікатору Мудрості + ваш рівень клірика (мінімум 1).\n\n**Слоти заклинань**: Таблиця клірика показує, скільки слотів заклинань у вас є для накладання заклинань 1 рівня і вище. Витрачені слоти відновлюються після тривалого відпочинку.\n\n**Характеристика заклинань**: Мудрість є вашою характеристикою заклинань.\n\nСК ряткидку заклинань = 8 + Бонус Майстерності (БМ) + модифікатор Мудрості.\nМодифікатор атаки заклинаннями = БМ + модифікатор Мудрості."},{"level":2,"name":"Вигнання нежиті","engName":"Turn Undead","description":"Починаючи з 2 рівня, ви можете дією використати Канал божественності, щоб вигнати нежить. Нежить у межах дії повинна зробити ряткидок Мудрості; при провалі вона стає вигнаною на 1 хвилину або доки не отримає шкоду."},{"level":2,"name":"Канал божественності (Клірик)","engName":"Channel Divinity (Cleric)","description":"Починаючи з 2 рівня, ви можете спрямовувати божественну енергію, щоб створювати магічні ефекти домену. Деякі ефекти Каналу божественності вимагають дії.\n\nКількість використань зростає з рівнем, а витрачені використання відновлюються після короткого або тривалого відпочинку."},{"level":4,"name":"Покращення Характеристик","engName":"Ability Score Improvement","description":"+2 до однієї або +1 до двох характеристик."},{"level":5,"name":"Знищення нежиті","engName":"Destroy Undead","description":"Починаючи з 5 рівня, коли нежить провалює ряткидок проти вашого Вигнання нежиті, вона може бути знищена миттєво, якщо її РЗ (CR) достатньо низький. Поріг зростає на вищих рівнях."},{"level":10,"name":"Божественне втручання","engName":"Divine Intervention","description":"Починаючи з 10 рівня, ви можете дією просити своє божество про допомогу. Ефект визначає Ведучий. Якщо божество втрутилося, ви не можете використовувати цю рису знову, доки не завершите тривалий відпочинок."}],"children":[{"name":"Домен бурі","engName":"Tempest Domain","slug":"tempest-domain","kind":"Підклас","description":"Боги Домену бурі правлять штормами, морем і небом: це боги грому й блискавки, землетрусів, а подекуди — насильства, сили й мужності. У деяких пантеонах такий бог панує над іншими й вершить швидкий суд блискавкою, а в мореплавців опікується моряками. Своїх жерців ці боги посилають вселяти страх у простий люд — щоб той тримався праведного шляху або жертвами відвертав божий гнів.","features":[{"level":1,"name":"Гнів бурі","engName":"Wrath of the Storm","description":"Також на 1 рівні ви можете громовим відпором карати нападників. Коли істота в межах 5 футів від вас, яку ви бачите, влучає по вас атакою, ви можете реакцією змусити її зробити ряткидок Спритності. Істота отримує 2к8 блискавичної або громової шкоди (на ваш вибір), якщо провалює ряткидок, або половину цієї шкоди в разі успіху.\n\n      Ви можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":1,"name":"Додаткові майстерності (Буря)","engName":"Bonus Proficiencies (Tempest Domain)","description":"На 1 рівні ви отримуєте Володіння важкими обладунками та бойовою зброєю."},{"level":1,"name":"Заклинання домену (Буря)","engName":"Tempest Domain Spells","description":"1р. Туманна хмара [Fog Cloud], Громова хвиля [Thunderwave];\n3р. Порив вітру [Gust of Wind], Друзки [Shatter];\n5р. Накликання блискавки [Call Lightning], Завірюха [Sleet Storm];\n7р. Контроль води [Control Water], Крижаний шторм [Ice Storm];\n9р. Руйнівна хвиля [Destructive Wave], Нашестя комах [Insect Plague].\n\nЗаклинання домену завжди підготовлені й не враховуються до ліміту."},{"level":2,"name":"Божественність: Руйнівний гнів","engName":"Channel Divinity: Destructive Wrath","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб орудувати силою бурі з нестримною люттю. Коли ви кидаєте куби блискавичної або громової шкоди, ви можете використати свій Виклик божественності, щоб завдати максимальної шкоди замість кидка."},{"level":6,"name":"Удар блискавки","engName":"Thunderbolt Strike","description":"На 6 рівні, коли ви завдаєте блискавичної шкоди Великій або меншій істоті, ви також можете відштовхнути її від себе на відстань до 10 футів."},{"level":8,"name":"Божественний удар (Буря)","engName":"Divine Strike (Tempest)","description":"На 8 рівні раз за хід при влучанні зброєю додаєте 1к8 громової шкоди; з 14 рівня — 2к8."},{"level":17,"name":"Народжений бурею","engName":"Stormborn","description":"На 17 рівні ви отримуєте швидкість польоту, рівну вашій поточній швидкості ходи, щоразу, коли ви не перебуваєте під землею або в приміщенні."}]},{"name":"Домен війни","engName":"War Domain","slug":"war-domain","kind":"Підклас","description":"Війна буває героїчною й буває жахливою, але боги війни наглядають за воїнами й винагороджують їх за звитяги. Жерці таких богів вирізняються в бою: одні надихають інших битися за добру справу, інші приносять насильство як молитву. Серед богів війни є поборники честі й лицарства, боги руйнування й грабунку, боги завоювання — і нейтральні, що підтримують війну в усіх її проявах.","features":[{"level":1,"name":"Додаткові майстерності (Війна)","engName":"Bonus Proficiencies (War Domain)","description":"На 1 рівні ви отримуєте Володіння важкими обладунками та бойовою зброєю."},{"level":1,"name":"Заклинання домену (Війна)","engName":"War Domain Spells","description":"1р. Божа милість [Divine Favor], Щит віри [Shield of Faith];\n3р. Магічна зброя [Magic Weapon], Духовна зброя [Spiritual Weapon];\n5р. Мантія хрестоносця [Crusader's Mantle], Духи захисники [Spirit Guardians];\n7р. Свобода рухів [Freedom of Movement], Камʼяна шкіра [Stoneskin];\n9р. Полумʼяний удар [Flame Strike], Стримування монстра [Hold Monster].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":1,"name":"Священик війни","engName":"War Priest","description":"Починаючи з 1 рівня, ваш бог посилає вам спалахи натхнення, коли ви перебуваєте в бою. Коли ви виконуєте дію Атака, ви можете бонусною дією зробити одну атаку зброєю.\n\n      Ви можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":2,"name":"Божественність: Наведений удар","engName":"Channel Divinity: Guided Strike (War Domain)","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб вражати з надприродною точністю. Коли ви робите кидок атаки, ви можете використати свій Виклик божественності, щоб отримати +10 до цього кидка. Ви робите цей вибір після того, як побачили результат кидка, але до того, як Майстер скаже, чи атака влучає чи промахується."},{"level":6,"name":"Божественність: Благословення бога війни","engName":"Channel Divinity: War God’s Blessing","description":"На 6 рівні, коли істота в межах 30 футів від вас робить кидок атаки, ви можете реакцією надати цій істоті +10 до кидка, використовуючи свій Виклик божественності. Ви робите цей вибір після того, як побачили результат кидка, але до того, як Майстер скаже, чи атака влучає чи промахується."},{"level":8,"name":"Божественний удар (Війна)","engName":"Divine Strike (War)","description":"На 8 рівні раз за хід при влучанні зброєю додаєте 1к8 шкоди того ж типу, що й зброя. На 14 рівні — 2к8."},{"level":17,"name":"Аватар битви","engName":"Avatar of Battle","description":"На 17 рівні ви маєте опір дробильній, колючій та рубальній шкоді від немагічних атак."}]},{"name":"Домен життя","engName":"Life Domain","slug":"life-domain","kind":"Підклас","description":"Домен життя зосереджений на яскравій позитивній енергії — одній з основних сил всесвіту, що підтримує все живе. Боги життя дбають про здоровʼя й снагу: зцілюють хворих і поранених, опікуються знедоленими й проганяють сили смерті та нежиті. На цей домен може претендувати майже будь-яке не зле божество — особливо боги землеробства, сонця, зцілення й домашнього вогнища.","features":[{"level":1,"name":"Додаткові майстерності (Життя)","engName":"Bonus Proficiency (Life Domain)","description":"На 1 рівні отримуєте Володіння важкими обладунками."},{"level":1,"name":"Заклинання домену (Життя)","engName":"Life Domain Spells","description":"1р. Благословення [Bless], Лікування ран [Cure Wounds];\n3р. Мале відновлення [Lesser Restoration], Духовна зброя [Spiritual Weapon];\n5р. Маяк надії [Beacon of Hope], Відродження [Revivify];\n7р. Захист від смерті [Death Ward], Вартовий віри [Guardian of Faith];\n9р. Масове лікування ран [Mass Cure Wounds], Оживлення мерців [Raise Dead].\n\nЗаклинання домену завжди підготовлені й не враховуються до ліміту."},{"level":1,"name":"Учень життя","engName":"Disciple of Life","description":"Також на 1 рівні ваші зцілювальні заклинання стають дієвішими. Щоразу, коли ви використовуєте заклинання 1 рівня або вищого, щоб відновити хіти істоті, ця істота додатково відновлює хіти, рівні 2 + рівень заклинання."},{"level":2,"name":"Божественність: Збереження життя","engName":"Channel Divinity: Preserve Life","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб зцілювати тяжко поранених.\n\nДією ви демонструєте свій священний символ і викликаєте цілющу енергію, яка може відновити кількість хітів, рівну пʼятиразовому вашому рівню клірика. Оберіть будь-яких істот у межах 30 футів від вас і розподіліть ці хіти між ними. Ця риса не може відновити істоті більше ніж половину її максимуму хітів. Ви не можете використати цю рису на немертвому або конструкті."},{"level":6,"name":"Блаженний цілитель","engName":"Blessed Healer","description":"Починаючи з 6 рівня, заклинання зцілення, які ви накладаєте на інших, зцілюють і вас. Коли ви накладаєте заклинання 1 рівня або вищого, що відновлює хіти істоті, яка не є вами, ви відновлюєте хіти, рівні 2 + рівень заклинання."},{"level":8,"name":"Божественний удар (Життя)","engName":"Divine Strike (Life)","description":"На 8 рівні раз за хід при влучанні зброєю додаєте 1к8 світлої шкоди; з 14 рівня — 2к8."},{"level":17,"name":"Найвище лікування","engName":"Supreme Healing","description":"Починаючи з 17 рівня, коли вам зазвичай довелося б кидати один або кілька кубів, щоб відновити хіти заклинанням, ви натомість використовуєте для кожного куба найбільше можливе значення. Наприклад, замість того щоб відновити істоті 2к6 хітів, ви відновлюєте 12."}]},{"name":"Домен знань","engName":"Knowledge Domain","slug":"knowledge-domain","kind":"Підклас","description":"Боги знань над усе цінують навчання й розуміння. Одні вчать збирати знання в бібліотеках і університетах або шанують ремесло й винахідництво, інші ревно бережуть свої таємниці чи обіцяють величезну силу тим, хто розгадає загадки мультивсесвіту. Їхні послідовники вивчають езотеричні знання, збирають старовинні томи й досліджують таємні куточки світу.","features":[{"level":1,"name":"Благословення знань","engName":"Blessings of Knowledge","description":"На 1 рівні ви вивчаєте дві мови й отримуєте Володіння двома навичками на вибір: Магія, Історія, Природа або Релігія. Для цих навичок ваш Бонус Майстерності подвоюється."},{"level":1,"name":"Заклинання домену (Знання)","engName":"Knowledge Domain Spells","description":"1р. Наказ [Command], Розпізнавання [Identify];\n3р. Пророкування [Augury], Навіювання [Suggestion];\n5р. Невиявлення [Nondetection], Розмова з мертвими [Speak with Dead];\n7р. Арканне око [Arcane eye], Спантеличення [Confusion];\n9р. Знання легенд [Legend Lore], Стеження [Scrying].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":2,"name":"Божественність: Знання віків","engName":"Channel Divinity: Knowledge of the Ages","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб припасти до божественного джерела знання. Дією ви обираєте одну навичку або один набір інструментів. Протягом 10 хвилин ви володієте вибраною навичкою або інструментами."},{"level":6,"name":"Божественність: Читання думок","engName":"Channel Divinity: Read Thoughts","description":"На 6 рівні ви можете використати свій Виклик божественності, щоб читати думки істоти. Потім ви можете використати доступ до її розуму, щоб наказати їй щось зробити.\n\nДією оберіть одну істоту, яку ви бачите в межах 60 футів від себе. Ця істота мусить зробити ряткидок Мудрості. Якщо істота успішно проходить ряткидок, ви не можете знову використати цю рису на ній, доки не завершите тривалий відпочинок.\n\nЯкщо істота провалює ряткидок, ви можете читати її поверхневі думки (ті, що зараз на першому плані її свідомості, відображають її поточні емоції та те, про що вона активно думає), поки вона перебуває в межах 60 футів від вас. Цей ефект триває 1 хвилину.\n\nПротягом цього часу ви можете своєю дією завершити цей ефект і накласти на істоту закляття Навіювання [Suggestion], не витрачаючи осередок заклинання. Ціль автоматично провалює свій ряткидок проти цього закляття."},{"level":8,"name":"Потужне заклинання (Знання)","engName":"Potent Spellcasting (Knowledge Domain)","description":"На 8 рівні додаєте модифікатор Мудрості до шкоди від замовлянь клірика."},{"level":17,"name":"Видіння минулого","engName":"Visions of the Past","description":"Починаючи з 17 рівня, ви можете викликати видіння минулого, повʼязані з предметом, який тримаєте, або з вашим безпосереднім оточенням. Ви витрачаєте щонайменше 1 хвилину на медитацію й молитву, після чого отримуєте схожі на сон, тіньові проблиски недавніх подій. Ви можете медитувати так кількість хвилин, що дорівнює вашому значенню Мудрості, і протягом цього часу мусите підтримувати концентрацію, ніби ви накладаєте заклинання.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите короткий або тривалий відпочинок.\n\nЧитання предмета. Тримаючи предмет під час медитації, ви можете побачити видіння його попереднього власника. Після 1 хвилини медитації ви дізнаєтеся, як власник здобув і втратив цей предмет, а також про останню значущу подію, повʼязану з предметом і тим власником. Якщо предмет належав іншій істоті в недавньому минулому (протягом кількості днів, що дорівнює вашому значенню Мудрості), ви можете витратити по 1 додатковій хвилині на кожного такого власника, щоб дізнатися ту саму інформацію і про нього.\n\nЧитання місцевості. Під час медитації ви бачите видіння недавніх подій у своїй безпосередній околиці (кімната, вулиця, тунель, галявина тощо, обсягом до куба зі стороною 50 футів), що сягають у минуле на кількість днів, рівну вашому значенню Мудрості. За кожну хвилину медитації ви дізнаєтеся про одну значущу подію, починаючи з найсвіжішої. Значущі події зазвичай супроводжуються сильними емоціями — битви й зради, весілля й убивства, народження й похорони, — але це можуть бути й буденніші події, якщо вони мають значення для вашої теперішньої ситуації."}]},{"name":"Домен кузні","engName":"Forge Domain","slug":"forge-domain","kind":"Підклас","description":"Боги кузні опікуються майстрами, що працюють із металом, — від сільського коваля, який кує підкови й лемеші, до ельфійського митця, чиї мітрилові стріли валили володарів демонів. Вони вчать, що терпінням і працею найупертіший метал можна перетворити на прекрасну річ. Їхні жерці шукають загублене в темряві, звільняють захоплені орками копальні й добувають рідкісні матеріали для магічних предметів.","features":[{"level":1,"name":"Благословення кузні","engName":"Blessing of the Forge","description":"На 1 рівні ви здобуваєте здатність вкладати магію в зброю або обладунок. Наприкінці тривалого відпочинку ви можете торкнутися одного немагічного предмета, який є комплектом обладунків або простою чи бойовою зброєю. До кінця вашого наступного тривалого відпочинку або доки ви не помрете, предмет стає магічним: якщо це обладунок, він дає +1 до КБ, а якщо це зброя — +1 до кидків атаки й кидків шкоди.\n\nСкориставшись цією рисою, ви не можете використати її знову, доки не завершите тривалий відпочинок."},{"level":1,"name":"Додаткові майстерності (Коваль)","engName":"Bonus Proficiencies (Forge Domain)","description":"На 1 рівні ви отримуєте Володіння важкими обладунками та ковалівськими інструментами."},{"level":1,"name":"Заклинання домену (Коваль)","engName":"Forge Domain Spells","description":"1р. Розпізнавання [Identify], Паляча кара [Searing Smite];\n3р. Розжарення металу [Heat Metal], Магічна зброя [Magic Weapon];\n5р. Стихійна зброя [Elemental Weapon], Захист від енергії [Protection from Energy];\n7р. Виготовлення [Fabricate], Стіна вогню [Wall of Fire];\n9р. Оживлення предметів [Animate objects], Творення [Creation].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту підготовлених."},{"level":2,"name":"Божественність: Благословення ремісника","engName":"Channel Divinity: Artisan’s Blessing","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб створювати прості предмети.\n\nВи проводите годинний ритуал, який створює немагічний предмет, що мусить містити бодай трохи металу: просту чи бойову зброю, комплект обладунків, десять одиниць боєприпасів, набір інструментів або інший металевий предмет. Створення завершується наприкінці години, і предмет зʼявляється в незайнятому просторі на поверхні в межах 5 футів від вас.\n\nСтворений предмет може коштувати не більш як 100 зм. У межах ритуалу ви мусите викласти метал, зокрема можна використати монети, загальною вартістю, що дорівнює вартості створення. Наприкінці ритуалу цей метал безповоротно зливається й перетворюється на створений предмет, магічно формуючи навіть його неметалеві частини.\n\nРитуал також може створити дублікат немагічного предмета, що містить метал, наприклад ключ, якщо під час ритуалу ви маєте при собі оригінал."},{"level":6,"name":"Душа ковальства","engName":"Soul of the Forge","description":"Починаючи з 6 рівня, ваша майстерність кузні наділяє вас особливими здібностями:\n\n• Ви маєте опір вогняній шкоді.\n• Поки ви носите важкі обладунки, ви отримуєте +1 до КБ."},{"level":8,"name":"Божественний удар (Коваль)","engName":"Divine Strike (Forge)","description":"На 8 рівні раз за хід, коли ви влучаєте атакою зброєю, додаєте 1к8 вогняної шкоди. На 14 рівні — 2к8."},{"level":17,"name":"Святий кузні й вогню","engName":"Saint of Forge and Fire","description":"На 17 рівні ваша благословенна спорідненість із вогнем і металом стає ще сильнішою:\n\n• Ви здобуваєте імунітет до вогняної шкоди.\n• Поки ви носите важкі обладунки, ви маєте опір дробильній, колючій і рубальній шкоді від немагічних атак."}]},{"name":"Домен магії","engName":"Arcana Domain","slug":"arcana-domain","kind":"Підклас","description":"Магія — енергія, що пронизує мультивсесвіт і живить і руйнування, і творення. Боги Домену магії досконало знають її таємниці: для одних магічне знання — велика відповідальність і особливе розуміння природи реальності, для інших — чиста сила, якою володар розпоряджається як завгодно. Такі боги часто повʼязані й зі знанням, адже вчення й арканна сила зазвичай ідуть пліч-о-пліч.","features":[{"level":1,"name":"Арканний адепт","engName":"Arcane Initiate (Arcana Domain)","description":"Коли на 1 рівні ви обираєте цей домен, ви отримуєте Володіння навичкою Магія, а також вивчаєте два замовляння на свій вибір зі списку заклинань чарівника. Для вас ці замовляння вважаються замовляннями клірика."},{"level":1,"name":"Заклинання домену (Аркана)","engName":"Arcana Domain Spells","description":"Додатково підготовлені: 1р. Виявлення магії [Detect Magic], Магічний дротик [Magic missile];\n3р. Магічна зброя [Magic Weapon], Ністулова магічна аура [Nystul's Magic Aura];\n5р. Розвіювання магії [Dispel Magic], Магічне коло [Magic Circle];\n7р. Арканне око [Arcane eye], Таємна скриня Леомунда [Leomund's Secret Chest];\n9р. Планарне поневолення [Planar Binding], Коло телепортації [Teleportation Circle].\n\nКоли ви отримуєте рівень клірика, додаєте заклинання домену до підготовлених. Вони завжди підготовлені й не враховуються в обмеження підготовлених заклять."},{"level":2,"name":"Божественність: Арканне відганяння","engName":"Channel Divinity: Arcane Abjuration","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб відганяти потойбічних істот.\n\nДією ви демонструєте свій священний символ, і один небожитель, елементаль, фея або злий дух на ваш вибір у межах 30 футів від вас повинен зробити ряткидок Мудрості, за умови, що істота може вас бачити або чути. Якщо істота провалює ряткидок, вона відвернена на 1 хвилину або доки не зазнає будь-якої шкоди.\n\nВідвернена істота мусить у свої ходи намагатися відійти від вас якомога далі та не може добровільно завершити свій рух у просторі в межах 30 футів від вас. Вона також не може виконувати реакції. На свою дію вона може лише виконати дію Ривок або спробувати звільнитися від ефекту, що заважає їй рухатися. Якщо їй нікуди рухатися, вона може виконати дію Ухилення.\n\nПісля досягнення 5 рівня, коли істота провалює ряткидок проти вашої риси Арканне відганяння, вона вигнана на 1 хвилину (як у заклятті Вигнання [Banishment], без потреби в концентрації), якщо вона не перебуває на рідному плані й її показник небезпеки не перевищує поріг, зазначений у таблиці Арканного вигнання:\n\nРівень клірика  ПН вигнаних істот\n5-й             1/2 або нижче\n8-й             1 або нижче\n11-й            2 або нижче\n14-й            3 або нижче\n17-й            4 або нижче"},{"level":6,"name":"Ламання заклять","engName":"Spell Breaker","description":"Починаючи з 6 рівня, коли ви заклинанням 1 рівня або вищим відновлюєте хіти союзнику, ви також можете завершити на цій істоті одне закляття на свій вибір. Рівень закляття, яке ви завершуєте, має бути не вищим за рівень осередку, витраченого на накладання зцілювального заклинання."},{"level":8,"name":"Потужне заклинання (Аркана)","engName":"Potent Spellcasting (Arcana Domain)","description":"На 8 рівні додаєте свій модифікатор Мудрості до шкоди, яку завдають ваші замовляння клірика."},{"level":17,"name":"Арканне оволодіння","engName":"Arcane Mastery","description":"На 17 рівні ви обираєте чотири заклинання зі списку чарівника: по одному заклинанню 6, 7, 8 і 9 рівня. Ви додаєте їх до свого списку заклинань домену. Як і інші ваші заклинання домену, вони завжди підготовлені й вважаються для вас заклинаннями клірика."}]},{"name":"Домен миру","engName":"Peace Domain","slug":"peace-domain","kind":"Підклас","description":"Цілюща сила миру живе в серці здорових громад, між дружніми народами й у душах добросердих. Боги миру надихають усіх розвʼязувати конфлікти й протистояти силам, що не дають миру розквітнути. Жерці Домену миру наглядають за підписанням угод і часто розсуджують суперечки, а їхні благословення єднають людей і допомагають нести тягар одне одного.","features":[{"level":1,"name":"Заклинання домену (Мир)","engName":"Peace Domain Spells","description":"1р. Героїзм [Heroism], Святилище [Sanctuary];\n3р. Підтримка [Aid], Охоронний звʼязок [Warding Bond];\n5р. Маяк надії [Beacon of Hope], Послання [Sending];\n7р. Аура очищення [Aura of Purity], Пружна сфера Отілюка [Otiluke's Resilient Sphere];\n9р. Більше відновлення [Greater Restoration], Телепатичний звʼязок Рері [Rary's Telepathic Bond].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":1,"name":"Зміцнювальний звʼязок","engName":"Emboldening Bond","description":"Починаючи з 1 рівня, ви можете викувати підбадьорливий звʼязок між тими, хто перебуває в мирі один з одним. Дією ви обираєте кількість добровільних істот у межах 30 футів від вас (це можете бути й ви), що дорівнює вашому Бонусу Майстерності. Ви створюєте між ними магічний звʼязок на 10 хвилин або доки не використаєте цю рису знову. Поки будь-яка зі звʼязаних істот перебуває в межах 30 футів від іншої звʼязаної істоти, вона може кинути 1к4 й додати результат до кидка атаки, перевірки характеристики або ряткидка, який робить. Кожна істота може додати цей 1к4 не більш як один раз за хід.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":1,"name":"Знаряддя миру","engName":"Implement of Peace","description":"Коли на 1 рівні ви обираєте цей домен, ви отримуєте Володіння навичкою Аналіз Поведінки, Виступ або Переконання на свій вибір."},{"level":2,"name":"Божественність: Бальзам миру","engName":"Channel Divinity: Balm of Peace","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб зробити саму свою присутність заспокійливим бальзамом. Дією ви можете переміститися на відстань до своєї швидкості, не провокуючи можливих атак, і коли під час цього руху ви проходите в межах 5 футів від будь-якої іншої істоти, ви можете відновити їй кількість хітів, рівну 2к6 + ваш модифікатор Мудрості (мінімум 1 хіт). Істота може отримати це зцілення лише один раз щоразу, коли ви використовуєте цю дію."},{"level":6,"name":"Захисний звʼязок","engName":"Protective Bond","description":"Починаючи з 6 рівня, звʼязок, який ви створюєте між людьми, допомагає їм захищати одне одного. Коли істота під впливом вашої риси Зміцнювальний звʼязок має от-от отримати шкоду, друга звʼязана істота в межах 30 футів від першої може використати свою реакцію, щоб телепортуватися в незайнятий простір у межах 5 футів від першої істоти. Друга істота тоді отримує всю цю шкоду замість неї."},{"level":8,"name":"Потужне заклинання (Мир)","engName":"Potent Spellcasting (Peace Domain)","description":"На 8 рівні додаєте модифікатор Мудрості до шкоди від замовлянь клірика."},{"level":17,"name":"Розширений звʼязок","engName":"Expansive Bond","description":"На 17 рівні переваги ваших рис Зміцнювальний звʼязок і Захисний звʼязок тепер діють, коли істоти перебувають у межах 60 футів одна від одної. Крім того, коли істота використовує Захисний звʼязок, щоб прийняти на себе чужу шкоду, вона має опір до цієї шкоди."}]},{"name":"Домен могили","engName":"Grave Domain","slug":"grave-domain","kind":"Підклас","description":"Боги могили стережуть межу між життям і смертю: для них смерть і посмертя — основа мультивсесвіту, а порушити спокій мертвих — мерзота. Їхні послідовники заспокоюють блукаючих духів, знищують нежить і полегшують страждання вмирущих. Їхня магія може на час відвернути смерть, особливо від того, хто ще має звершити щось велике, але це відстрочка, а не порятунок: смерть зрештою своє візьме.","features":[{"level":1,"name":"Заклинання домену (Могила)","engName":"Grave Domain Spells","description":"1р. Зурочення [Bane], Удаване життя [False life];\n3р. Нетлінні рештки [Gentle Repose], Промінь ослаблення [Ray of Enfeeblement];\n5р. Відродження [Revivify], Вампіричний дотик [Vampiric Touch];\n7р. Усихання [Blight], Захист від смерті [Death Ward];\n9р. Оболонка проти живих [Antilife shell], Оживлення мерців [Raise Dead].\n\nЗаклинання домену завжди підготовлені й не враховуються в ліміт."},{"level":1,"name":"Коло смертності","engName":"Circle of Mortality","description":"На 1 рівні ви здобуваєте здатність впливати на межу між життям і смертю. Коли вам зазвичай довелося б кидати один або кілька кубів, щоб відновити хіти заклинанням істоті з 0 хітів, натомість ви використовуєте для кожного куба найбільше можливе значення.\n\nКрім того, ви вивчаєте замовляння Милість до вмирущого [Spare the Dying]. Воно не враховується до кількості відомих вам замовлянь клірика. Для вас його дальність становить 30 футів, і ви можете накладати його бонусною дією."},{"level":1,"name":"Очі могили","engName":"Eyes of the Grave","description":"На 1 рівні ви здобуваєте здатність час від часу відчувати присутність немертвих, чиє існування є наругою над природним колом життя. Дією ви можете відкрити своє сприйняття й магічно виявляти немертвих. До кінця вашого наступного ходу ви знаєте місцеперебування будь-яких немертвих у межах 60 футів від вас, якщо вони не перебувають за повним укриттям і не захищені від магії ворожіння. Це чуття не повідомляє вам нічого про можливості чи особу істоти.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":2,"name":"Божественність: Шлях до могили","engName":"Channel Divinity: Path to the Grave","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб позначити життєву силу іншої істоти для знищення.\n\nДією ви обираєте одну істоту, яку бачите в межах 30 футів від себе, і проклинаєте її до кінця свого наступного ходу. Наступного разу, коли ви або ваш союзник влучите по проклятій істоті атакою, ця істота матиме вразливість до всієї шкоди цієї атаки, а тоді прокляття завершиться."},{"level":6,"name":"Вартовий біля смерті","engName":"Sentinel at Death's Door","description":"На 6 рівні ви здобуваєте здатність стримувати поступ смерті. Коли ви або союзник, якого ви бачите в межах 30 футів від вас, зазнає критичного удару, ви можете реакцією перетворити цей удар на звичайний. Будь-які ефекти, що спрацьовують від критичного удару, скасовуються. Ви можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":8,"name":"Потужне заклинання (Могила)","engName":"Potent Spellcasting (Grave Domain)","description":"На 8 рівні додаєте свій модифікатор Мудрості до шкоди від ваших замовлянь клірика."},{"level":17,"name":"Хранитель душ","engName":"Keeper of Souls","description":"На 17 рівні ви можете вихопити слід життєвої сили з душі, що відходить, і використати його для зцілення живих. Коли ворог, якого ви бачите, помирає в межах 30 футів від вас, ви або один союзник на ваш вибір у межах 30 футів від вас відновлює хіти, рівні кількості кісток хітів цього ворога. Ви можете використати цю рису лише якщо не є недієздатними. Скориставшись нею, ви не можете зробити це знову до початку свого наступного ходу."}]},{"name":"Домен підступності","engName":"Trickery Domain","slug":"trickery-domain","kind":"Підклас","description":"Боги підступності — пустуни й підбурювачі, що кидають постійний виклик усталеному порядку серед богів і смертних. Вони опікуються злодіями, шахраями, азартними гравцями, бунтарями й визволителями. Їхні жерці збивають пиху, глузують із тиранів, крадуть у багатих, звільняють полонених і зневажають порожні традиції, віддаючи перевагу хитрощам, витівкам і обману, а не відкритому протистоянню.","features":[{"level":1,"name":"Благословення хитруна","engName":"Blessing of the Trickster","description":"Починаючи з 1 рівня, ви можете своєю дією торкнутися добровільної істоти, що не є вами, і надати їй перевагу на перевірки Спритності (Непомітність). Це благословення триває 1 годину або доки ви знову не використаєте цю рису."},{"level":1,"name":"Заклинання домену (Хитрість)","engName":"Trickery Domain Spells","description":"1р. Причарування особи [Charm Person], Маскування [Disguise Self];\n3р. Віддзеркалення [Mirror Image], Переміщення без сліду [Pass without Trace];\n5р. Мерехтіння [Blink], Розвіювання магії [Dispel Magic];\n7р. Двері між вимірами [Dimension Door], Перевтілення [Polymorph];\n9р. Підкорення особистості [Dominate Person], Зміна спогадів [Modify Memory].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":2,"name":"Божественність: Заклик двійника","engName":"Channel Divinity: Invoke Duplicity","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб створити свою ілюзорну копію.\n\n      Дією ви створюєте досконалу ілюзію самого себе, яка триває 1 хвилину або доки ви не втратите концентрацію (ніби ви концентруєтеся на заклинанні). Ілюзія зʼявляється в незайнятому просторі, який ви бачите в межах 30 футів від себе. Бонусною дією у свій хід ви можете перемістити ілюзію на відстань до 30 футів у простір, який бачите, але вона мусить залишатися в межах 120 футів від вас.\n\n      Поки триває ефект, ви можете накладати заклинання так, ніби перебуваєте в просторі ілюзії, але при цьому повинні користуватися власними чуттями. Крім того, коли і ви, і ваша ілюзія перебуваєте в межах 5 футів від істоти, яка може бачити ілюзію, ви маєте перевагу на кидки атаки проти цієї істоти, оскільки ілюзія відволікає ціль."},{"level":6,"name":"Плащ тіней","engName":"Cloak of Shadows (Trickery Domain)","description":"Починаючи з 6 рівня, ви можете використати свій Виклик божественності, щоб зникнути.\n\nДією ви стаєте невидимими до кінця свого наступного ходу. Ви стаєте видимими, якщо атакуєте або накладаєте заклинання."},{"level":8,"name":"Божественний удар (Хитрість)","engName":"Divine Strike (Trickery)","description":"На 8 рівні раз за хід при влучанні зброєю додаєте 1к8 отруйної шкоди; з 14 рівня — 2к8."},{"level":17,"name":"Удосконалений двійник","engName":"Improved Duplicity","description":"На 17 рівні ви можете створити до чотирьох двійників себе замість одного, коли використовуєте Заклик двійника. Бонусною дією у свій хід ви можете перемістити будь-яку кількість цих двійників на відстань до 30 футів, за умови максимальної дальності 120 футів."}]},{"name":"Домен порядку","engName":"Order Domain","slug":"order-domain","kind":"Підклас","description":"Домен порядку уособлює дисципліну, відданість суспільству чи інституції й сувору покору їхнім законам. На Равніці його обирають жерці Сенату Азоріусу, що стежать за дотриманням закону, і Синдикату Оржову, що обертають закон на власну вигоду. Для жерців порядку важить, як щось зроблено, а не чи справедливий результат: закон встановлює ієрархію, і обраним ним провідникам слід коритися.","features":[{"level":1,"name":"Голос влади","engName":"Voice of Authority","description":"Починаючи з 1 рівня, ви можете закликати силу закону, щоб надихнути союзника на атаку. Якщо ви накладаєте заклинання, використовуючи осередок 1 рівня або вищий, і це заклинання цілить союзника, той союзник може відразу після заклинання використати свою реакцію, щоб зробити одну атаку зброєю по істоті на ваш вибір, яку він бачить.\n\nЯкщо заклинання цілить більш ніж одного союзника, ви обираєте, який саме союзник може зробити цю атаку."},{"level":1,"name":"Додаткові майстерності (Порядок)","engName":"Bonus Proficiencies (Order Domain)","description":"На 1 рівні ви отримуєте Володіння важкими обладунками, а також Володіння навичкою Залякування або Переконання на свій вибір."},{"level":1,"name":"Заклинання домену (Порядок)","engName":"Order Domain Spells","description":"1р. Наказ [Command], Героїзм [Heroism];\n3р. Стримування особи [Hold Person], Зона правди [Zone of Truth];\n5р. Масове цілюще слово [Mass Healing Word], Уповільнення [Slow];\n7р. Примушування [Compulsion], Знайти істоту [Locate Creature];\n9р. Спілкування [Commune], Підкорення особистості [Dominate Person].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":2,"name":"Божественність: Наказ порядку","engName":"Channel Divinity: Order’s Demand","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб справляти на інших грізне враження.\n\nДією ви демонструєте свій священний символ, і кожна істота на ваш вибір, що може вас бачити або чути в межах 30 футів від вас, мусить успішно пройти ряткидок Мудрості, інакше буде зачарована вами до кінця вашого наступного ходу або доки зачарована істота не зазнає будь-якої шкоди. Ви також можете змусити будь-яку з зачарованих істот упустити те, що вона тримає, коли вона провалює ряткидок."},{"level":6,"name":"Втілення закону","engName":"Embodiment of Law","description":"На 6 рівні ви стаєте надзвичайно вправними у спрямуванні магічної енергії, щоб примушувати інших. Якщо ви накладаєте заклинання школи Причарування, використовуючи осередок 1 рівня або вищий, ви можете для цього накладання змінити час накладання заклинання на 1 бонусну дію, за умови, що звичайний час накладання заклинання — 1 дія.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз), і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":8,"name":"Божественний удар (Порядок)","engName":"Divine Strike (Order)","description":"На 8 рівні раз за хід при влучанні зброєю додаєте 1к8 психічної шкоди; з 14 рівня — 2к8."},{"level":17,"name":"Кара порядку","engName":"Order’s Wrath","description":"Починаючи з 17 рівня, вороги, яких ви прирікаєте на знищення, вʼянуть під спільними зусиллями вас і ваших союзників. Якщо ви у свій хід завдаєте істоті шкоди від свого Божественного удару, ви можете проклясти цю істоту до початку свого наступного ходу. Наступного разу, коли один із ваших союзників влучить по проклятій істоті атакою, ціль також отримає 2к8 психічної шкоди, і прокляття завершиться. Ви можете проклясти істоту таким чином лише один раз за хід."}]},{"name":"Домен природи","engName":"Nature Domain","slug":"nature-domain","kind":"Підклас","description":"Боги природи різноманітні, як сам світ, — від незбагненних богів глибоких лісів до привітних божеств окремих джерел і гаїв. Їм служать не лише друїди, а й жерці — поборники, що діяльніше обстоюють інтереси свого бога: полюють на чудовиськ, які спустошують ліси, благословляють урожай вірних або нищать посіви тих, хто прогнівив їхніх богів.","features":[{"level":1,"name":"Додаткові майстерності (Природа)","engName":"Bonus Proficiency (Nature Domain)","description":"На 1 рівні ви отримуєте Володіння важкими обладунками."},{"level":1,"name":"Заклинання домену (Природа)","engName":"Nature Domain Spells","description":"1р. Дружба з тваринами [Animal friendship], Розмова з тваринами [Speak with Animals];\n3р. Дубова шкіра [Barkskin], Проростання шипів [Spike Growth];\n5р. Ріст рослин [Plant Growth], Стіна вітрів [Wind Wall];\n7р. Підкорення звіра [Dominate Beast], Хапаюча лоза [Grasping Vine];\n9р. Нашестя комах [Insect Plague], Деревний шлях [Tree Stride].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту підготовлених."},{"level":1,"name":"Послідовник природи","engName":"Acolyte of Nature","description":"На 1 рівні ви вивчаєте одне замовляння на свій вибір зі списку заклинань друїда. Це замовляння вважається для вас замо
