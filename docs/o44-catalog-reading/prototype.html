\n1. Кожна істота на ваш вибір, яку ви бачите в межах 30 футів від себе, мусить успішно пройти ряткидок Статури, інакше отримає 1к12 некротичної шкоди. Ви також отримуєте 1к12 тимчасових хітів.\n2. Ви телепортуєтеся на відстань до 30 футів у незайнятий простір, який бачите. Поки ваша лють не закінчиться, ви можете знову використовувати цей ефект бонусною дією в кожному своєму ході.\n3. Невідчутний дух, схожий на фламфа або піксі на ваш вибір, зʼявляється в межах 5 футів від однієї істоти на ваш вибір, яку ви бачите в межах 30 футів від себе. Наприкінці поточного ходу дух вибухає, і кожна істота в межах 5 футів від нього мусить успішно пройти ряткидок Спритності, інакше отримає 1к6 шкоди силовим полем. Поки ваша лють не закінчиться, ви можете знову використовувати цей ефект, закликаючи іншого духа, бонусною дією в кожному своєму ході.\n4. Магія наповнює одну зброю на ваш вибір, яку ви тримаєте. Поки ваша лють не закінчиться, тип шкоди цієї зброї змінюється на силове поле, і вона отримує властивості легка й метальна з нормальною дальністю 20 футів і максимальною 60 футів. Якщо зброя залишає вашу руку, вона зʼявляється знову у вашій руці наприкінці поточного ходу.\n5. Щоразу, коли істота влучає по вас кидком атаки до завершення вашої люті, ця істота отримує 1к6 шкоди силовим полем, оскільки магія бʼє у відповідь.\n6. Поки ваша лють не закінчиться, вас оточують різнокольорові захисні вогні; ви отримуєте +1 бонус до КБ, а ваші союзники в межах 10 футів від вас отримують той самий бонус.\n7. Навколо вас тимчасово проростають квіти й лози; поки ваша лють не закінчиться, земля в межах 15 футів від вас є важкопрохідною місцевістю для ваших ворогів.\n8. З ваших грудей виривається спалах світла. Інша істота на ваш вибір, яку ви бачите в межах 30 футів від себе, мусить успішно пройти ряткидок Статури, інакше зазнає 1к6 променевої шкоди й буде Засліпленою до початку вашого наступного ходу. Поки ваша лють не закінчиться, ви можете знову використовувати цей ефект бонусною дією в кожному своєму ході."},{"level":3,"name":"Чуття магії","engName":"Magic Awareness","description":"Коли на 3 рівні ви обираєте цей шлях, ви можете дією відкрити своє сприйняття присутності зосередженої магії. До кінця вашого наступного ходу ви знаєте місцеперебування будь-якого заклинання або магічного предмета в межах 60 футів від вас, якщо воно не перебуває за повним укриттям. Коли ви відчуваєте заклинання, ви дізнаєтеся, до якої школи магії воно належить.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":6,"name":"Підсилююча магія","engName":"Bolstering Magic","description":"Починаючи з 6 рівня, ви можете спрямувати свою дику магію, щоб підсилити себе або супутника. Дією ви можете торкнутися однієї істоти (якою можете бути й ви самі) і надати їй одну з наведених переваг на свій вибір:\n\n• Протягом 10 хвилин істота може кидати к3 щоразу, коли робить кидок атаки або перевірку характеристики, і додавати випале число до кидка к20.\n• Киньте к3. Істота відновлює один витрачений осередок заклинання рівня, що дорівнює випалому числу або нижче (на вибір істоти). Після того як істота отримала цю перевагу, вона не може отримати її знову до завершення тривалого відпочинку.\n\nВи можете виконати цю дію кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":10,"name":"Нестабільний відкат","engName":"Unstable Backlash","description":"На 10 рівні, коли під час люті ви опиняєтеся в небезпеці, магія всередині вас може вдарити у відповідь; одразу після того як ви отримуєте шкоду або провалюєте ряткидок під час люті, ви можете реакцією кинути на таблиці Дикої магії й негайно створити отриманий ефект. Цей ефект замінює ваш поточний ефект Дикої магії."},{"level":14,"name":"Керований хаос","engName":"Controlled Surge","description":"На 14 рівні, коли ви кидаєте на таблицю Дикої магії, ви можете кинути кубик двічі й обрати, який із двох ефектів вивільнити. Якщо на обох кубиках випадає те саме число, ви можете проігнорувати це число й обрати будь-який ефект із таблиці."}]},{"name":"Шлях звіра","engName":"Path of the Beast","slug":"path-of-the-beast","kind":"Підклас","description":"Варвари Шляху звіра черпають Лють зі звіриної іскри, що жевріє в їхній душі. У розпалі люті цей звір виривається назовні й фізично змінює тіло варвара. Такий варвар може бути вмістилищем первісного духа або нащадком істот, що змінюють подобу.","features":[{"level":3,"name":"Форма звіра","engName":"Form of the Beast","description":"Починаючи з 3 рівня, коли ви входите в лють, ви можете перетворюватися, виявляючи звірячу силу, що живе у вас всередині. Поки лють не закінчиться, ви проявляєте одну природну зброю. Вона вважається для вас простою рукопашною зброєю, і ви додаєте свій модифікатор Сили до кидків атаки й кидків шкоди, коли атакуєте нею, як зазвичай.\n\nЩоразу, коли ви входите в лють, ви обираєте форму цієї зброї:\n\n• **Укус.** Ваш рот перетворюється на звірячу пащу або великі жвали на ваш вибір. Він завдає 1к8 колотої шкоди при влучанні. Один раз у кожному своєму ході, коли ви завдаєте шкоди істоті цим укусом, ви відновлюєте кількість хітів, що дорівнює вашому Бонусу Майстерності, за умови, що на момент влучання у вас менше половини хітів.\n• **Пазурі.** Кожна ваша рука перетворюється на пазур, який ви можете використовувати як зброю, якщо вона порожня. Він завдає 1к6 рубальної шкоди при влучанні. Один раз у кожному своєму ході, коли ви атакуєте пазуром у межах Дії Атака, ви можете зробити ще одну атаку пазуром як частину тієї самої дії.\n• **Хвіст.** У вас виростає хльосткий колючий хвіст, який завдає 1к8 колотої шкоди при влучанні й має властивість досяжності. Якщо істота, яку ви бачите в межах 10 футів від вас, влучає по вас кидком атаки, ви можете реакцією хлиснути хвостом і кинути 1к8, застосувавши бонус до свого КБ проти цієї атаки, що дорівнює випалому числу; це потенційно може змусити атаку промахнутися."},{"level":6,"name":"Звіряча душа","engName":"Bestial Soul","description":"Починаючи з 6 рівня, дика сила всередині вас зростає, через що природна зброя з вашої Форми звіра вважається магічною для подолання опору та імунітету до немагічних атак і шкоди.\n\nВи також можете змінювати свою форму, щоб краще пристосовуватися до оточення. Коли ви завершуєте короткий або тривалий відпочинок, оберіть одну з наведених переваг, яка триває до завершення вами короткого або тривалого відпочинку:\n\n• Ви отримуєте швидкість плавання, рівну вашій швидкості ходи, і можете дихати під водою.\n• Ви отримуєте швидкість лазіння, рівну вашій швидкості ходи, і можете лазити складними поверхнями, зокрема догори дриґом по стелі, не роблячи перевірок характеристики.\n• Коли ви стрибаєте, ви можете зробити перевірку Сили (Атлетика) і збільшити дальність свого стрибка на кількість футів, що дорівнює загальному результату перевірки. Ви можете зробити цю особливу перевірку лише один раз за хід."},{"level":10,"name":"Заразна лють","engName":"Infectious Fury","description":"На 10 рівні, коли ви, перебуваючи в люті, влучаєте по істоті своєю природною зброєю, звір усередині вас може проклясти вашу ціль шаленим сказом. Ціль мусить успішно пройти ряткидок Мудрості (КС дорівнює 8 + ваш модифікатор Статури + ваш Бонус Майстерності), інакше зазнає одного з наведених ефектів на ваш вибір:\n\n• Ціль мусить використати свою реакцію, щоб зробити рукопашну атаку проти іншої істоти на ваш вибір, яку ви бачите.\n• Ціль отримує 2к12 психічної шкоди.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":14,"name":"Поклик полювання","engName":"Call the Hunt","description":"На 14 рівні звір усередині вас стає настільки могутнім, що ви можете поширювати його лють на інших і черпати стійкість із їхньої участі в полюванні. Коли ви входите в лють, ви можете обрати кількість інших добровільних істот, яких бачите в межах 30 футів від себе, що дорівнює вашому модифікатору Статури (мінімум одна істота). Ви отримуєте 5 тимчасових хітів за кожну істоту, яка приймає цю рису. До кінця люті обрані істоти можуть скористатися такою перевагою один раз у кожному своєму ході: коли істота влучає по цілі кидком атаки й завдає їй шкоди, вона може кинути 1к6 і отримати бонус до шкоди, що дорівнює випалому числу.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."}]},{"name":"Шлях предків-охоронців","engName":"Path of the Ancestral Guardian","slug":"path-of-the-ancestral-guardian","kind":"Підклас","description":"Деякі варвари походять із племен, що шанують предків і вчать, що воїни минулого лишаються у світі могутніми духами, здатними вести й захищати живих. У Люті варвар цього шляху звертається до світу духів і кличе духів-охоронців на допомогу, а тіло вкриває татуюваннями, що оспівують звитяги предків.","features":[{"level":3,"name":"Духи-предки","engName":"Ancestral Protectors","description":"Починаючи з 3 рівня, коли ви впадаєте в лють, перший раз кожного свого ходу, коли ви влучаєте атакою, духи-предки оберігають вас. До кінця вашого наступного ходу ця ціль має перешкоду на кидки атаки проти будь-кого, крім вас, а коли ціль завдає шкоди кому-небудь, крім вас, ця шкода зменшується удвічі (округлення донизу). Ефект діє, лише поки ви лютуєте."},{"level":6,"name":"Щит духів","engName":"Spirit Shield","description":"Починаючи з 6 рівня, поки ви у люті й бачите істоту в межах 30 футів, ви можете реакцією зменшити шкоду, яку вона отримує, на 2к6. Це робить група ваших духовних предків. На 10 рівні кидок зростає до 3к6, на 14 — до 4к6. Працює лише під час люті."},{"level":10,"name":"Порада духів","engName":"Consult the Spirits","description":"На 10 рівні ви здобуваєте здатність радитися зі своїми духами-предками. Коли ви робите це, ви накладаєте Пророкування [Augury] або Підглядання [Clairvoyance], не використовуючи осередок заклинання й не потребуючи матеріальних компонентів. Замість створення сферичного сенсора це використання Підглядання [Clairvoyance] невидимо закликає одного з ваших духів-предків у вибране місце. Мудрість є вашою базовою характеристикою чаротворства для цих заклять.\n\nПісля того як ви накладаєте будь-яке з цих заклять таким способом, ви не можете скористатися цією рисою знову, доки не завершите короткий або тривалий відпочинок."},{"level":14,"name":"Месники-пращури","engName":"Vengeful Ancestors","description":"На 14 рівні ваші духи-предки карають ворогів. Коли ваша риса Щит духів зменшує шкоду істоті, ця істота отримує таку саму кількість силової шкоди."}]},{"name":"Шлях тотемного воїна","engName":"Path of the Totem Warrior","slug":"path-of-the-totem-warrior","kind":"Підклас","description":"Шлях тотемного воїна — духовна мандрівка: варвар приймає духа-тварину як провідника, захисника й натхнення. У бою тотемний дух сповнює його надприродною міццю й підживлює Лють магією. Здебільшого племʼя вважає тотемну тварину спорідненою з певним кланом, тож мати більше одного тотема — рідкість.","features":[{"level":3,"name":"Дух тотема","engName":"Totem Spirit","description":"На 3 рівні, коли ви приймаєте цей шлях, ви обираєте духа-тотема й здобуваєте його рису. Ви мусите створити або здобути фізичний тотемний предмет — амулет чи подібну прикрасу — що містить хутро або пірʼя, кігті, ікла чи кістки тотемної тварини. За бажанням ви також можете отримати незначні фізичні риси, подібні до вашого духа-тотема. Наприклад, якщо вашим духом-тотемом є ведмідь, ви можете стати незвично волохатими й кремезними, а якщо тотем — орел, ваші очі можуть стати яскраво-жовтими.\n\nВашою тотемною твариною може бути споріднена істота зі списком, яка краще пасує до вашої батьківщини. Наприклад, ви можете обрати яструба або грифа замість орла. Конкретні переваги дивіться в опціях нижче."},{"level":3,"name":"Шукач духів","engName":"Spirit Seeker","description":"На 3 рівні ви здобуваєте звʼязок із духами звірів: можете накладати Тваринне чуття [Beast Sense] та Розмова з тваринами [Speak with Animals] без витрат осередків, але лише як ритуали."},{"level":6,"name":"Аспект звіра","engName":"Aspect of the Beast","description":"На 6 рівні ви отримуєте магічний аспект звіра за вибором (може збігатися або відрізнятися від тотема 3 рівня), що дає постійну перевагу чи вміння. Див. опції для ефектів."},{"level":10,"name":"Мандрівник духів","engName":"Spirit Walker","description":"На 10 рівні ви можете накласти Звернення до природи [Commune with Nature] як ритуал. Вас навідує духовна форма вашого тотема й надає відомості."},{"level":14,"name":"Настроювання на тотем","engName":"Totemic Attunement","description":"На 14 рівні ви отримуєте ще один тотемний дар (можна обрати будь-який із списку тотемів), що працює під час люті. Див. опції для деталей."}]},{"name":"Шлях фанатика","engName":"Path of the Zealot","slug":"path-of-the-zealot","kind":"Підклас","description":"Деякі божества надихають своїх послідовників кидатися в несамовите бойове шаленство. Такі варвари — фанатики, воїни, що спрямовують Лють у могутні прояви божественної сили. Здебільшого їх надихають боги битви, руйнування й насильства: не всі вони злі, але добрих серед них мало.","features":[{"level":3,"name":"Божественна лють","engName":"Divine Fury","description":"Коли на 3 рівні ви обираєте цей шлях, ви можете спрямовувати божественну лють у свої удари зброєю. Поки ви перебуваєте в люті, перша істота, по якій ви влучаєте в кожному своєму ході атакою зброєю, отримує додаткову шкоду, що дорівнює 1к6 + половина вашого рівня варвара. Ця додаткова шкода є некротичною або променевою; ви обираєте тип шкоди, коли здобуваєте цю рису."},{"level":3,"name":"Воїн богів","engName":"Warrior of the Gods","description":"На 3 рівні вашу душу позначено для нескінченної битви. Якщо заклинання, як-от Оживлення мерців [Raise Dead], має єдиним ефектом повернення вас до життя (але не до стану нежиті), заклиначу не потрібні матеріальні компоненти, щоб накласти це заклинання на вас."},{"level":6,"name":"Фанатична стійкість","engName":"Fanatical Focus","description":"На 6 рівні, поки ви у люті, коли ви провалюєте ряткидок, можете повторити його й використати новий результат. Скористатися можна раз за кожну лють."},{"level":10,"name":"Запал присутності","engName":"Zealous Presence","description":"На 10 рівні ви вчитеся спрямовувати божественну силу, щоб запалювати ревність в інших. Бонусною дією ви вивільняєте бойовий клич, наповнений божественною енергією. До десяти інших істот на ваш вибір у межах 60 футів від вас, які можуть вас чути, отримують перевагу на кидки атаки й ряткидки до початку вашого наступного ходу.\n\nПісля використання цієї риси ви не можете використати її знову, доки не завершите тривалий відпочинок."},{"level":14,"name":"Лють по той бік смерті","engName":"Rage Beyond Death","description":"На 14 рівні, поки ви у люті, перебування на 0 хітів не робить вас Непритомним. Ви все одно мусите робити ряткидки від смерті й зазнаєте звичайних наслідків отримання шкоди при 0 хітах. Проте якщо ви мали б померти через провалені ряткидки від смерті, ви не помираєте, доки ваша лють не закінчиться, і тоді помираєте лише якщо все ще маєте 0 хітів."}]}]},{"edition":"2024","name":"Бард","engName":"Bard","slug":"bard","description":"Творячи магію музикою, танцем і віршем, барди вміють надихати інших, втамовувати біль, знеохочувати ворогів і створювати ілюзії. Барди вірять, що мультивсесвіт було створено словом і що відлуння його Слів Творіння досі звучать і мерехтять на кожному плані існування. Магія бардів прагне опанувати ці слова, що стоять понад будь-якою мовою.\n\nБудь-що може надихнути на нову пісню чи оповідь, тож бардів захоплює майже все. Вони стають майстрами багатьох справ — від музики й творення магії до дотепних жартів. Життя барда минає в мандрах, збиранні переказів, оповіданні історій і на вдячності слухачів, як і в будь-якого іншого митця. Але глибина знань і володіння магією вирізняють бардів з-поміж інших.","facts":["Кістка хітів: к8","Підклас з 3 рівня","6 підкласів"],"features":[{"level":1,"name":"Бардське натхнення","engName":"Bard: Bardic Inspiration (2024)","description":"Ви можете надприродним чином надихати інших словом, музикою чи танцем. Це натхнення уособлює ваш кубик Бардського натхнення — к6.\n\n**Використання Бардського натхнення.** Бонусною дією ви можете надихнути інше створіння в межах 60 футів від себе, яке бачить або чує вас. Це створіння отримує один ваш кубик Бардського натхнення. Створіння може мати лише один кубик Бардського натхнення одночасно.\n\nОдин раз протягом наступної години, коли створіння провалює Перевірку к20, воно може кинути кубик Бардського натхнення й додати випале число до к20, потенційно обернувши провал на успіх. Кубик Бардського натхнення витрачається, коли його кидають.\n\n**Кількість використань.** Ви можете надати кубик Бардського натхнення стільки разів, скільки дорівнює вашому модифікатору Харизми (мінімум один раз), і ви відновлюєте всі витрачені використання, коли завершуєте довгий відпочинок.\n\n**На вищих рівнях.** Ваш кубик Бардського натхнення змінюється, коли ви досягаєте певних рівнів барда, як показано в колонці «Кубик барда» таблиці фіч Барда. Кубик стає к8 на 5 рівні, к10 на 10 рівні та к12 на 15 рівні."},{"level":1,"name":"Чаклування","engName":"Bard: Spellcasting (2024)","description":"Ви навчилися накладати заклинання за допомогою свого бардівського мистецтва. Правила чаклування описані в розділі 7. Нижче йдеться про те, як ви застосовуєте ці правила до заклинань барда, перелічених у списку заклинань барда далі в описі класу.\n\n**Замовляння.** Ви знаєте два замовляння на ваш вибір зі списку заклинань барда. Рекомендуються Мерехтливі вогники [Dancing Lights] та Злісне глузування [Vicious Mockery].\n\nЩоразу, коли ви отримуєте рівень барда, ви можете замінити одне зі своїх замовлянь іншим замовлянням на ваш вибір зі списку заклинань барда.\n\nКоли ви досягаєте 4 і 10 рівнів барда, ви вивчаєте ще одне замовляння на ваш вибір зі списку заклинань барда, як показано в колонці «Замовляння» таблиці фіч Барда.\n\n**Слоти заклинань.** Таблиця фіч Барда показує, скільки слотів заклинань ви маєте для накладання заклинань 1 рівня й вище. Ви відновлюєте всі витрачені слоти, коли завершуєте довгий відпочинок.\n\n**Підготовлені заклинання 1 рівня й вище.** Ви готуєте список заклинань 1 рівня й вище, доступних вам для накладання цією фічею. Для початку виберіть чотири заклинання 1 рівня зі списку заклинань барда. Рекомендуються Причарування особи [Charm Person], Кольорові бризки [Color Spray], Дисонуючий шепіт [Dissonant Whispers] та Цілюще слово [healing word].\n\nКількість заклинань у вашому списку зростає з рівнями барда, як показано в колонці «Підготовлені заклинання» таблиці фіч Барда. Щоразу, коли ця кількість зростає, виберіть додаткові заклинання зі списку заклинань барда, доки кількість заклинань у вашому списку не зрівняється з числом у таблиці. Обрані заклинання мають бути того рівня, для якого ви маєте слоти. Наприклад, якщо ви бард 3 рівня, ваш список підготовлених заклинань може містити шість заклинань 1 і 2 рівнів у будь-якому поєднанні.\n\nЯкщо інша фіча барда дає вам заклинання, які ви завжди маєте підготовленими, вони не враховуються в кількість заклинань, яку ви можете підготувати цією фічею, але в усьому іншому вважаються для вас заклинаннями барда.\n\n**Зміна підготовлених заклинань.** Щоразу, коли ви отримуєте рівень барда, ви можете замінити одне заклинання у своєму списку іншим заклинанням барда, для якого маєте слоти.\n\n**Характеристика чаклування.** Харизма є вашою характеристикою чаклування для заклинань барда.\n\n**Чаротворчий фокус.** Ви можете використовувати Музичний інструмент як чаротворчий фокус для заклинань барда."},{"level":2,"name":"Експертиза","engName":"Bard: Expertise (2024)","description":"Ви отримуєте Експертизу (див. глосарій правил) у двох навичках, якими володієте, на ваш вибір. Рекомендуються Виступ і Переконання, якщо ви ними володієте.\n\nНа 9 рівні барда ви отримуєте Експертизу ще у двох навичках, якими володієте, на ваш вибір."},{"level":2,"name":"Майстер на всі руки","engName":"Bard: Jack of all Trades (2024)","description":"Ви можете додавати половину свого Бонусу Майстерності (округлено вниз) до будь-якої перевірки характеристики, яку робите з навичкою, якою не володієте, і яка в інший спосіб не використовує ваш Бонус Майстерності.\n\nНаприклад, якщо ви робите перевірку Сили (Атлетика) і не володієте Атлетикою, ви можете додати до перевірки половину свого Бонусу Майстерності."},{"level":3,"name":"Підклас Барда","engName":"Bard: Bard Subclass (2024)","description":"Ви отримуєте підклас Барда на ваш вибір. Підкласи Колегія Танцю, Колегія гламуру, Колегія знань і Колегія доблесті описані після опису цього класу. Підклас — це спеціалізація, яка дає вам фічі на певних рівнях барда. До кінця вашої карʼєри ви отримуєте кожну фічу свого підкласу, рівень якої не перевищує вашого рівня барда."},{"level":4,"name":"Покращення Характеристик","engName":"Bard: Ability Score Improvement (2024)","description":"Ви отримуєте рису Покращення Характеристик або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Ви отримуєте цю фічу знову на 8, 12 і 16 рівнях барда."},{"level":5,"name":"Джерело натхнення","engName":"Bard: Font of Inspiration (2024)","description":"Тепер ви відновлюєте всі витрачені використання Бардського натхнення, коли завершуєте короткий або довгий відпочинок.\n\nКрім того, ви можете витратити слот заклинань (дія не потрібна), щоб відновити одне витрачене використання Бардського натхнення."},{"level":7,"name":"Контрчари","engName":"Bard: Countercharm (2024)","description":"Ви можете використовувати музичні ноти або слова сили, щоб порушувати ефекти, які впливають на розум. Якщо ви або створіння в межах 30 футів від вас провалює ряткидок проти ефекту, що накладає стан Причарований або Наляканий, ви можете реакцією змусити перекинути цей ряткидок, і новий кидок робиться з Перевагою."},{"level":9,"name":"Експертиза","engName":"Bard: Expertise L9 (2024)","description":"Ви отримуєте Експертизу (див. глосарій правил) у двох навичках, якими володієте, на ваш вибір. Рекомендуються Виступ і Переконання, якщо ви ними володієте.\n\nНа 9 рівні барда ви отримуєте Експертизу ще у двох навичках, якими володієте, на ваш вибір."},{"level":10,"name":"Магічні таємниці","engName":"Bard: Magical Secrets (2024)","description":"Ви пізнали таємниці різних магічних традицій. Щоразу, коли ви досягаєте рівня барда (включно з цим рівнем) і число в колонці «Підготовлені заклинання» таблиці фіч Барда зростає, ви можете обирати будь-які нові підготовлені заклинання зі списків заклинань барда, клірика, друїда й чарівника, і обрані заклинання вважаються для вас заклинаннями барда (список заклинань класу шукайте в його розділі). Крім того, щоразу, коли ви замінюєте заклинання, підготовлене для цього класу, ви можете замінити його заклинанням із цих списків."},{"level":18,"name":"Вище натхнення","engName":"Bard: Superior Inspiration (2024)","description":"Коли ви кидаєте Ініціативу, ви відновлюєте витрачені використання Бардського натхнення, доки не матимете два, якщо маєте менше."},{"level":19,"name":"Епічний Дар","engName":"Bard: Epic Boon (2024)","description":"Ви отримуєте рису Епічного Дару або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Рекомендується Дар Пригадування Заклинань."},{"level":20,"name":"Слова Творіння","engName":"Bard: Words of Creation (2024)","description":"Ви опанували два зі Слів Творіння: слова життя і смерті. Тому ви завжди маєте підготовленими заклинання Слово сили: Зцілення [Power Word Heal] і Слово сили: Смерть [Power Word Kill]. Коли ви накладаєте будь-яке з них, ви можете обрати ним другу ціль, якщо це створіння перебуває в межах 10 футів від першої цілі."}],"children":[{"name":"Колегія гламуру","engName":"College of Glamour","slug":"college-of-glamour","kind":"Підклас","description":"Колегія гламуру веде свій родовід від чарівливої магії Фейвайлду. Барди, що вивчають цю магію, вплітають нитки краси й жаху у свої пісні та історії, а наймогутніші серед них здатні огортати себе потойбічною величчю. Їхні виступи пробуджують тужливу тугу за забутою невинністю, викликають підсвідомі спогади про давні страхи й зачіпають почуття навіть найчерствіших слухачів.","features":[{"level":3,"name":"Мантія натхнення","engName":"College of Glamour: Mantle of Inspiration (2024)","description":"Ви можете вплести магію фей у пісню чи танець, щоб наповнити інших снагою. Бонусною дією ви можете витратити використання Бардського натхнення, кинувши кубик Бардського натхнення. Зробивши так, оберіть кількість інших істот у межах 60 футів від себе, до числа, що дорівнює вашому модифікатору Харизми (мінімум одна істота). Кожна з цих істот отримує тимчасові ХП у кількості, що вдвічі перевищує число, яке випало на кубику Бардського натхнення, а тоді кожна може використати свою реакцію, щоб пересунутися на відстань до своєї Швидкості, не провокуючи Принагідних атак."},{"level":3,"name":"Чарівлива магія","engName":"College of Glamour: Beguiling Magic (2024)","description":"Ви завжди маєте підготовані заклинання Причарування особи [Charm Person] та Віддзеркалення [Mirror Image].\n\nКрім того, одразу після того як ви накладете заклинання школи Причарування або Ілюзії, використовуючи слот заклинань, ви можете змусити істоту, яку бачите в межах 60 футів від себе, зробити ряткидок Мудрості проти вашої СК заклинань. У разі провалу ціль отримує стан Причарований або Наляканий (на ваш вибір) на 1 хвилину. Ціль повторює ряткидок наприкінці кожного свого ходу, припиняючи ефект на собі в разі успіху.\n\nСкориставшись цією перевагою, ви не можете використати її знову, доки не завершите довгий відпочинок. Ви також можете відновити це використання, витративши одне використання Бардського натхнення (дія не потрібна)."},{"level":6,"name":"Мантія величі","engName":"College of Glamour: Mantle of Majesty (2024)","description":"Ви завжди маєте підготоване заклинання Наказ [Command].\n\nБонусною дією ви накладаєте Наказ [Command], не витрачаючи слот заклинань, і набуваєте потойбічного вигляду на 1 хвилину або доки не припиниться ваша Концентрація. Протягом цього часу ви можете накладати Наказ [Command] бонусною дією, не витрачаючи слот заклинань.\n\nБудь-яка істота, причарована вами, автоматично провалює ряткидок проти заклинання Наказ [Command], накладеного цією фічею.\n\nСкориставшись цією фічею, ви не можете використати її знову, доки не завершите довгий відпочинок. Ви також можете відновити це використання, витративши слот заклинань 3 рівня чи вище (дія не потрібна)."},{"level":14,"name":"Незламна велич","engName":"College of Glamour: Unbreakable Majesty (2024)","description":"Бонусною дією ви можете набути магічно величної присутності на 1 хвилину або доки не отримаєте стан Недієздатний. Протягом цього часу щоразу, коли будь-яка істота вперше за хід влучає у вас кидком атаки, атакувальник мусить успішно пройти ряткидок Харизми проти вашої СК заклинань, інакше атака натомість не влучає, оскільки істота відсахується від вашої величі.\n\nНабувши цієї величної присутності, ви не можете зробити це знову, доки не завершите короткий або довгий відпочинок."}]},{"name":"Колегія доблесті","engName":"College of Valor","slug":"college-of-valor","kind":"Підклас","description":"Барди Колегії доблесті — відважні оповідачі, чиї перекази зберігають памʼять про великих героїв минулого. Ці Барди оспівують діяння могутніх у склепінчастих залах або перед натовпами, що зібралися довкола великих вогнищ. Вони мандрують, щоб на власні очі побачити великі події та подбати, щоб памʼять про них не згасла. Своїми піснями вони надихають нові покоління сягнути тих самих вершин звершень, що й герої минувшини.","features":[{"level":3,"name":"Бойове натхнення","engName":"College of Valor: Combat Inspiration (2024)","description":"Ви можете використовувати свою дотепність, щоб переломити хід битви. Істота, яка має від вас кубик Бардського натхнення, може використати його для одного з наведених нижче ефектів.\n\n**Захист.** Коли в істоту влучає кидок атаки, вона може використати свою реакцію, щоб кинути кубик Бардського натхнення й додати випавше число до свого КБ проти цієї атаки, можливо змусивши атаку промахнутися.\n\n**Напад.** Одразу після того як істота влучає по цілі кидком атаки, вона може кинути кубик Бардського натхнення й додати випавше число до шкоди атаки проти цієї цілі."},{"level":3,"name":"Військова підготовка","engName":"College of Valor: Martial Training (2024)","description":"Ви отримуєте Володіння військовою зброєю та підготовку до середніх обладунків і щитів.\n\nКрім того, ви можете використовувати просту або військову зброю як магічне фокусування для накладання заклинань зі списку заклинань Барда."},{"level":6,"name":"Додаткова атака","engName":"College of Valor: Extra Attack (2024)","description":"Ви можете атакувати двічі замість одного разу щоразу, коли виконуєте дію Атака на своєму ході.\n\nКрім того, ви можете накласти одне зі своїх замовлянь із часом накладання дія замість однієї з цих атак."},{"level":14,"name":"Бойова магія","engName":"College of Valor: Battle Magic (2024)","description":"Після того як ви накладете заклинання з часом накладання дія, ви можете зробити одну атаку зброєю бонусною дією."}]},{"name":"Колегія духів","engName":"College of Spirits","slug":"college-of-spirits","kind":"Підклас","description":"Барди Колегії духів прикликають легендарних духів, щоб змінювати світ. Але такі сутності примхливі, і те, що бард закликає, не завжди цілком підвладне йому.","features":[{"level":3,"name":"Духи з потойбіччя","engName":"College of Spirits: Spirits from Beyond (2024)","description":"Ви можете закликати духів померлих, щоб посилювати себе й союзників. Коли бонусною дією даєте істоті кубик Бардського натхнення, можете закликати силу випадкового духа: киньте кубик і звіртеся з таблицею. Дух залишається спрямованим, доки ви не вивільните його або не завершите короткий чи довгий відпочинок.\n\n**Кероване спрямування.** Бонусною дією ви можете витратити використання Бардського натхнення й обрати духа з таблиці замість кидка. Його номер не може перевищувати найбільше число на вашому кубику Бардського натхнення.\n\n**Вивільнення духа.** Дією Магія ви можете вивільнити одного спрямованого духа й обрати ціллю видиму істоту в межах 30 футів. Якщо ефект вимагає ряткидка, його КС дорівнює КС ваших заклинань барда.\n\n| Кубик натхнення | Дух |\n| --- | --- |\n| 1 | **Коханий.** Ціль відновлює хіти в кількості результат кубика Бардського натхнення + модифікатор Харизми. |\n| 2 | **Влучний стрілець.** Ціль отримує силову шкоду в кількості результат кубика + модифікатор Харизми. |\n| 3 | **Месник.** До кінця вашого наступного ходу істота, яка влучає в ціль рукопашною атакою, отримує силову шкоду, рівну результату кубика. |\n| 4 | **Відступник.** Ціль може негайно реакцією телепортуватися на відстань до 30 футів у видимий вільний простір. |\n| 5 | **Ворожбит.** Ціль має перевагу на тести к20 до початку вашого наступного ходу. |\n| 6 | **Мандрівник.** Ціль отримує тимчасові хіти в кількості результат кубика + ваш рівень барда; поки вони є, її Швидкість збільшена на 10 футів. |\n| 7 | **Трикстер.** Ціль робить ряткидок Мудрості. У разі провалу отримує психічну шкоду, рівну двом кидкам кубика, і Причарована до початку вашого наступного ходу; у разі успіху отримує лише половину шкоди. |\n| 8 | **Тінь.** Ціль Невидима до кінця свого наступного ходу або доки не зробить кидок атаки, не завдасть шкоди чи не застосує заклинання. Коли невидимість завершується, кожна істота в межах 5-футової еманації робить ряткидок Статури й у разі провалу отримує некротичну шкоду, рівну двом кидкам кубика. |\n| 9 | **Палій.** Ціль робить ряткидок Спритності, отримуючи вогняну шкоду, рівну чотирьом кидкам кубика, у разі провалу або половину в разі успіху. |\n| 10 | **Боягуз.** Ціль і кожна обрана вами істота в межах 30-футової еманації від неї роблять ряткидок Мудрості, а в разі провалу Налякані до початку вашого наступного ходу. Швидкість Наляканої істоти зменшена вдвічі, й вона може виконати дію або бонусну дію, але не обидві. |\n| 11 | **Громило.** Кожна обрана вами істота в межах 30-футової еманації від цілі робить ряткидок Сили. У разі провалу отримує громову шкоду, рівну трьом кидкам кубика, і Збита з ніг; у разі успіху отримує лише половину шкоди. |\n| 12 | **Жрець.** Ціль відновлює хіти в кількості двох кидків кубика, і на ній завершується один обраний стан: Засліплений, Причарований, Оглухлий, Паралізований, Отруєний або Приголомшений. |"},{"level":3,"name":"Провідник","engName":"College of Spirits: Channeler (2024)","description":"Ви навчаєтеся звʼязуватися з духами за могилою й пропускати крізь себе їхні силу та знання.\n\n**Спрямовувальний шепіт.** Ви знаєте замовляння Настанова; коли ви його застосовуєте, дальність становить 60 футів.\n\n**Духовне фокусування.** Ви отримуєте гральний набір карт і володіння ним. Ви можете використовувати його або один із таких предметів як Заклинальне фокусування для заклинань барда: Арканне фокусування (кристал або сфера), свічка чи чорнильне перо."},{"level":6,"name":"Посилене спрямування","engName":"College of Spirits: Empowered Channeling (2024)","description":"Ваша здатність спрямовувати духів покращується.\n\n**Сила з потойбіччя.** Раз за хід, коли ви витрачаєте слот на заклинання барда, яке завдає шкоди або відновлює хіти, киньте 1к6. Додайте результат до одного кидка шкоди заклинання або до загальної кількості відновлених ним хітів.\n\n**Прояв духів.** Духи захисники завжди підготовлені у вас. Ви можете один раз застосувати заклинання без слота й відновлюєте цю здатність після довгого відпочинку. Під час застосування можете змінити його так, щоб духи захищали й від мирських загроз: ви й союзники в еманації заклинання маєте половинне укриття. Після такої зміни здатність відновлюється після короткого або довгого відпочинку."},{"level":14,"name":"Містичний звʼязок","engName":"College of Spirits: Mystical Connection (2024)","description":"Ви опановуєте закликаних духів. Щоразу, коли кидаєте за таблицею Духів із потойбіччя, можете кинути кубик двічі й обрати один із двох ефектів. Якщо обидва результати однакові, натомість можете обрати будь-який ефект таблиці."}]},{"name":"Колегія знань","engName":"College of Lore","slug":"college-of-lore","kind":"Підклас","description":"Барди Колегії знань збирають заклинання й таємниці з різноманітних джерел — учених фоліантів, містичних обрядів і селянських переказів. Члени колегії збираються в бібліотеках та університетах, щоб ділитися знаннями один з одним. Вони також зʼявляються на святах чи державних заходах, де можуть викривати корупцію, розплутувати брехню й висміювати надто пихатих можновладців.","features":[{"level":3,"name":"Додаткові володіння","engName":"College of Lore: Bonus Proficiencies (2024)","description":"Ви отримуєте Володіння трьома навичками на ваш вибір."},{"level":3,"name":"Ріжучі слова","engName":"College of Lore: Cutting Words (2024)","description":"Ви навчаєтеся використовувати свою дотепність, щоб надприродним чином відволікати, збивати з пантелику й іншим чином підривати впевненість і вправність інших. Коли істота, яку ви бачите в межах 60 футів від себе, робить кидок ушкоджень або досягає успіху в перевірці характеристики чи кидку атаки, ви можете вжити реакцію та витратити одне використання Бардського натхнення; киньте кубик Бардського натхнення й відніміть випавше число від кидка істоти, зменшуючи шкоду або, можливо, перетворюючи успіх на провал."},{"level":6,"name":"Магічні відкриття","engName":"College of Lore: Magical Discoveries (2024)","description":"Ви вивчаєте два заклинання на ваш вибір. Ці заклинання можуть походити зі списку заклинань Клірика, Друїда чи Чарівника, або з будь-якого їх поєднання (список заклинань кожного класу наведено в розділі цього класу). Обране заклинання має бути замовлянням або заклинанням, для якого ви маєте слоти заклинань, як показано в таблиці Фіч Барда.\n\nВи завжди маєте обрані заклинання підготованими, і щоразу, коли ви отримуєте рівень Барда, ви можете замінити одне із заклинань на інше, що відповідає цим вимогам."},{"level":14,"name":"Незрівнянна майстерність","engName":"College of Lore: Peerless Skill (2024)","description":"Коли ви робите перевірку характеристики або кидок атаки і зазнаєте невдачі, ви можете витратити одне використання Бардського натхнення; киньте кубик Бардського натхнення й додайте випавше число до к20, можливо перетворюючи провал на успіх. Якщо результат все одно є провалом, Бардське натхнення не витрачається."}]},{"name":"Колегія Місяця","engName":"College of the Moon","slug":"college-of-the-moon","kind":"Підклас","description":"Колегія Місяця веде свій початок від прадавніх друїдичних кіл Місячних Островів, які довірили першим бардам цієї традиції літописати історії островів та їхніх мешканців. Барди цієї колегії черпають із феєричної магії островів і первісної сили місячних криниць, щоб підтримувати союзників, боронити природний світ і надихати свої бардівські твори.","features":[{"level":3,"name":"Місячне натхнення","engName":"College of the Moon: Moon's Inspiration (2024)","description":"Первісна й мінлива сила Місяця тече крізь вас і дає такі переваги.\n\n**Натхненне затемнення.** Коли ви бонусною дією даєте істоті кубик Бардського натхнення, ви можете набути стану Невидимий і як частину цієї бонусної дії телепортуватися на відстань до 30 футів у видимий вільний простір. Невидимість триває до початку вашого наступного ходу й завершується одразу після того, як ви робите кидок атаки, завдаєте шкоди або застосовуєте заклинання.\n\n**Місячна життєва сила.** Один раз за хід, коли ви відновлюєте істоті хіти заклинанням, ви можете витратити кубик Бардського натхнення й збільшити кількість відновлених хітів на результат кидка цього кубика. Швидкість істоти також збільшується на 10 футів до кінця її наступного ходу."},{"level":3,"name":"Первісні знання","engName":"College of the Moon: Primal Lore (2024)","description":"Ви вивчаєте Друїдичну мову й одне замовляння зі списку заклинань друїда. Для вас воно вважається заклинанням барда, але не враховується до кількості відомих вам замовлянь. Щоразу, коли ви отримуєте рівень барда, ви можете замінити це замовляння іншим замовлянням зі списку друїда.\n\nКрім того, оберіть одну навичку: Поводження з тваринами, Проникливість, Медицина, Природа, Уважність або Виживання. Ви отримуєте володіння нею."},{"level":6,"name":"Благословення місячного сяйва","engName":"College of the Moon: Blessing of Moonlight (2024)","description":"Заклинання Місячний промінь завжди підготовлене у вас.\n\nКоли ви застосовуєте Місячний промінь, то можете змінити заклинання так, щоб слабко світитися, поки воно діє. Ви випромінюєте тьмяне світло в межах 5 футів, і щоразу, коли істота провалює ряткидок проти ефектів цього заклинання, інша обрана вами видима істота в межах 60 футів від вас відновлює 2к4 хітів.\n\nЗмінивши цим способом застосування Місячного променя, ви не можете зробити це знову, доки не завершите довгий відпочинок."},{"level":14,"name":"Велич вечірньої пори","engName":"College of the Moon: Eventide's Splendor (2024)","description":"Вас наповнює могутність Місяця, що покращує Місячне натхнення.\n\n**Тінь молодика.** Коли ви використовуєте Натхненне затемнення, істота, яка отримала кубик Бардського натхнення, також може набути стану Невидимий і негайно реакцією телепортуватися на відстань до 30 футів у видимий їй вільний простір. Вона залишається Невидимою до початку свого наступного ходу.\n\n**Сяйво повні.** Коли ви використовуєте Місячну життєву силу, можете кинути 1к6 і використати результат замість витрачання кубика Бардського натхнення."}]},{"name":"Колегія Танцю","engName":"College of Dance","slug":"college-of-dance","kind":"Підклас","description":"Барди Колегії Танцю знають, що Слова Творення неможливо вмістити лише в мову чи пісню — ці слова промовляються рухом небесних тіл і струменять крізь рухи найменших істот. Ці Барди практикують спосіб буття в гармонії з мінливим космосом, що надає перевагу спритності, швидкості та грації.","features":[{"level":3,"name":"Сліпучі кроки","engName":"College of Dance: Dazzling Footwork (2024)","description":"Поки ви не носите броню і не тримаєте Щит, ви отримуєте наведені нижче переваги.\n\n**Віртуоз танцю.** Ви маєте перевагу на будь-яку перевірку Харизми (Виступ), що передбачає танець.\n\n**Захист без броні.** Ваш базовий Клас Броні дорівнює 10 плюс модифікатори Спритності та Харизми.\n\n**Спритні удари.** Коли ви витрачаєте використання Бардського натхнення як частину дії, бонусної дії або реакції, ви можете завдати один Беззбройний удар як частину цієї дії, бонусної дії чи реакції.\n\n**Бардська шкода.** Ви можете використовувати Спритність замість Сили для кидків атаки своїх Беззбройних ударів. Завдаючи шкоди Беззбройним ударом, ви можете завдати дробильної шкоди, що дорівнює кидку вашого кубика Бардського натхнення плюс модифікатор Спритності, замість звичайної шкоди удару. Цей кидок не витрачає кубик."},{"level":6,"name":"Надихаючий рух","engName":"College of Dance: Inspiring Movement (2024)","description":"Коли ворог, якого ви бачите, завершує свій хід у межах 5 футів від вас, ви можете вжити реакцію та витратити одне використання Бардського натхнення, щоб пересунутися на відстань до половини вашої Швидкості. Тоді один союзник на ваш вибір у межах 30 футів від вас також може пересунутися на відстань до половини своєї Швидкості, використавши свою реакцію.\n\nЖоден рух від цієї фічі не провокує Принагідних атак."},{"level":6,"name":"Синхронні кроки","engName":"College of Dance: Tandem Footwork (2024)","description":"Коли ви кидаєте Ініціативу, ви можете витратити одне використання Бардського натхнення, якщо ви не маєте стан Недієздатний. Зробивши так, киньте кубик Бардського натхнення; ви та кожен союзник у межах 30 футів від вас, який бачить або чує вас, отримує бонус до Ініціативи, що дорівнює випавшому числу."},{"level":14,"name":"Провідне ухилення","engName":"College of Dance: Leading Evasion (2024)","description":"Коли на вас діє ефект, що дозволяє зробити ряткидок Спритності, аби отримати лише половину шкоди, ви натомість не отримуєте жодної шкоди в разі успішного ряткидка і лише половину шкоди в разі невдалого. Якщо будь-які істоти в межах 5 футів від вас роблять той самий ряткидок Спритності, ви можете поділитися цією перевагою з ними для цього ряткидка.\n\nВи не можете використовувати цю фічу, якщо маєте стан Недієздатний."}]}]},{"edition":"2024","name":"Клірик","engName":"Cleric","slug":"cleric","description":"Клірики черпають силу з царств богів і спрямовують її на творення чудес. Благословенний божеством, пантеоном чи іншою безсмертною сутністю, клірик може торкнутися божественної магії Зовнішніх Планів, де мешкають боги, і спрямувати її, щоб підтримувати людей і боротися з ворогами.\n\nОскільки їхня сила — божественний дар, клірики зазвичай повʼязують себе з храмами, присвяченими божеству чи іншій безсмертній силі, що відкрила їм магію. Опанування божественної магії не залежить від особливого навчання, проте клірики можуть вивчати молитви й обряди, які допомагають їм черпати силу із Зовнішніх Планів.\n\nНе кожен служитель храму чи святилища є кліриком. Деяких священників покликано до простого життя в храмовому служінні: свою відданість вони виявляють молитвою й обрядами, а не магією. Багато смертних заявляють, що говорять від імені богів, але мало хто здатен скликати силу цих богів так, як клірик.","facts":["Кістка хітів: к8","Підклас з 3 рівня","7 підкласів"],"features":[{"level":1,"name":"Божественний орден","engName":"Cleric: Divine Order (2024)","description":"Ви присвятили себе одній з наведених священних ролей на ваш вибір.\n\n**Захисник.** Навчений до бою, ви отримуєте Володіння бойовою зброєю та підготовку до важких обладунків.\n\n**Дивотворець.** Ви знаєте одне додаткове замовляння зі списку заклинань клірика. Крім того, ваш містичний звʼязок із божественним дає вам бонус до перевірок Інтелекту (Магія або Релігія). Бонус дорівнює вашому модифікатору Мудрості (мінімум +1)."},{"level":1,"name":"Чаклування","engName":"Cleric: Spellcasting (2024)","description":"Ви навчилися накладати заклинання через молитву й медитацію. Правила чаклування описані в розділі 7. Нижче йдеться про те, як ви застосовуєте ці правила до заклинань клірика, перелічених у списку заклинань клірика далі в описі класу.\n\n**Замовляння.** Ви знаєте три замовляння на ваш вибір зі списку заклинань клірика. Рекомендуються Настанова [Guidance], Священне полумʼя [Sacred Flame] та Дивотворство [Thaumaturgy].\n\nЩоразу, коли ви отримуєте рівень клірика, ви можете замінити одне зі своїх замовлянь іншим замовлянням на ваш вибір зі списку заклинань клірика.\n\nКоли ви досягаєте 4 і 10 рівнів клірика, ви вивчаєте ще одне замовляння на ваш вибір зі списку заклинань клірика, як показано в колонці «Замовляння» таблиці фіч Клірика.\n\n**Слоти заклинань.** Таблиця фіч Клірика показує, скільки слотів заклинань ви маєте для накладання заклинань 1 рівня й вище. Ви відновлюєте всі витрачені слоти, коли завершуєте довгий відпочинок.\n\n**Підготовлені заклинання 1 рівня й вище.** Ви готуєте список заклинань 1 рівня й вище, доступних вам для накладання цією фічею. Для початку виберіть чотири заклинання 1 рівня зі списку заклинань клірика. Рекомендуються Благословення [Bless], Лікування ран [Cure Wounds], Спрямований заряд [Guiding Bolt] та Щит віри [Shield of Faith].\n\nКількість заклинань у вашому списку зростає з рівнями клірика, як показано в колонці «Підготовлені заклинання» таблиці фіч Клірика. Щоразу, коли ця кількість зростає, виберіть додаткові заклинання зі списку заклинань клірика, доки кількість заклинань у вашому списку не зрівняється з числом у таблиці. Обрані заклинання мають бути того рівня, для якого ви маєте слоти. Наприклад, якщо ви клірик 3 рівня, ваш список підготовлених заклинань може містити шість заклинань 1 і 2 рівнів у будь-якому поєднанні.\n\nЯкщо інша фіча клірика дає вам заклинання, які ви завжди маєте підготовленими, вони не враховуються в кількість заклинань, яку ви можете підготувати цією фічею, але в усьому іншому вважаються для вас заклинаннями клірика.\n\n**Зміна підготовлених заклинань.** Щоразу, коли ви завершуєте довгий відпочинок, ви можете змінити список підготовлених заклинань, замінивши будь-які з них іншими заклинаннями клірика, для яких маєте слоти.\n\n**Характеристика чаклування.** Мудрість є вашою характеристикою чаклування для заклинань клірика.\n\n**Чаротворчий фокус.** Ви можете використовувати Священний символ як чаротворчий фокус для заклинань клірика."},{"level":2,"name":"Канал божественності","engName":"Cleric: Channel Divinity (2024)","description":"Ви можете спрямовувати божественну енергію просто із Зовнішніх Планів, щоб живити магічні ефекти. Ви починаєте з двох таких ефектів — Божественна іскра та Вигнання нежиті, — кожен з яких описано нижче. Щоразу, коли ви застосовуєте Канал божественності цього класу, обирайте, який саме ефект Каналу божественності з цього класу створити. На вищих рівнях клірика ви отримуєте додаткові варіанти ефектів.\n\nВи можете застосовувати Канал божественності цього класу двічі. Ви відновлюєте одне витрачене використання, коли завершуєте короткий відпочинок, і всі витрачені використання — коли завершуєте довгий відпочинок. Додаткові використання ви отримуєте на певних рівнях клірика, як показано в колонці «Канал божественності» таблиці фіч Клірика.\n\nЯкщо ефект Каналу божественності вимагає ряткидка, його СК дорівнює СК ряткидка проти заклинань із фічі Чаклування цього класу.\n\n**Божественна іскра.** Магічною дією ви спрямовуєте свій Священний символ на інше створіння, яке бачите в межах 30 футів від себе, і зосереджуєте на ньому божественну енергію. Киньте 1к8 і додайте свій модифікатор Мудрості. Ви або відновлюєте створінню ХП у кількості, що дорівнює цьому підсумку, або змушуєте його зробити ряткидок Статури. При провалі створіння зазнає некротичної або променевої шкоди (на ваш вибір) у кількості, що дорівнює цьому підсумку. При успіху створіння отримує половину цієї шкоди (округлено вниз).\n\nВи кидаєте додатковий к8, коли досягаєте 7 (2к8), 13 (3к8) і 18 (4к8) рівнів клірика.\n\n**Вигнання нежиті.** Магічною дією ви демонструєте свій Священний символ і картаєте створінь-нежить. Кожна нежить на ваш вибір у межах 30 футів від вас має зробити ряткидок Мудрості. Якщо створіння провалює ряткидок, воно отримує стани Наляканий і Недієздатний на 1 хвилину. Протягом цього часу воно у свої ходи намагається відійти від вас якнайдалі. Цей ефект закінчується раніше, якщо створіння отримує будь-яку шкоду, якщо ви отримуєте стан Недієздатний або якщо ви гинете."},{"level":3,"name":"Підклас Клірика","engName":"Cleric: Cleric Subclass (2024)","description":"Ви отримуєте підклас Клірика на ваш вибір. Підкласи Домен життя, Домен світла, Домен підступності та Домен війни описані після опису цього класу. Підклас — це спеціалізація, яка дає вам фічі на певних рівнях клірика. До кінця вашої карʼєри ви отримуєте кожну фічу свого підкласу, рівень якої не перевищує вашого рівня клірика."},{"level":4,"name":"Покращення Характеристик","engName":"Cleric: Ability Score Improvement (2024)","description":"Ви отримуєте рису Покращення Характеристик або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Ви отримуєте цю фічу знову на 8, 12 і 16 рівнях клірика."},{"level":5,"name":"Випалювання нежиті","engName":"Cleric: Sear Undead (2024)","description":"Щоразу, коли ви застосовуєте Вигнання нежиті, ви можете кинути кількість к8, що дорівнює вашому модифікатору Мудрості (мінімум 1к8), і скласти результати. Кожна нежить, яка провалила ряткидок проти цього застосування Вигнання нежиті, зазнає променевої шкоди в кількості, що дорівнює підсумку кидка. Ця шкода не припиняє ефект вигнання."},{"level":7,"name":"Благословенні удари","engName":"Cleric: Blessed Strikes (2024)","description":"Божественна сила наповнює вас у бою. Ви отримуєте один з наведених варіантів на ваш вибір (якщо ви отримуєте будь-який із цих варіантів від підкласу клірика зі старішої книги, використовуйте лише той варіант, який ви обрали для цієї фічі).\n\n**Божественний удар.** Один раз у кожен свій хід, коли ви влучаєте по створінню кидком атаки зброєю, ви можете завдати цілі ще 1к8 некротичної або променевої шкоди (на ваш вибір).\n\n**Могутнє чаклування.** Додавайте свій модифікатор Мудрості до шкоди, яку ви завдаєте будь-яким замовлянням клірика."},{"level":10,"name":"Божественне втручання","engName":"Cleric: Divine Intervention (2024)","description":"Ви можете закликати своє божество або пантеон втрутитися заради вас. Магічною дією виберіть будь-яке заклинання клірика 5 рівня або нижче, накладання якого не потребує реакції. У межах тієї ж дії ви накладаєте це заклинання, не витрачаючи слот заклинань і не потребуючи Матеріальних компонентів. Ви не можете скористатися цією фічею знову, доки не завершите довгий відпочинок."},{"level":14,"name":"Покращені благословенні удари","engName":"Cleric: Improved Blessed Strikes (2024)","description":"Варіант, який ви обрали для Благословенних ударів, стає потужнішим.\n\n**Божественний удар.** Додаткова шкода вашого Божественного удару зростає до 2к8.\n\n**Могутнє чаклування.** Коли ви накладаєте замовляння клірика й завдаєте ним шкоди створінню, ви можете дати життєвої сили собі або іншому створінню в межах 60 футів від себе, надавши Тимчасові ХП у кількості, що дорівнює подвоєному модифікатору Мудрості."},{"level":19,"name":"Епічний Дар","engName":"Cleric: Epic Boon (2024)","description":"Ви отримуєте рису Епічного Дару або іншу рису на ваш вибір, вимогам якої ви відповідаєте. Рекомендується Дар Долі."},{"level":20,"name":"Величне божественне втручання","engName":"Cleric: Greater Divine Intervention (2024)","description":"Ви можете закликати ще потужніше божественне втручання. Коли ви застосовуєте фічу Божественне втручання, ви можете обрати заклинання Бажання [Wish]. Якщо ви так робите, ви не можете застосувати Божественне втручання знову, доки не завершите 2к4 довгих відпочинків."}],"children":[{"name":"Домен війни","engName":"War Domain","slug":"war-domain","kind":"Підклас","description":"Війна має багато проявів. Вона може зробити героїв зі звичайних людей. Вона може бути відчайдушною й жахливою, коли акти жорстокості та боягузтва затьмарюють приклади досконалості й відваги. Кліріки, які черпають силу магії Домену Війни, вирізняються в бою, надихаючи інших боротися за праву справу або підносячи акти насильства як молитви.\n\nБоги Домену Війни оберігають воїнів і винагороджують їх за великі звершення. Серед них — поборники честі й лицарства, а також боги руйнування й грабунку. Інші боги війни займають нейтральнішу позицію, підтримуючи війну в усіх її проявах і підтримуючи воїнів за будь-яких обставин.","features":[{"level":3,"name":"Військовий жрець","engName":"War Domain: War Priest (2024)","description":"Бонусною дією ви можете зробити одну атаку зброєю або Беззбройний удар. Ви можете використовувати цю бонусну дію кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання, коли завершуєте короткий або довгий відпочинок."},{"level":3,"name":"Заклинання Домену Війни","engName":"War Domain: War Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом гарантує, що ви завжди маєте напоготові певні заклинання. Коли ви досягаєте рівня Клірика, зазначеного в таблиці Заклинань Домену Війни, ви відтоді завжди маєте перелічені заклинання підготованими.\n\nРівень Клірика: підготовані заклинання\n\n3 рівень: Спрямований заряд [Guiding Bolt], Магічна зброя [Magic Weapon], Щит віри [Shield of Faith], Духовна зброя [Spiritual Weapon]\n5 рівень: Мантія хрестоносця [Crusader's Mantle], Духи захисники [Spirit Guardians]\n7 рівень: Вогняний щит [Fire Shield], Свобода рухів [Freedom of Movement]\n9 рівень: Стримування монстра [Hold Monster], Удар сталевого вітру [Steel Wind Strike]"},{"level":3,"name":"Скерований удар","engName":"War Domain: Guided Strike (2024)","description":"Коли ви або істота в межах 30 футів від вас промахуєтеся кидком атаки, ви можете витратити одне використання Виклику божественності та дати цьому кидку бонус +10, можливо змусивши його влучити. Коли ви використовуєте цю фічу на користь кидка атаки іншої істоти, ви мусите вжити для цього реакцію."},{"level":6,"name":"Благословення бога війни","engName":"War Domain: War God’s Blessing (2024)","description":"Ви можете витратити використання Виклику божественності, щоб накласти Щит віри [Shield of Faith] або Духовну зброю [Spiritual Weapon] замість витрачання слоту заклинань. Коли ви накладаєте будь-яке з цих заклинань у такий спосіб, заклинання не потребує Концентрації. Натомість заклинання триває 1 хвилину, але завершується раніше, якщо ви накладаєте це заклинання знову, отримуєте стан Недієздатний або гинете."},{"level":17,"name":"Аватар битви","engName":"War Domain: Avatar of Battle (2024)","description":"Ви отримуєте опір дробильній, колючій і рублячій шкоді."}]},{"name":"Домен життя","engName":"Life Domain","slug":"life-domain","kind":"Підклас","description":"Домен Життя зосереджений на позитивній енергії, що підтримує все життя в мультивсесвіті. Кліріки, які черпають силу цього домену, є майстрами зцілення, що використовують цю життєву силу, аби лікувати численні рани.\n\nСаме існування спирається на позитивну енергію, повʼязану з цим доменом, тому Клірик майже будь-якої релігійної традиції може обрати його. Цей домен особливо повʼязаний із божествами землеробства, богами зцілення чи витривалості та богами дому й громади. Релігійні ордени зцілення також прагнуть магії цього домену.","features":[{"level":3,"name":"Заклинання Домену Життя","engName":"Life Domain: Life Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом гарантує, що ви завжди маєте напоготові певні заклинання. Коли ви досягаєте рівня Клірика, зазначеного в таблиці Заклинань Домену Життя, ви відтоді завжди маєте перелічені заклинання підготованими.\n\nРівень Клірика: підготовані заклинання\n\n3 рівень: Підтримка [Aid], Благословення [Bless], Лікування ран [Cure Wounds], Мале відновлення [Lesser Restoration]\n5 рівень: Масове цілюще слово [Mass Healing Word], Відродження [Revivify]\n7 рівень: Аура життя [Aura of Life], Захист від смерті [Death Ward]\n9 рівень: Більше відновлення [Greater Restoration], Масове лікування ран [Mass Cure Wounds]"},{"level":3,"name":"Збереження життя","engName":"Life Domain: Preserve Life (2024)","description":"Магічною дією ви демонструєте свій священний символ і витрачаєте використання Виклику божественності, щоб викликати цілющу енергію, яка може відновити кількість ХП, рівну пʼятиразовому вашому рівню Клірика. Оберіть Закривавлених істот у межах 30 футів від себе (серед яких можете бути й ви) і розподіліть ці ХП між ними. Ця фіча не може відновити істоті більше, ніж половину її максимуму ХП."},{"level":3,"name":"Учень життя","engName":"Life Domain: Disciple of Life (2024)","description":"Коли заклинання, яке ви накладаєте за допомогою слоту заклинань, відновлює ХП істоті, ця істота відновлює додаткові ХП на ході, на якому ви наклали заклинання. Додаткові ХП дорівнюють 2 плюс рівень слоту заклинань."},{"level":6,"name":"Благословенний цілитель","engName":"Life Domain: Blessed Healer (2024)","description":"Цілющі заклинання, які ви накладаєте на інших, зцілюють і вас. Одразу після того як ви накладете за допомогою слоту заклинань заклинання, що відновлює ХП одній або декільком істотам, окрім вас самих, ви відновлюєте ХП у кількості, що дорівнює 2 плюс рівень слоту заклинань."},{"level":17,"name":"Найвище зцілення","engName":"Life Domain: Supreme Healing (2024)","description":"Коли ви зазвичай мали б кинути один або декілька кубиків, щоб відновити ХП істоті за допомогою заклинання чи Виклику божественності, ви не кидаєте ці кубики для зцілення — натомість використовуйте найвище можливе число для кожного кубика. Наприклад, замість того щоб відновити істоті 2к6 ХП заклинанням, ви відновлюєте 12."}]},{"name":"Домен знань","engName":"Knowledge Domain","slug":"knowledge-domain","kind":"Підклас","description":"Домен знань понад усе цінує навчання та розуміння. Клірики, які черпають силу з цього домену, вивчають езотеричні знання, збирають давні фоліанти, досліджують таємні місця й вивчають процеси розуму. Для них знання цінніші за матеріальні багатства, а навчання — акт поклоніння. Бібліотеки, університети та інші освітні установи також черпають силу з Домену знань.\n\nБоги знань різняться: від володарів таємної магії до покровителів ремесел і винаходів. У Фаеруні клірики Домену знань поклоняються божествам навчання та винахідливості, зокрема Огмі й Ґонду, а також багатьом іншим.","features":[{"level":3,"name":"Благословення знань","engName":"Knowledge Domain: Blessings of Knowledge (2024)","description":"Ви отримуєте володіння одним видом Інструментів ремісника на ваш вибір і двома навичками на ваш вибір із такого списку: Магія, Історія, Природа або Релігія. Ви маєте експертизу в цих двох навичках."},{"level":3,"name":"Заклинання Домену знань","engName":"Knowledge Domain: Knowledge Domain Spells (2024)","description":"Коли ви досягаєте рівня клірика, зазначеного в таблиці «Заклинання Домену знань», наведені заклинання відтоді завжди підготовлені у вас.\n\n| Рівень клірика | Підготовлені заклинання |\n| --- | --- |\n| 3 | Наказ [Command], Розуміння мов [Comprehend Languages]*, Виявлення магії [Detect Magic]*, Виявлення думок [Detect Thoughts]*, Розпізнавання [Identify]*, Пронизання розуму [Mind Spike]* |\n| 5 | Розвіювання магії [Dispel Magic], Невиявлення [Nondetection], Мови [Tongues]* |\n| 7 | Арканне око [Arcane eye]*, Вигнання [Banishment], Спантеличення [Confusion] |\n| 9 | Знання легенд [Legend Lore]*, Стеження [Scrying]*, Синаптичний розряд [Synaptic Static] |\n\n*Заклинання школи Ворожіння."},{"level":3,"name":"Магія розуму","engName":"Knowledge Domain: Mind Magic (2024)","description":"Дією Магія ви можете витратити одне використання Божественного каналу, щоб виявити свої магічні знання. Оберіть одне підготовлене вами заклинання школи Ворожіння з таблиці Заклинань Домену знань. У межах цієї дії ви застосовуєте це заклинання без витрати слота заклинань і без матеріальних компонентів."},{"level":6,"name":"Незвʼязаний розум","engName":"Knowledge Domain: Unfettered Mind (2024)","description":"Ви отримуєте телепатію на відстань до 60 футів. Використовуючи цю телепатію, ви можете одночасно контактувати з кількістю істот, що дорівнює вашому модифікатору Мудрості (щонайменше однією).\n\nКрім того, ви отримуєте володіння ряткидками Інтелекту. Якщо ви вже маєте це володіння, натомість отримуєте володіння ряткидками однієї характеристики, якими ще не володієте."},{"level":17,"name":"Божественне передбачення","engName":"Knowledge Domain: Divine Foreknowledge (2024)","description":"Бонусною дією ви магічно розширюєте свій розум у майбутнє. Протягом 1 години ви маєте перевагу на тести к20. Після використання цієї риси ви не можете використати її знову, доки не завершите довгий відпочинок. Ви також можете відновити використання цієї риси, витративши слот заклинань 6-го або вищого рівня (дія не потрібна)."}]},{"name":"Домен магії","engName":"Arcana Domain","slug":"arcana-domain","kind":"Підклас","description":"Магія пронизує мультивсесвіт і живить як руйнування, так і творення. Клірики Домену магії розглядають магічні знання не як силу для досягнення особистих цілей, а як дар, яким вони зобовʼязані ділитися.\n\nБоги, повʼязані з Доменом магії, досконало знають таємниці й можливості магії. Ці боги часто повʼязані зі знаннями, таємницями або владою.","features":[{"level":3,"name":"Заклинання Домену магії","engName":"Arcana Domain: Arcana Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом означає, що певні заклинання завжди напоготові. Коли ви досягаєте рівня клірика, зазначеного в таблиці «Заклинання Домену магії», наведені заклинання відтоді завжди підготовлені у вас.\n\n| Рівень клірика | Підготовлені заклинання |\n| --- | --- |\n| 3 | Виявлення магії [Detect Magic], Магічний дротик [Magic missile], Магічна зброя [Magic Weapon], Ністулова магічна аура [Nystul's Magic Aura] |\n| 5 | Контрчари [Counterspell], Розвіювання магії [Dispel Magic] |\n| 7 | Арканне око [Arcane eye], Таємна скриня Леомунда [Leomund's Secret Chest] |\n| 9 | Длань Бігбі [Bigby's Hand], Коло телепортації [Teleportation Circle] |"},{"level":3,"name":"Зміна магії","engName":"Arcana Domain: Modify Magic (2024)","description":"Ви можете використовувати свій Божественний канал, щоб змінювати заклинання під час їх застосування. Коли ви застосовуєте заклинання, ви можете витратити одне використання Божественного каналу й змінити заклинання одним із наведених способів (дія не потрібна).\n\n**Зміцнювальне заклинання.** Одна ціль заклинання отримує тимчасові хіти в кількості 2к8 плюс ваш рівень клірика.\n\n**Наполегливе заклинання.** Коли ви застосовуєте заклинання, яке змушує істоту робити ряткидок, і видима вам істота успішно проходить цей ряткидок, киньте 1к6 і відніміть результат від першого ряткидка цілі проти ефекту заклинання."},{"level":3,"name":"Учень магії","engName":"Arcana Domain: Student of Arcana (2024)","description":"Ви отримуєте такі переваги.\n\n**Магічні знання.** Ви отримуєте володіння навичкою Магія або однією навичкою на ваш вибір зі списку навичок, доступних клірикам на 1-му рівні.\n\n**Замовляння.** Ви вивчаєте два замовляння чарівника на ваш вибір. Щоразу, коли ви отримуєте рівень клірика, ви можете замінити одне з цих замовлянь іншим замовлянням чарівника."},{"level":6,"name":"Розсіювальне відновлення","engName":"Arcana Domain: Dispelling Recovery (2024)","description":"Одразу після застосування слотом заклинань заклинання, яке відновлює істоті хіти або припиняє стан істоти, ви можете застосувати Розвіювання магії [Dispel Magic] у межах тієї самої дії, бонусної дії чи реакції, не витрачаючи слот заклинань.\n\nПісля використання цієї риси ви не можете використати її знову, доки не завершите короткий або довгий відпочинок. Ви також можете відновити її використання, витративши одне використання Божественного каналу (дія не потрібна)."},{"level":17,"name":"Магічна майстерність","engName":"Arcana Domain: Magical Mastery (2024)","description":"Ви вивчаєте чотири заклинання чарівника: по одному 6-го, 7-го, 8-го та 9-го рівня. Відтоді ці заклинання завжди підготовлені у вас. Щоразу, коли ви отримуєте рівень клірика, ви можете замінити одне з цих заклинань іншим заклинанням чарівника того самого рівня."}]},{"name":"Домен могили","engName":"Grave Domain","slug":"grave-domain","kind":"Підклас","description":"Клірики Домену могили бережуть природну межу між життям і смертю, полегшують шлях помираючих і протистоять тим, хто паплюжить цю межу.","features":[{"level":3,"name":"Заклинання Домену могили","engName":"Grave Domain: Grave Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом гарантує, що певні заклинання завжди напоготові. Коли ви досягаєте рівня клірика, зазначеного в таблиці «Заклинання Домену могили», наведені заклинання відтоді завжди підготовлені у вас.\n\n| Рівень клірика | Підготовлені заклинання |\n| --- | --- |\n| 3 | Виявлення зла й добра [Detect Evil and Good], Фальшиве життя [False Life], Лагідний спочинок [Gentle Repose], Промінь ослаблення [Ray of Enfeeblement], Пощада помираючому [Spare the Dying] |\n| 5 | Оживлення [Revivify], Вампірський дотик [Vampiric Touch] |\n| 7 | Вʼянення [Blight], Захист від смерті [Death Ward] |\n| 9 | Розвіювання зла й добра [Dispel Evil and Good], Повернення до життя [Raise Dead] |"},{"level":3,"name":"Коло смертності","engName":"Grave Domain: Circle of Mortality (2024)","description":"Ви можете керувати рівновагою між життям і смертю та отримуєте такі переваги.\n\n**Поклик смерті.** Один раз за хід, коли ви завдаєте шкоди істоті, яка втратила хоча б частину хітів, застосувавши заклинання або влучивши кидком атаки, ця істота отримує додатково 1к4 некротичної шкоди. На 11-му рівні клірика ця додаткова шкода збільшується до 1к6.\n\n**Повернення до життя.** Ви можете застосовувати Пощаду помираючому [Spare the Dying] бонусною дією.\n\nКрім того, коли заклинанням або Божественним каналом ви відновлюєте хіти істоті з 0 хітів і зазвичай мали б кинути один чи більше кубиків лікування, не кидайте їх, а використайте найбільше можливе значення кожного кубика. Наприклад, замість відновлення 2к4 хітів ви відновлюєте 8."},{"level":3,"name":"Шлях до могили","engName":"Grave Domain: Path to the Grave (2024)","description":"Бонусною дією ви показуєте Священний символ і витрачаєте одне використання Божественного каналу, щоб проклясти видиму вам істоту в межах 30 футів до початку вашого наступного ходу. Поки істота проклята, вона має перешкоду на кидки атаки й ряткидки.\n\nКоли ви або видимий вам союзник влучаєте в прокляту ціль кидком атаки, ви можете достроково завершити прокляття (дія не потрібна), щоб атака завдала додаткової некротичної або променевої шкоди на ваш вибір у кількості, що дорівнює вашому рівню клірика."},{"level":6,"name":"Вартовий при дверях смерті","engName":"Grave Domain: Sentinel at Death’s Door (2024)","description":"Коли ви або видима вам Закривавлена істота в межах 60 футів отримує влучання кидком атаки, ви можете реакцією зменшити шкоду цієї атаки вдвічі (з округленням донизу). Якщо кидок атаки був критичним влучанням, усі ефекти, спричинені критичним влучанням, скасовуються.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (щонайменше один раз), і відновлюєте всі витрачені використання після довгого відпочинку."},{"level":17,"name":"Божественний жнець","engName":"Grave Domain: Divine Reaper (2024)","description":"Ваш глибокий звʼязок із доменом робить вас священним провісником смерті та дає такі переваги.\n\n**Посилена некромантія.** Коли ви застосовуєте заклинання школи Некромантії 5-го або нижчого рівня, яке націлене на одну істоту, або заклинання з таблиці Заклинань Домену могили, ви можете витратити одне використання Божественного каналу, щоб обрати другою ціллю іншу істоту в межах дальності заклинання. Якщо заклинання потребує дорогих або витратних матеріальних компонентів, ви маєте надати їх для кожної цілі.\n\n**Хранитель душ.** Коли ворог помирає в межах 60 футів від вас, ви або одна видима вам істота в межах 60 футів від вас відновлює хіти в кількості, що дорівнює подвоєному рівню клірика. Ви не можете використати цю рису, якщо маєте стан Недієздатний. Після використання ви не можете скористатися нею знову, доки не завершите короткий або довгий відпочинок, якщо тільки не витратите слот заклинань 6-го або вищого рівня, щоб відновити її використання (дія не потрібна)."}]},{"name":"Домен підступності","engName":"Trickery Domain","slug":"trickery-domain","kind":"Підклас","description":"Домен Хитрощів дарує магію оману, ілюзій і непомітності. Кліріки, які володіють цією магією, — руйнівна сила у світі, що проколює пиху, висміює тиранів, звільняє бранців і нехтує пустими традиціями. Вони віддають перевагу підступам і витівкам перед прямим протистоянням.\n\nБоги хитрощів — це витівники й підбурювачі, що є постійним викликом усталеному порядку як серед богів, так і серед смертних. Вони втілюють сили змін і суспільних потрясінь та є покровителями злодіїв, шахраїв, гравців, бунтарів і визволителів. Релігійні ордени, що діють таємно, особливо ті, що прагнуть підірвати гнобительські уряди чи ієрархії, також черпають силу з Домену Хитрощів.","features":[{"level":3,"name":"Благословення хитруна","engName":"Trickery Domain: Blessing of the Trickster (2024)","description":"Магічною дією ви можете обрати себе або згодну істоту в межах 30 футів від себе, щоб вона отримала перевагу на перевірки Спритності (Непомітність). Це благословення триває, доки ви не завершите довгий відпочинок або не використаєте цю фічу знову."},{"level":3,"name":"Виклик двійника","engName":"Trickery Domain: Invoke Duplicity (2024)","description":"Бонусною дією ви можете витратити одне використання Виклику божественності, щоб створити ідеальну візуальну ілюзію себе в незайнятому просторі, який ви бачите в межах 30 футів від себе. Ілюзія нематеріальна й не займає свого простору. Вона триває 1 хвилину, але завершується раніше, якщо ви скасуєте її (дія не потрібна) або отримаєте стан Недієздатний. Ілюзія анімована й наслідує ваші вирази обличчя та жести. Поки вона існує, ви отримуєте наведені нижче переваги.\n\n**Накладання заклинань.** Ви можете накладати заклинання так, ніби перебуваєте в просторі ілюзії, але мусите використовувати власні відчуття.\n\n**Відволікання.** Коли і ви, і ваша ілюзія перебуваєте в межах 5 футів від істоти, яка бачить ілюзію, ви маєте перевагу на кидки атаки проти цієї істоти, оскільки ілюзія настільки відволікає ціль.\n\n**Переміщення.** Бонусною дією ви можете пересунути ілюзію на відстань до 30 футів у незайнятий простір, який ви бачите в межах 120 футів від себе."},{"level":3,"name":"Заклинання Домену Хитрощів","engName":"Trickery Domain: Trickery Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом гарантує, що ви завжди маєте напоготові певні заклинання. Коли ви досягаєте рівня Клірика, зазначеного в таблиці Заклинань Домену Хитрощів, ви відтоді завжди маєте перелічені заклинання підготованими.\n\nРівень Клірика: підготовані заклинання\n\n3 рівень: Причарування особи [Charm Person], Маскування [Disguise Self], Невидимість [Invisibility], Переміщення без сліду [Pass without Trace]\n5 рівень: Гіпнотичний візерунок [Hypnotic Pattern], Невиявлення [Nondetection]\n7 рівень: Спантеличення [Confusion], Двері між вимірами [Dimension Door]\n9 рівень: Підкорення особистості [Dominate Person], Зміна спогадів [Modify Memory]"},{"level":6,"name":"Переміщення хитруна","engName":"Trickery Domain: Trickster’s Transposition (2024)","description":"Щоразу, коли ви вживаєте бонусну дію, щоб створити чи пересунути ілюзію свого Виклику двійника, ви можете телепортуватися, помінявшись місцями з ілюзією."},{"level":17,"name":"Покращений двійник","engName":"Trickery Domain: Improved Duplicity (2024)","description":"Ілюзія вашого Виклику двійника стала могутнішою в наведені нижче способи.\n\n**Спільне відволікання.** Коли ви та ваші союзники робите кидки атаки проти істоти в межах 5 футів від ілюзії, ці кидки атаки мають перевагу.\n\n**Цілюща ілюзія.** Коли ілюзія зникає, ви або істота на ваш вибір у межах 5 футів від неї відновлює кількість ХП, що дорівнює вашому рівню Клірика."}]},{"name":"Домен світла","engName":"Light Domain","slug":"light-domain","kind":"Підклас","description":"Домен Світла наголошує на божественній силі, що приносить палючий вогонь та одкровення. Кліріки, які володіють цією силою, — просвітлені душі, пройняті сяйвом і силою проникливого зору своїх божеств, покликані відганяти брехню й випалювати темряву.\n\nДомен Світла повʼязаний із богами істини, пильності, краси, прозріння та оновлення. Деяких із цих богів ототожнюють із сонцем або як візничих, що ведуть сонце небосхилом. Інші — вартові, що пронизують оману. Дехто — божества краси й мистецтва, що вчать, що мистецтво є засобом вдосконалення душі.","features":[{"level":3,"name":"Заклинання Домену Світла","engName":"Light Domain: Light Domain Spells (2024)","description":"Ваш звʼязок із цим божественним доменом гарантує, що ви завжди маєте напоготові певні заклинання. Коли ви досягаєте рівня Клірика, зазначеного в таблиці Заклинань Домену Світла, ви відтоді завжди маєте перелічені заклинання підготованими.\n\nРівень Клірика: підготовані заклинання\n\n3 рівень: Палючі долоні [Burning Hands], Вогники фей [Faerie fire], Розпечений промінь [Scorching Ray], Бачення невидимого [See Invisibility]\n5 рівень: Денне світло [Daylight], Вогнекуля [Fireball]\n7 рівень: Арканне око [Arcane eye], Стіна вогню [Wall of Fire]\n9 рівень: Полумʼяний удар [Flame Strike], Стеження [Scrying]"},{"level":3,"name":"Захисний спалах","engName":"Light Domain: Warding Flare (2024)","description":"Коли істота, яку ви бачите в межах 30 футів від себе, робить кидок атаки, ви можете вжити реакцію, щоб накласти перешкоду на цей кидок атаки, змусивши світло спалахнути ще до того, як атака влучить чи промахнеться.\n\nВи можете використовувати цю фічу кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання, коли завершуєте довгий відпочинок."},{"level":3,"name":"Сяйво світанку","engName":"Light Domain: Radiance of the Dawn (2024)","description":"Магічною дією ви демонструєте свій священний символ і витрачаєте використання Виклику божественності, щоб випустити спалах світла у Випромінюванні радіусом 30 футів, що походить від вас. Будь-яка магічна темрява в цій області — наприклад, створена заклинанням Темрява [Darkness], — розвіюється. Крім того, кожна істота на ваш вибір у цій області мусить зробити ряткидок Статури, зазнаючи променевої шкоди, що дорівнює 2к10 плюс ваш рівень Клірика, у разі провалу, або половину цієї шкоди в разі успіху."},{"level":6,"name":"Покращений захисний спалах","engName":"Light Domain: Improved Warding Flare (2024)","description":"Ви відновлюєте всі витрачені використання вашого Захисного спалаху, коли завершуєте короткий або довгий відпочинок.\n\nКрім того, щоразу, коли ви використовуєте Захисний спалах, ви можете дати цілі атаки, що спричинила його, тимчасові ХП у кількості, що дорівнює 2к6 плюс ваш модифікатор Мудрості."},{"level":17,"name":"Корона світла","engName":"Light Domain: Corona of Light (2024)","description":"Магічною дією ви змушуєте себе випромінювати ауру сонячного світла, яка триває 1 хвилину або доки ви не скасуєте її (дія не потрібна). Ви випромінюєте Яскраве світло в радіусі 60 футів і Тьмяне світло ще на 30 футів понад тим. Ваші вороги в Яскравому світлі мають перешкоду на ряткидки проти вашого Сяйва світанку та будь-якого заклинання, що завдає вогняної чи променевої шкоди.\n\nВи можете використовувати цю фічу кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз), і ви відновлюєте всі витрачені використання, коли завершуєте довгий відпочинок."}]}]},{"edition":"2024","name":"Чарівник","engName":"Wizard","slug":"wizard","description":"Чарівників визначає ретельне вивчення внутрішньої будови магії. Вони накладають заклинання вибухового вогню, дугових блискавок, тонкого обману й видовищних перетворень. Їхня магія викликає чудовиськ з інших планів існування, зазирає в майбутнє чи зводить захисні барʼєри. Наймогутніші їхні заклинання перетворюють одну речовину на іншу, скликають метеори з неба чи відчиняють портали в інші світи.\n\nБільшість чарівників поділяють науковий підхід до магії. Вони досліджують теоретичні основи магії, особливо поділ заклинань на школи магії. Славетні чарівники, як-от Бігбі, Таша, Морденкайнен і Йоланда, спираючись на свої дослідження, створили знакові заклинання, якими тепер користуються по всьому мультивсесвіту.\n\nНайближче до звичайного життя чарівник, імовірно, підійде, працюючи мудрецем чи викладачем. Інші чарівники продають свої послуги як радники, служать у війську або обирають шлях злочину чи панування. Але поклик знань виманює навіть найдомосідливіших чарівників із безпеки бібліотек і лабораторій — у руїни, що розсипаються, і втрачені міста. Більшість чарівників вірять, що їхні побратими з прадавніх цивілізацій знали таємниці магії, які загубилися у віках, і що відкриття цих таємниць може прокласти шлях до сили, більшої за будь-яку магію сьогодення.","facts":["Кістка хітів: к6","Підклас з 3 рівня","9 підкласів"],"features":[{"level":1,"name":"Адепт ритуалів","engName":"Wizard: Ritual Adept (2024)","description":"Ви можете накладати будь-яке заклинання як Ритуал, якщо це заклинання має мітку «Ритуал» і міститься у вашій книзі заклинань. Вам не потрібно мати його підготовленим, але ви мусите читати з книги, щоб накласти заклинання в такий спосіб."},{"level":1,"name":"Магічне відновлення","engName":"Wizard: Arcane Recovery (2024)","description":"Ви можете відновити частину своєї магічної енергії, вивчаючи книгу заклинань. Коли ви завершуєте короткий відпочинок, ви можете обрати витрачені слоти заклинань для відновлення. Сумарний рівень цих слотів не може перевищувати половини вашого рівня чарівника (округлено вгору), і жоден зі слотів не може бути 6 рівня чи вище. Наприклад, якщо ви чарівник 4 рівня, ви можете відновити слоти сумарно на два рівні: або один слот 2 рівня, або два слоти 1 рівня.\n\nСкориставшись цією фічею, ви не можете зробити це знову, доки не завершите довгий відпочинок."},{"level":1,"name":"Чаклування","engName":"Wizard: Spellcasting (2024)","description":"Як дослідник магії, ви навчилися накладати заклинання. Правила чаклування описані в розділі 7. Нижче йдеться про те, як ви застосовуєте ці правила до заклинань чарівника, перелічених у списку заклинань чарівника далі в описі класу.\n\n**Замовляння.** Ви знаєте три замовляння чарівника на ваш вибір. Рекомендуються Світло [Light], Магічна рука [Mage Hand] та Промінь холоду [Ray of Frost]. Щоразу, коли ви завершуєте довгий відпочинок, ви можете замінити одне зі своїх замовлянь із цієї фічі іншим замовлянням чарівника на ваш вибір.\n\nКоли ви досягаєте 4 і 10 рівнів чарівника, ви вивчаєте ще одне замовляння чарівника на ваш вибір, як показано в колонці «Замовляння» таблиці фіч Чарівника.\n\n**Книга заклинань.** Ваше учнівство в магії увінчалося створенням унікальної книги — вашої книги заклинань. Це Крихітний предмет вагою 3 фунти, що містить 100 сторінок і який можете прочитати лише ви або той, хто накладає Розпізнавання [Identify]. Ви самі визначаєте, який вона має вигляд і з чого зроблена, — це може бути том із позолоченими краями чи збірка пергаментів, перевʼязана шпагатом.\n\nКнига містить заклинання 1 рівня й вище, які ви знаєте. Вона починається з шести заклинань чарі
