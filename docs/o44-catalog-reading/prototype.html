можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Ви також можете використовувати ці заклинання, використовуючи будь-які слоти заклинань відповідного рівня, які у вас є. Харизма є вашою характеристикою для цих заклинань, коли ви використовуєте їх цією здібністю."}],"children":[{"name":"Тифлінг (Асмодей)","engName":"Tiefling (Asmodeus)","slug":"variant:TIEFLING_ASMODEUS","kind":"Варіант","description":"Тифлінги, повʼязані з найглибшим шаром Девʼяти Пекл, володіють силою вогню й темряви, а веде їх гостріший за звичайний розум — як і належить родичам самого Асмодея.","features":[{"name":"Пекельна спадщина (Асмодей)","engName":"Infernal Legacy (Asmodeus)","description":"Ви знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Пекельна відсіч [Hellish Rebuke]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Темрява [Darkness]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Баалзебул)","engName":"Tiefling (Baalzebul)","slug":"variant:TIEFLING_BAALZEBUL","kind":"Варіант","description":"Баалзебул править занепалим шаром Девʼяти Пекл і майстерно розбещує тих, чиї дрібні гріхи можна обернути на вчинки, що прирікають на вічну кару. Тифлінги, повʼязані з цим володарем Пекла, здатні розбещувати інших і тілесно, і психічно.","features":[{"name":"Пекельна спадщина (Ваальзевул)","engName":"Infernal Legacy (Baalzebul)","description":"Ви знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Промінь хвороби [Ray of Sickness]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Корона шаленства [Crown of Madness]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Діспатер)","engName":"Tiefling (Dispater)","slug":"variant:TIEFLING_DISPATER","kind":"Варіант","description":"Велике місто Діспатера займає більшу частину другого шару Девʼяти Пекл. Там розкривають таємниці й продають їх тому, хто більше заплатить, тож тифлінги, повʼязані з Діспатером, — чудові шпигуни й лазутчики.","features":[{"name":"Пекельна спадщина (Діспатер)","engName":"Infernal Legacy (Dispater)","description":"Ви знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Маскування [Disguise Self]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Виявлення думок [Detect Thoughts]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Фієрна)","engName":"Tiefling (Fierna)","slug":"variant:TIEFLING_FIERNA","kind":"Варіант","description":"Фієрна, неперевершена маніпуляторка, обдаровує повʼязаних із нею тифлінгів владною вдачею.","features":[{"name":"Пекельна спадщина (Фієрна)","engName":"Infernal Legacy (Fierna)","description":"Ви знаєте замовляння Дружба [Friends]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Причарування особи [Charm Person]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Навіювання [Suggestion]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Гласія)","engName":"Tiefling (Glasya)","slug":"variant:TIEFLING_GLASYA","kind":"Варіант","description":"Гласія, злочинний геній Девʼяти Пекл, дає своїм тифлінгам магію, що стає в пригоді під час пограбувань.","features":[{"name":"Пекельна спадщина (Ґлася)","engName":"Infernal Legacy (Glasya)","description":"Ви знаєте замовляння Мала ілюзія [Minor Illusion]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Маскування [Disguise Self]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Невидимість [Invisibility]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Левістус)","engName":"Tiefling (Levistus)","slug":"variant:TIEFLING_LEVISTUS","kind":"Варіант","description":"Скутим кригою шаром Девʼяти Пекл править Левістус — володар Пекла, відомий угодами, які він пропонує тим, кому не уникнути загибелі.","features":[{"name":"Пекельна спадщина (Левістус)","engName":"Infernal Legacy (Levistus)","description":"Ви знаєте замовляння Промінь холоду [Ray of Frost]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Обладунок Агатіса [Armor of Agathys]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Темрява [Darkness]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Маммон)","engName":"Tiefling (Mammon)","slug":"variant:TIEFLING_MAMMON","kind":"Варіант","description":"Великий скнара Маммон понад усе любить монети. Повʼязані з ним тифлінги як ніхто вміють здобувати й берегти багатство.","features":[{"name":"Пекельна спадщина (Маммон)","engName":"Infernal Legacy (Mammon)","description":"Ви знаєте замовляння Магічна рука [Mage Hand]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Літаючий диск Тензера [Tenser's Floating Disk]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Арканний замок [Arcane Lock]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Мефістофель)","engName":"Tiefling (Mephistopheles)","slug":"variant:TIEFLING_MEPHISTOPHELES","kind":"Варіант","description":"У крижаному царстві Девʼяти Пекл Мефістофель дарує магічну силу тим, хто його благає. Повʼязані з ним тифлінги опановують трохи арканної магії.","features":[{"name":"Пекельна спадщина (Мефістофель)","engName":"Infernal Legacy (Mephistopheles)","description":"Ви знаєте замовляння Магічна рука [Mage Hand]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Палючі долоні [Burning Hands]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Вогняний клинок [Flame Blade]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (Заріель)","engName":"Tiefling (Zariel)","slug":"variant:TIEFLING_ZARIEL","kind":"Варіант","description":"Тифлінги, повʼязані кровʼю із Заріель, сильніші за звичайних тифлінгів і отримують магічні здібності, що допомагають у бою.","features":[{"name":"Пекельна спадщина (Заріель)","engName":"Infernal Legacy (Zariel)","description":"Ви знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Паляча кара [Searing Smite]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Таврувальна кара [Branding Smite]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (диявольський язик)","engName":"Tiefling (Devil's Tongue)","slug":"variant:TIEFLING_VARIANT_DEVILS_TONGUE_SCAG","kind":"Варіант","description":"","features":[{"name":"Пекельна спадщина (Диявольський язик)","engName":"Infernal Legacy (Devil's Tongue)","description":"Ви знаєте замовляння Злісне глузування [Vicious Mockery]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Причарування особи [Charm Person]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Захоплива промова [Enthrall]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (пекельний вогонь)","engName":"Tiefling (Hellfire)","slug":"variant:TIEFLING_VARIANT_HELLFIRE_SCAG","kind":"Варіант","description":"","features":[{"name":"Пекельна спадщина (Пекельний вогонь)","engName":"Infernal Legacy (Hellfire)","description":"Ві знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви досягаєте 3-го рівня, ви можете один раз використати заклинання Палючі долоні [Burning Hands]. Коли ви досягаєте 5-го рівня, ви також можете один раз використати заклинання Темрява [Darkness]. Після використання кожного з цих заклять ви не можете використовувати це заклинання знову, доки не завершите довгий відпочинок. Харизма є вашою заклинальною характеристикою для цих заклинань."}]},{"name":"Тифлінг (крилатий)","engName":"Tiefling (Winged)","slug":"variant:TIEFLING_VARIANT_WINGED_SCAG","kind":"Варіант","description":"","features":[{"name":"Крилатий тифлінг","engName":"Winged Tiefling","description":"Ви маєте швидкість польоту 30 футів. Щоб використовувати цю швидкість, ви не можете носити середні або важкі обладунки."}]}]},{"edition":"2024","name":"Ельф","engName":"Elf","slug":"elf","description":"Створені богом Корелоном, перші ельфи могли вільно змінювати свою форму. Вони втратили цю здатність, коли Корелон прокляв їх за змову з божеством Лолт, яка намагалася — і не змогла — узурпувати владу Корелона.","facts":["30 футів","Середній","0 гілок"],"features":[{"name":"Темнозір","engName":"Elf: Darkvision (2024)","description":"Ви маєте темнозір на відстань 60 футів."},{"name":"Ельфійський родовід","engName":"Elf: Elven Lineage (2024)","description":"Ви належите до родоводу, що наділяє вас надприродними здібностями. Оберіть родовід: Дроу, Високий ельф або Лісовий ельф. Ви отримуєте перевагу 1-го рівня цього родоводу. Коли ви досягаєте 3-го та 5-го рівнів персонажа, ви вивчаєте заклинання вищого рівня, зазначене для вашого родоводу. Це заклинання завжди є підготовленим для вас. Ви можете використати його один раз без витрати слота заклинань і відновлюєте цю можливість після завершення довгого відпочинку. Ви також можете використовувати його за допомогою наявних слотів відповідного рівня. Інтелект, Мудрість або Харизма є вашою базовою характеристикою для заклинань цієї риси (оберіть характеристику під час вибору родоводу)."},{"name":"Фейське походження","engName":"Elf: Fey Ancestry (2024)","description":"Ви маєте перевагу на ряткидки, які робите, щоб уникнути стану Причарований або припинити його."},{"name":"Гострі чуття","engName":"Elf: Keen Senses (2024)","description":"Ви маєте володіння однією з навичок на вибір: Аналіз поведінки, Уважність або Виживання."},{"name":"Транс","engName":"Elf: Trance (2024)","description":"Вам не потрібен сон, і магія не може вас приспати. Ви можете завершити довгий відпочинок за 4 години, якщо проведете ці години в трансовій медитації, під час якої ви зберігаєте свідомість."}],"children":[]},{"edition":"2024","name":"Людина","engName":"Human","slug":"human","description":"Люди трапляються по всьому мультивсесвіту — такі ж різноманітні, як і численні, — і прагнуть досягти якомога більшого за відведені їм роки. Їхню амбітність і винахідливість поважають, хвалять і бояться на багатьох світах.","facts":["30 футів","Середній, Маленький","0 гілок"],"features":[{"name":"Винахідливість","engName":"Human: Resourceful (2024)","description":"Ви отримуєте Героїчне натхнення щоразу, коли завершуєте довгий відпочинок."},{"name":"Вправність","engName":"Human: Skillful (2024)","description":"Ви отримуєте володіння однією навичкою на ваш вибір."},{"name":"Універсальність","engName":"Human: Versatile (2024)","description":"Ви отримуєте одну рису походження на ваш вибір. Рекомендується: Умілець [Skilled]."}],"children":[]},{"edition":"2024","name":"Тифлінг","engName":"Tiefling","slug":"tiefling","description":"Тифлінги або народжуються в Нижніх Планах, або мають предків-почвар, що походять звідти. Тифлінга повʼязує кровʼю з дияволом, демоном чи іншою Почварою. Цей звʼязок із Нижніми Планами — почварна спадщина тифлінга, що приходить з обіцянкою сили.","facts":["30 футів","Середній, Маленький","0 гілок"],"features":[{"name":"Темнозір","engName":"Tiefling: Darkvision (2024)","description":"Ви маєте темнозір на відстань 60 футів."},{"name":"Почварна спадщина","engName":"Tiefling: Fiendish Legacy (2024)","description":"Ви є носієм спадщини, що дарує вам надприродні здібності. Оберіть спадщину: Безодня (опір до отрути, замовляння Бризки отрути [Poison Spray], Промінь хвороби [Ray of Sickness] на 3 рівні, Параліч гуманоїда [Hold Person] на 5 рівні), Хтонічна (опір до некротичної шкоди, замовляння Дотик холоду [Chill Touch], Хибне життя [False Life] на 3 рівні, Промінь виснаження [Ray of Enfeeblement] на 5 рівні), або Пекельна (опір до вогню, замовляння Вогняний снаряд [Fire Bolt], Пекельна відплата [Hellish Rebuke] на 3 рівні, Темрява [Darkness] на 5 рівні). Коли ви досягаєте 3-го та 5-го рівнів персонажа, ви вивчаєте заклинання вищого рівня, зазначене для вашої спадщини. Це заклинання завжди є підготовленим для вас. Ви можете використати його один раз без витрати слота заклинань і відновлюєте цю можливість після завершення довгого відпочинку. Ви також можете використовувати його за допомогою наявних слотів відповідного рівня. Інтелект, Мудрість або Харизма є вашою базовою характеристикою для цих заклинань."},{"name":"Потойбічна присутність","engName":"Tiefling: Otherworldly Presence (2024)","description":"Ви знаєте замовляння Дивотворство [Thaumaturgy]. Коли ви чаклуєте його цією рисою, заклинання використовує ту саму базову характеристику, яку ви обрали для своєї Почварної спадщини."}],"children":[]}]}</script>
<script>
const data=JSON.parse(document.getElementById('catalog-data').textContent);
const reader=document.getElementById('reader');
const isMobile=()=>matchMedia('(max-width:760px)').matches;
const slug=value=>value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const featureKey=feature=>slug(feature.engName)+(feature.level?'-'+feature.level:'');
let state=readAddress();
function readAddress(){
 const params=new URLSearchParams(location.search),category=params.has('race')?'races':'classes',edition=params.get('edition')==='2024'?'2024':'2014';
 const items=data[category].filter(item=>item.edition===edition);
 const entity=items.find(item=>item.slug===params.get(category==='classes'?'class':'race'))??items[0];
 const child=entity.children.find(item=>item.slug===(params.get('subclass')??params.get('branch')??params.get('jump')));
 const feature=params.get('feature')??params.get('trait')??'';
 return {category,edition,entity:entity.slug,section:feature&&!child?'features':child?'children':params.get('view')??'overview',child:child?.slug??'',feature,reader:Boolean(child)||(isMobile()&&params.has(category==='classes'?'class':'race'))};
}
function getItems(category=state.category){return data[category].filter(item=>item.edition===state.edition)}
function getEntity(){return getItems().find(item=>item.slug===state.entity)}
function writeAddress(replace=false){
 const params=new URLSearchParams(),isClass=state.category==='classes';
 params.set(isClass?'class':'race',state.entity);params.set('view',state.section);
 params.set('edition',state.edition);
 if(state.child)params.set(isClass?'subclass':'branch',state.child);
 if(state.feature)params.set(isClass?'feature':'trait',state.feature);
 history[replace?'replaceState':'pushState']({...state},'',location.pathname+'?'+params);
}
function navigate(next){state={...state,...next};writeAddress();render()}
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function button(text,action){const node=element('button',text);node.type='button';node.onclick=action;return node}
function render(){
 document.getElementById('edition').value=state.edition;
 document.getElementById('races').textContent=state.edition==='2024'?'Види':'Раси';
 document.getElementById('classes').setAttribute('aria-pressed',String(state.category==='classes'));
 document.getElementById('races').setAttribute('aria-pressed',String(state.category==='races'));
 const list=document.getElementById('list');list.replaceChildren();
 for(const item of getItems()){
  const row=button('',()=>navigate({entity:item.slug,section:'overview',child:'',feature:'',reader:isMobile()}));
  row.append(element('strong',item.name),element('small',item.engName));row.setAttribute('aria-pressed',String(item.slug===state.entity));list.append(row);
 }
 renderParent(document.getElementById('detail'));
 if(state.reader){
  const content=document.getElementById('reader-content');
  if(state.child)renderChild(content);else renderParent(content);
  document.getElementById('back-reader').hidden=!state.child;
  document.getElementById('back-reader').textContent=state.category==='classes'?'← До класу':'← До раси';
  const child=getEntity().children.find(item=>item.slug===state.child);
  document.getElementById('reader-location').textContent=getEntity().name+(child?' › '+child.name:'');
  if(!reader.open)reader.showModal();
  const title=content.querySelector('h1');title.id='reader-title';title.tabIndex=-1;title.focus({preventScroll:true});
  document.getElementById('reader-scroll').scrollTop=0;
 }else if(reader.open)reader.close();
 focusFeature();
}
function renderParent(container){
 const entity=getEntity(),isClass=state.category==='classes';container.replaceChildren();
 container.append(element('h1',entity.name),element('small',entity.engName+' · '+state.edition));
 const nav=element('nav',undefined,'sections');nav.setAttribute('aria-label','Розділи '+entity.name);
 for(const [key,label] of [['overview','Огляд'],['features',isClass?'Здібності':'Риси'],['children',isClass?'Підкласи':'Підраси й варіанти']]){
  if(key==='children'&&!entity.children.length)continue;
  const tab=button(label,()=>navigate({section:key,child:'',feature:''}));tab.setAttribute('aria-pressed',String(state.section===key));nav.append(tab);
 }container.append(nav);
 if(state.section==='overview'){
  const facts=element('div',undefined,'facts');for(const fact of entity.facts)facts.append(element('span',fact,'fact'));container.append(facts,renderProse(entity.description));
  if(entity.children.length)container.append(button('Переглянути '+(isClass?'підкласи':'підраси й варіанти')+' ('+entity.children.length+')',()=>navigate({section:'children'})));
 }else if(state.section==='features')renderFeatures(container,entity.features);
 else{
  const grid=element('div',undefined,'cards');
  for(const child of entity.children){
   const card=button('',()=>navigate({child:child.slug,feature:'',reader:true}));
   card.append(element('strong',child.name),element('small',child.kind+' · '+child.features.length+' здібностей'),element('p',child.description.slice(0,140)+(child.description.length>140?'…':'')),element('span','Відкрити →','tag'));grid.append(card);
  }container.append(grid);
 }
}
function renderChild(container){
 const parent=getEntity(),child=parent.children.find(item=>item.slug===state.child);container.replaceChildren();
 container.append(element('p',parent.name+' › '+child.kind,'breadcrumb'),element('h1',child.name),element('small',child.engName+' · '+state.edition),renderProse(child.description));
 renderFeatures(container,child.features);
}
function appendInlineContent(container,text){
 for(const [index,part] of text.split('**').entries())container.append(index%2?element('strong',part):document.createTextNode(part));
}
function renderProse(text){
 const prose=element('div',undefined,'prose');
 for(const block of text.split(/\n\s*\n/).filter(value=>value.trim())){
  const heading=block.match(/^\*\*([^*]+)\*\*\s*([\s\S]*)$/);
  const content=heading?heading[2]:block;
  if(heading)prose.append(element('h4',heading[1].replace(/\.$/,'')));
  const lines=content.split('\n').filter(line=>line.trim());
  let list=null;
  for(const line of lines){
   if(/^[-*]\s+/.test(line)){
    if(!list){list=element('ul');prose.append(list)}
    const item=element('li');appendInlineContent(item,line.replace(/^[-*]\s+/,''));list.append(item);
   }else{
    list=null;const paragraph=element('p');appendInlineContent(paragraph,line);prose.append(paragraph);
   }
  }
 }return prose;
}
function renderFeatures(container,features){
 container.append(element('h2',state.category==='classes'?(state.child?'Здібності підкласу':'Здібності класу'):(state.child?'Риси гілки':'Риси'),'reading-title'));
 const tools=element('div',undefined,'tools');
 tools.append(button('Розгорнути всі',()=>container.querySelectorAll('details').forEach(item=>item.open=true)),button('Згорнути всі',()=>container.querySelectorAll('details').forEach(item=>item.open=false)));container.append(tools);
 let previousLevel=null,group=container;
 for(const feature of features){
  if(feature.level&&previousLevel!==feature.level){group=element('section',undefined,'feature-level');group.append(element('h3',feature.level+' рівень','level'));container.append(group);previousLevel=feature.level}
  const item=element('details');item.dataset.feature=featureKey(feature);
  item.append(element('summary',feature.name),renderProse(feature.description));group.append(item);
 }
}
function focusFeature(){
 if(!state.feature)return;
 const scope=state.reader?document.getElementById('reader-content'):document.getElementById('detail');
 const target=scope.querySelector('[data-feature="'+CSS.escape(state.feature)+'"]');if(!target)return;
 target.open=true;target.classList.add('feature-target');requestAnimationFrame(()=>{target.scrollIntoView({block:'start'});target.querySelector('summary').focus({preventScroll:true})});
}
function closeReader(){navigate({reader:false,child:'',feature:''})}
document.getElementById('close-reader').onclick=closeReader;
document.getElementById('back-reader').onclick=()=>navigate({child:'',feature:'',section:'children',reader:isMobile()});
reader.addEventListener('cancel',event=>{event.preventDefault();closeReader()});
for(const category of ['classes','races'])document.getElementById(category).onclick=()=>navigate({category,entity:getItems(category)[0].slug,section:'overview',child:'',feature:'',reader:false});
document.getElementById('edition').onchange=event=>{
 const edition=event.target.value,entity=data[state.category].find(item=>item.edition===edition);
 navigate({edition,entity:entity.slug,section:'overview',child:'',feature:'',reader:false});
};
const search=document.getElementById('search'),results=document.getElementById('results');
search.oninput=()=>{
 results.replaceChildren();const query=search.value.trim().toLowerCase();if(!query)return;
 for(const category of ['classes','races'])for(const entity of getItems(category)){
  const targets=[{name:entity.name,engName:entity.engName,child:'',feature:'',section:'overview',context:entity.engName},...entity.features.map(feature=>({...feature,child:'',feature:featureKey(feature),section:'features',context:entity.name})),...entity.children.flatMap(child=>[{name:child.name,engName:child.engName,child:child.slug,feature:'',section:'children',context:entity.name},...child.features.map(feature=>({...feature,child:child.slug,feature:featureKey(feature),section:'children',context:entity.name+' › '+child.name}))])];
  for(const target of targets){
   if(!(target.name+' '+target.engName).toLowerCase().includes(query))continue;
   const row=button('',()=>{results.replaceChildren();search.value='';navigate({category,entity:entity.slug,section:target.section,child:target.child,feature:target.feature,reader:Boolean(target.child)||isMobile()})});
   row.append(element('strong',target.name),element('br'),element('small',target.context));results.append(row);
  }
 }if(!results.children.length)results.append(element('p','У прикладах макета збігів немає.','muted'));
};
window.addEventListener('popstate',event=>{state=event.state??readAddress();render()});
writeAddress(true);render();
</script>
