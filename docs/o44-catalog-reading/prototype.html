влянням клірика, але не враховується до кількості відомих вам замовлянь клірика. Ви також отримуєте Володіння однією з таких навичок на свій вибір: Поводження з тваринами, Природа або Виживання."},{"level":2,"name":"Божественність: Зачарування звірів і рослин","engName":"Channel Divinity: Charm Animals and Plants","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб зачаровувати тварин і рослини.\n\nДією ви демонструєте свій священний символ і призиваєте імʼя свого божества. Кожен звір або рослинна істота, що може вас бачити в межах 30 футів від вас, мусить зробити ряткидок Мудрості. Якщо істота провалює ряткидок, вона зачарована вами на 1 хвилину або доки не зазнає шкоди. Поки вона зачарована вами таким чином, вона є дружньою до вас і до інших істот, яких ви визначите."},{"level":6,"name":"Глушення стихій","engName":"Dampen Elements","description":"Починаючи з 6 рівня, коли ви або істота в межах 30 футів від вас отримує шкоду кислотою, холодом, вогнем, блискавкою або громом, ви можете реакцією надати цій істоті опір до цього випадку шкоди."},{"level":8,"name":"Божественний удар (Природа)","engName":"Divine Strike (Nature)","description":"На 8 рівні раз за хід при влучанні зброєю ви додаєте 1к8 шкоди холодом, вогнем або блискавкою (обираєте при кожному влучанні). На 14 рівні — 2к8."},{"level":17,"name":"Владика природи","engName":"Master of Nature","description":"На 17 рівні ви здобуваєте здатність наказувати звірам і рослинним істотам. Поки істоти зачаровані вашою рисою Зачарування звірів і рослин, ви можете бонусною дією у свій хід усно наказати, що кожна з цих істот робитиме у свій наступний хід."}]},{"name":"Домен світла","engName":"Light Domain","slug":"light-domain","kind":"Підклас","description":"Боги світла уславлюють відродження й оновлення, правду, пильність і красу, часто під символом сонця. Одних зображують самим сонцем чи візничим, що веде його небом, інших — невтомними вартовими, чиї очі бачать крізь кожну тінь і кожен обман. Їхні жерці — просвітлені душі, сповнені сяйва й прозірливості своїх богів, покликані розвіювати брехню й випалювати темряву.","features":[{"level":1,"name":"Бонусне замовляння (Світло)","engName":"Bonus Cantrip (Light Domain)","description":"Коли на 1 рівні ви обираєте цей домен, ви отримуєте замовляння Світло [Light], якщо ще його не знаєте. Це замовляння не враховується до кількості відомих вам замовлянь клірика."},{"level":1,"name":"Заклинання домену (Світло)","engName":"Light Domain Spells","description":"1р. Палючі долоні [Burning Hands], Вогники фей [Faerie fire];\n3р. Палюча сфера [Flaming Sphere], Розпечений промінь [Scorching Ray];\n5р. Денне світло [Daylight], Вогнекуля [Fireball];\n7р. Вартовий віри [Guardian of Faith], Стіна вогню [Wall of Fire];\n9р. Полумʼяний удар [Flame Strike], Стеження [Scrying].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":1,"name":"Спалах захисника","engName":"Warding Flare","description":"Також на 1 рівні ви можете підставити божественне світло між собою та ворогом, що нападає. Коли істота в межах 30 футів від вас, яку ви бачите, атакує вас, ви можете реакцією накласти перешкоду на кидок атаки, змусивши світло спалахнути перед нападником до того, як атака влучить чи промахнеться. Нападник, якого неможливо засліпити, має імунітет до цієї риси.\n\nВи можете використати цю рису кількість разів, що дорівнює вашому модифікатору Мудрості (мінімум один раз). Ви відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":2,"name":"Божественність: Проміння світанку","engName":"Channel Divinity: Radiance of the Dawn","description":"Починаючи з 2 рівня, ви можете використати свій Виклик божественності, щоб приборкати сонячне світло, виганяючи темряву й завдаючи променевої шкоди вашим ворогам.\n\nДією ви демонструєте свій священний символ, і вся магічна темрява в межах 30 футів від вас розвіюється. Крім того, кожна ворожа істота в межах 30 футів від вас мусить зробити ряткидок Статури. Істота зазнає променевої шкоди, рівної 2к10 + ваш рівень клірика, якщо провалює ряткидок, або половину цієї шкоди в разі успіху. Істота, що має від вас повне укриття, не підпадає під цей ефект."},{"level":6,"name":"Покращений спалах","engName":"Improved Flare","description":"Починаючи з 6 рівня, ви також можете використовувати свою рису Спалах захисника, коли істота, яку ви бачите в межах 30 футів від вас, атакує істоту, що не є вами."},{"level":8,"name":"Потужне заклинання (Світло)","engName":"Potent Spellcasting (Light Domain)","description":"На 8 рівні додаєте модифікатор Мудрості до шкоди від ваших замовлянь клірика."},{"level":17,"name":"Корона світла","engName":"Corona of Light","description":"Починаючи з 17 рівня, ви можете Дією активувати ауру сонячного світла, яка триває 1 хвилину або доки ви не розвієте її іншою дією. Ви випромінюєте яскраве світло в радіусі 60 футів і тьмяне світло ще на 30 футів понад цей радіус. Ваші вороги в межах яскравого світла мають перешкоду на ряткидки проти будь-якого заклинання, що завдає вогняної або променевої шкоди."}]},{"name":"Домен смерті","engName":"Death Domain","slug":"death-domain","kind":"Підклас","description":"Домен смерті повʼязаний із силами, що несуть смерть, і з негативною енергією, яка породжує нежить. Його божества опікуються некромантами, лицарями смерті, лічами, лордами мумій і вампірами. Боги цього домену також уособлюють убивство, біль, хвороби й отрути та підземний світ мертвих.","features":[{"level":1,"name":"Додаткові майстерності (Смерть)","engName":"Bonus Proficiency (Death Domain)","description":"На 1 рівні ви отримуєте Володіння бойовою зброєю."},{"level":1,"name":"Жнець","engName":"Reaper","description":"На 1 рівні ви вивчаєте одне некромантське замовляння на свій вибір із будь-якого списку заклинань. Коли ви накладаєте некромантське замовляння, що зазвичай цілить лише одну істоту, заклинання може натомість націлити двох істот у межах дальності та в межах 5 футів одна від одної."},{"level":1,"name":"Заклинання домену (Смерть)","engName":"Death Domain Spells","description":"1р. Удаване життя [False life], Промінь хвороби [Ray of Sickness];\n3р. Сліпота/глухота [Blindness/Deafness], Промінь ослаблення [Ray of Enfeeblement];\n5р. Підіймання мерців [Animate dead], Вампіричний дотик [Vampiric Touch];\n7р. Усихання [Blight], Захист від смерті [Death Ward];\n9р. Оболонка проти живих [Antilife shell], Вбивча хмара [Cloudkill].\n\nЗаклинання домену завжди підготовлені для вас і не рахуються до ліміту підготовлених."},{"level":2,"name":"Божественність: Дотик смерті","engName":"Channel Divinity: Touch of Death","description":"На 2 рівні, коли ви влучаєте по істоті рукопашною атакою, можете витратити Виклик божественності, щоб додати некротичної шкоди, рівної 5 + подвоєний ваш рівень клірика."},{"level":6,"name":"Невідворотне знищення","engName":"Inescapable Destruction","description":"Починаючи з 6 рівня, ваша здатність спрямовувати негативну енергію стає потужнішою. Некротична шкода, яку завдають ваші заклинання клірика й варіанти Виклику божественності, ігнорує опір до некротичної шкоди."},{"level":8,"name":"Божественний удар (Смерть)","engName":"Divine Strike (Death)","description":"На 8 рівні раз за хід, коли ви влучаєте атакою зброєю, додаєте 1к8 некротичної шкоди. На 14 рівні — 2к8."},{"level":17,"name":"Удосконалений жнець","engName":"Improved Reaper","description":"Починаючи з 17 рівня, коли ви накладаєте некромантське заклинання 1–5 рівня, що цілить лише одну істоту, заклинання може натомість націлити двох істот у межах дальності та в межах 5 футів одна від одної. Якщо заклинання споживає матеріальні компоненти, ви мусите надати їх для кожної цілі."}]},{"name":"Домен сутінків","engName":"Twilight Domain","slug":"twilight-domain","kind":"Підклас","description":"Перехід від світла до темряви часто приносить спокій і навіть радість: денна праця скінчилася, настають години відпочинку. Темрява може нести й жахи, але боги сутінків захищають від нічних страхіть. Їхні жерці дають розраду тим, хто шукає спочинку, і вирушають назустріч темряві, що насувається, аби вона була втіхою, а не жахом.","features":[{"level":1,"name":"Благословення пильності","engName":"Vigilant Blessing","description":"На 1 рівні ніч навчила вас пильності. Дією ви надаєте одній істоті, якої торкаєтеся (це можете бути й ви), перевагу на наступний кидок ініціативи, який вона зробить. Ця перевага негайно зникає після кидка або якщо ви знову використаєте цю рису."},{"level":1,"name":"Додаткові майстерності (Присмерк)","engName":"Bonus Proficiencies (Twilight Domain)","description":"На 1 рівні ви отримуєте володіння бойовою зброєю та важкими обладунками."},{"level":1,"name":"Заклинання домену (Присмерк)","engName":"Twilight Domain Spells","description":"1р. Вогники фей [Faerie fire], Сон [Sleep];\n3р. Місячний промінь [Moonbeam], Бачення невидимого [See Invisibility];\n5р. Аура живучості [Aura of Vitality], Леомундова крихітна хатинка [Leomund's Tiny Hut];\n7р. Аура життя [Aura of Life], Більша невидимість [Greater Invisibility];\n9р. Коло сили [Circle of Power], Ошуканство [Mislead].\n\nЗаклинання домену завжди підготовлені й не рахуються до ліміту."},{"level":1,"name":"Очі ночі","engName":"Eyes of Night","description":"Починаючи з 1 рівня, ви здатні бачити крізь найгустішу пітьму. Ви маєте темнозір у радіусі 300 футів. У цих межах ви бачите в тьмяному світлі так, ніби це яскраве світло, а в темряві — так, ніби це тьмяне світло.\n\nДією ви можете магічно поділитися темнозором цієї риси з добровільними істотами, яких бачите в межах 10 футів від себе, у кількості до вашого модифікатора Мудрості (мінімум одна істота). Наданий темнозір триває 1 годину. Після цього ви не можете зробити це знову, доки не завершите тривалий відпочинок, якщо не витратите слот заклинання будь-якого рівня, щоб поділитися темнозором повторно."},{"level":2,"name":"Божественність: Святилище присмерку","engName":"Channel Divinity: Twilight Sanctuary","description":"На 2 рівні ви можете використати свій Виклик божественності, щоб освіжити союзників заспокійливими сутінками.\n\nДією ви демонструєте свій священний символ, і від вас розходиться сфера сутінків. Сфера має центр у вас, радіус 30 футів і заповнена тьмяним світлом. Вона рухається разом із вами та триває 1 хвилину або доки ви не станете недієздатним чи не помрете.\n\nЩоразу, коли істота (включно з вами) завершує свій хід у сфері, ви можете надати їй один із таких ефектів:\n\n• Істота отримує тимчасові хіти, рівні 1к6 + ваш рівень клірика.\n• Ви завершуєте один ефект, що робить її причарованою або наляканою."},{"level":6,"name":"Кроки ночі","engName":"Steps of Night","description":"Починаючи з 6 рівня, ви можете черпати містичну силу ночі, щоб здійматися в повітря. Бонусною дією, коли ви перебуваєте в тьмяному світлі або темряві, ви магічно надаєте собі швидкість польоту, рівну вашій швидкості ходи, на 1 хвилину.\n\nВи можете використати цю бонусну дію кількість разів, що дорівнює вашому бонусу майстерності, і відновлюєте всі витрачені використання після тривалого відпочинку."},{"level":8,"name":"Божественний удар (Присмерк)","engName":"Divine Strike (Twilight)","description":"На 8 рівні ви здобуваєте здатність насичувати удари зброєю божественною енергією. Один раз у кожному своєму ході, коли ви влучаєте по істоті атакою зброєю, ви можете завдати цій атаці ще 1к8 променевої шкоди. Коли ви досягаєте 14 рівня, ця додаткова шкода зростає до 2к8."},{"level":17,"name":"Покров опівночі","engName":"Midnight Shroud","description":"На 17 рівні, коли ви активуєте Святилище присмерку, можете огорнути вибраних істот тьмою: до кінця дії аури істоти, яких ви обрали, мають ефект «невидимі для темнозору» — вороги не бачать їх навіть із темнозором, якщо інше світло відсутнє."}]}]},{"edition":"2014","name":"Чарівник","engName":"Wizard","slug":"wizard","description":"Чарівники — неперевершені знавці магії, яких визначають і обʼєднують заклинання, що вони накладають. Черпаючи з магії, що пронизує космос, чарівники творять вибуховий вогонь, дугові блискавки, тонкий обман і грубе підкорення розуму. Їхня магія викликає чудовиськ з інших планів існування, зазирає в майбутнє чи обертає полеглих ворогів на нежить.\n\nСила магії, дика й загадкова, вабить учнів, що прагнуть осягнути її таємниці. За кількома дивними словами, швидкими жестами й щепоткою рідкісних матеріалів ховаються роки учнівства й незліченні години навчання. Чарівники живуть і гинуть завдяки своїм заклинанням — усе інше другорядне.\n\nНайближче до звичайного життя чарівник підходить, працюючи мудрецем чи викладачем у бібліотеці або університеті. Але поклик знань і сили виманює навіть найдомосідливіших чарівників із бібліотек і лабораторій у руїни, що розсипаються, і втрачені міста, де ховаються забуті таємниці магії.","facts":["Кістка хітів: к6","Підклас з 2 рівня","13 підкласів"],"features":[{"level":1,"name":"Магічне відновлення","engName":"Arcane Recovery","description":"Починаючи з 1 рівня, ви навчаєтеся відновлювати частину магічної енергії. Після короткого відпочинку виберіть поєднання слотів заклинань, рівень яких у сумі не перевищує половину вашого рівня чарівника (округлено вгору), і відновіть їх. Слоти 6 рівня і вище не можуть бути відновлені."},{"level":1,"name":"Чаротворство (Чарівник)","engName":"Spellcasting (Wizard)","description":"Як студент арканної магії, ви маєте книгу заклинань, у якій зібрані заклинання — перші проблиски вашої справжньої сили.\n\n**Замовляння**\nНа 1 рівні ви знаєте три замовляння на вибір зі списку заклинань чарівника. На вищих рівнях ви вивчаєте додаткові замовляння чарівника на вибір, як показано в колонці «Відомі замовляння» таблиці Чарівника.\n\n**Книга заклинань**\nНа 1 рівні ви маєте книгу заклинань, що містить шість заклинань чарівника 1 рівня на ваш вибір. Ваша книга заклинань — це сховище заклинань чарівника, які ви знаєте, за винятком замовлянь, що назавжди закарбовані у вашій памʼяті.\n\nЗаклинання, які ви додаєте до книги заклинань, підвищуючи рівні, відображають арканні дослідження, які ви проводите самостійно, а також інтелектуальні прориви, що підказують вам нові істини про природу мультивсесвіту. У пригодах ви можете знаходити інші заклинання. Наприклад, ви можете натрапити на заклинання, записане на сувої в скрині лихого чарівника, або в запиленому томі в давній бібліотеці.\n\n**Переписування заклинання до книги**\nКоли ви знаходите заклинання чарівника 1 рівня або вище, ви можете додати його до книги заклинань, якщо воно має рівень, який ви можете підготувати, і якщо ви можете виділити час, щоб розібрати запис і переписати його.\n\nПереписування заклинання до книги заклинань означає: відтворити базову форму заклинання, потім розібратися з унікальною системою позначень чарівника, що його записав. Ви маєте практикувати заклинання, доки не зрозумієте потрібні звуки чи жести, а тоді занести його до книги заклинань у власній нотації.\n\nЗа кожен рівень заклинання цей процес триває 2 години і коштує 50 зм. Вартість відображає матеріальні компоненти, які ви витрачаєте, експериментуючи із заклинанням, щоб опанувати його, а також тонкі чорнила, потрібні для запису. Після того як ви витратите цей час і гроші, ви можете підготувати заклинання так само, як і решту своїх заклинань.\n\n**Заміна книги**\nВи можете переписати заклинання зі своєї книги заклинань до іншої книги — наприклад, якщо хочете зробити запасну копію книги заклинань. Це відбувається так само, як і додавання нового заклинання до книги заклинань, але швидше й простіше, адже ви розумієте власну нотацію і вже вмієте накладати це заклинання. Вам потрібно витратити лише 1 годину і 10 зм за кожен рівень переписуваного заклинання.\n\nЯкщо ви втратите книгу заклинань, ви можете скористатися тією ж процедурою, щоб занести до нової книги заклинання, які ви підготували. Щоб заповнити решту книги заклинань, вам, як зазвичай, доведеться знаходити нові заклинання. Саме тому багато чарівників зберігають запасні книги заклинань у безпечному місці.\n\n**Вигляд книги**\nВаша книга заклинань — унікальна збірка заклинань із власними декоративними елементами й примітками на полях. Це може бути проста, практична шкіряна книга, яку ви отримали в подарунок від наставника; розкішний позолочений том, знайдений у давній бібліотеці; або навіть розрізнені нотатки, нашвидкуруч зібрані після того, як ви втратили попередню книгу заклинань через прикру пригоду.\n\n**Підготовка та накладання заклинань**\nТаблиця Чарівника показує, скільки у вас є слотів заклинань, щоб накладати заклинання чарівника 1 рівня і вище. Щоб накласти одне з цих заклинань, ви повинні витратити слот відповідного рівня або вищого. Ви відновлюєте всі витрачені слоти заклинань, коли завершуєте тривалий відпочинок.\n\nВи готуєте список заклинань чарівника, доступних для накладання. Для цього виберіть зі своєї книги заклинань кількість заклинань чарівника, що дорівнює вашому модифікатору Інтелекту + ваш рівень чарівника (мінімум одне заклинання). Заклинання мають бути рівня, для якого у вас є слоти заклинань.\n\nНаприклад, якщо ви чарівник 3 рівня, у вас є чотири слоти 1 рівня і два слоти 2 рівня. Маючи Інтелект 16, ви можете підготувати шість заклинань 1 або 2 рівня у будь-якому поєднанні, обраних із вашої книги заклинань. Якщо серед підготовлених заклинань є Магічний дротик [Magic missile], ви можете накласти його, витративши слот 1 або 2 рівня. Накладання заклинання не вилучає його зі списку підготовлених заклинань.\n\nВи можете змінювати список підготовлених заклинань, коли завершуєте тривалий відпочинок. Підготовка нового списку заклинань чарівника потребує часу на вивчення книги заклинань і запамʼятовування заклять та жестів, потрібних для накладання: щонайменше 1 хвилина за кожен рівень заклинання для кожного заклинання зі списку.\n\n**Характеристика заклинань**\nІнтелект є вашою характеристикою заклинань чарівника, адже ви вивчаєте заклинання через віддане навчання та запамʼятовування. Ви використовуєте Інтелект, коли заклинання посилається на вашу характеристику заклинань. Крім того, ви додаєте ваш модифікатор Інтелекту, визначаючи СК ряткидку проти заклинання чарівника, яке ви накладаєте, та роблячи кидок атаки заклинанням.\n\nСК ряткидку заклинань = 8 + Бонус Майстерності (БМ) + модифікатор Інтелекту\nМодифікатор атаки заклинаннями = БМ + модифікатор Інтелекту\n\n**Ритуальне накладання**\nВи можете накласти заклинання чарівника як ритуал, якщо воно має позначку «ритуал» і ви маєте це заклинання у своїй книзі заклинань. Вам не потрібно мати його підготовленим.\n\n**Чаротворчий фокус**\nВи можете використовувати арканний фокус як чаротворчий фокус для ваших заклинань чарівника.\n\n**Вивчення заклинань 1 рівня і вище**\nКожного разу, коли ви отримуєте рівень чарівника, ви можете додати два заклинання чарівника на вибір до своєї книги заклинань. Кожне з цих заклинань має бути рівня, для якого у вас є слоти заклинань, як показано в таблиці Чарівника. У пригодах ви можете знаходити й інші заклинання, які можна додати до книги заклинань."},{"level":2,"name":"Арканна традиція","engName":"Arcane Tradition","description":"На 2 рівні ви обираєте арканну традицію, що відображає вашу магічну спеціалізацію. Ваша традиція надає вам особливі здібності на 2, 6, 10 та 14 рівнях."},{"level":18,"name":"Майстерність заклинань","engName":"Spell Mastery","description":"На 18 рівні ви вибираєте заклинання чарівника 1 і 2 рівнів, які ви можете накладати без витрати слотів заклинань, коли вони підготовлені. Ви можете змінити вибрані заклинання після тривалого відпочинку, присвятивши 8 годин їхньому вивченню."},{"level":20,"name":"Підписні заклинання","engName":"Signature Spells","description":"На 20 рівні ви обираєте два заклинання чарівника 3 рівня як свої підписні. Вони завжди підготовлені і не зараховуються до остаточного числа підготованих заклинань. Ви можете накладати кожне з них один раз без витрати слотів, відновлюючи таку можливість після короткого або тривалого відпочинку. Ви можете витрачати слоти, щоб накладати їх знову, як звичайно."}],"children":[{"name":"Орден писарів","engName":"Order of Scribes","slug":"order-of-scribes","kind":"Підклас","description":"Чарівництво часто називають магією книги — і недарма: чарівники годинами сидять над томами й записують теорії про природу магії. Орден писарів — найкнижніший серед них: у різних світах він має різний вигляд, але скрізь записує магічні відкриття, щоб чарівництво квітло. Кожен чарівник цінує книгу заклинань, та лише писар магією пробуджує свою й робить її надійним супутником.","features":[{"level":2,"name":"Пробуджена книга заклять","engName":"Awakened Spellbook","description":"Використовуючи особливі чорнила та давні заклинання, передані вашим орденом, ви пробудили арканну свідомість у своїй книзі заклять.\n\nНа 2 рівні, поки ви тримаєте цю книгу, вона надає вам такі переваги:\n• Ви можете використовувати книгу як осередок чаротворення для заклять чарівника.\n• Коли ви накладаєте закляття чарівника, використовуючи чарослот, ви можете тимчасово замінити тип його шкоди на тип, який трапляється в іншому заклятті у вашій книзі заклять. Це магічно змінює формулу закляття лише для цього накладання. Інше закляття мусить бути того самого рівня, що й чарослот, який ви витрачаєте.\n• Коли ви накладаєте закляття чарівника як ритуал, ви можете використати його звичайний час накладання замість того, щоб додавати до нього 10 хвилин. Скориставшись цією перевагою, ви не можете зробити цього знову, доки не завершите тривалий відпочинок.\n\nЗа потреби ви можете замінити книгу впродовж короткого відпочинку, використовуючи своє Чарописне перо, щоб написати арканні знаки в порожній книзі або магічній книзі заклять, з якою ви налаштовані. Наприкінці відпочинку свідомість вашої книги заклять переходить у нову книгу, перетворюючи її на вашу книгу заклять разом з усіма закляттями. Якщо попередня книга все ще існувала десь, усі закляття зникають з її сторінок."},{"level":2,"name":"Чарописне перо","engName":"Wizardly Quill","description":"На 2 рівні ви можете бонусною дією магічно створити Крихітне перо у своїй вільній руці. Це магічне перо має такі властивості:\n• Перо не потребує чорнила. Коли ви пишете ним, воно створює на поверхні для письма чорнило вибраного вами кольору.\n• Час, який ви мусите витратити, щоб переписати закляття до своєї книги заклять, становить 2 хвилини за кожен рівень закляття, якщо ви використовуєте це перо для переписування.\n• Ви можете стерти все, що написали цим пером, якщо бонусною дією проведете ним над текстом, за умови, що текст перебуває в межах 5 футів від вас.\n\nЦе перо зникає, якщо ви створюєте інше або якщо ви помираєте."},{"level":6,"name":"Утілений розум","engName":"Manifest Mind","description":"На 6 рівні ви можете прикликати розум своєї Пробудженої книги заклять. Бонусною дією, поки книга перебуває при вас, ви можете змусити цей розум утілитися як Крихітний спектральний предмет, що ширяє в незайнятому просторі на ваш вибір у межах 60 футів від вас. Спектральний розум є безтілесним, не займає свій простір і випромінює тьмяне світло в радіусі 10 футів. Він може виглядати як примарний фоліант, потік тексту або вчений з минулого — на ваш вибір.\n\n      Поки він утілений, спектральний розум може бачити й чути та має темнозір у межах 60 футів. Розум може телепатично ділитися з вами тим, що бачить і чує (дії не потрібно).\n\n      Щоразу, коли у свій хід ви накладаєте закляття чарівника, ви можете накласти його так, ніби перебуваєте в просторі спектрального розуму, а не у власному, використовуючи його чуття. Ви можете зробити це кількість разів на день, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку.\n\n      Бонусною дією ви можете змусити спектральний розум перелетіти на відстань до 30 футів у незайнятий простір, який бачите ви або він. Він може проходити крізь створінь, але не крізь предмети.\n\n      Спектральний розум припиняє бути втіленим, якщо коли-небудь віддаляється від вас більш як на 300 футів, якщо хтось накладає на нього Розвіювання магії [Dispel Magic], якщо Пробуджену книгу заклять знищено, якщо ви помираєте або якщо ви відкидаєте спектральний розум бонусною дією.\n\n      Після того як ви прикличете цей розум, ви не можете зробити цього знову, доки не завершите тривалий відпочинок, якщо тільки не витратите чарослот будь-якого рівня, щоб прикликати його знову."},{"level":10,"name":"Майстер-переписувач","engName":"Master Scrivener","description":"На 10 рівні щоразу, коли ви завершуєте тривалий відпочинок, ви можете створити один магічний сувій, торкнувшись своїм Чарописним пером чистого аркуша паперу або пергаменту й змусивши одне закляття з Пробудженої книги заклять переписатися на сувій. Під час створення сувою книга заклять мусить перебувати в межах 5 футів від вас.\n\nОбране закляття мусить бути 1 або 2 рівня і мати час накладання 1 дія. Потрапивши в сувій, сила закляття посилюється, і воно вважається закляттям на один рівень вищим, ніж зазвичай. Ви можете накласти це закляття із сувою, прочитавши його дією. Для будь-кого іншого сувій є незрозумілим, а закляття зникає з нього, коли ви його накладаєте або коли завершуєте свій наступний тривалий відпочинок.\n\nВи також уміло створюєте сувої заклять. Якщо ви використовуєте своє Чарописне перо, час і золото, які ви мусите витратити на створення такого сувою, зменшуються вдвічі."},{"level":14,"name":"Єдиний зі Словом","engName":"One with the Word","description":"На 14 рівні ваш звʼязок із Пробудженою книгою заклять стає таким глибоким, що ваша душа переплітається з нею. Поки книга перебуває при вас, ви маєте перевагу на всі перевірки Інтелекту (Магія), адже книга допомагає вам пригадувати магічні знання.\n\nКрім того, якщо ви зазнаєте шкоди, поки розум вашої книги заклять утілений, ви можете запобігти всій цій шкоді для себе, використавши реакцію, щоб відкинути спектральний розум і скористатися його магією для власного порятунку. Після цього киньте 3к6. Книга заклять тимчасово втрачає вибрані вами закляття із сумарним рівнем заклять, що дорівнює або перевищує випале число. Якщо в книзі недостатньо заклять, щоб покрити цю ціну, ви падаєте до 0 хітів.\n\nДоклавши 1к6 тривалих відпочинків, ви не здатні накладати втрачені закляття, навіть якщо знайдете їх на сувої чи в іншій книзі заклять. Після того як ви завершите потрібну кількість відпочинків, закляття знову зʼявляться у книзі.\n\nСкориставшись цією реакцією, ви не можете зробити цього знову, доки не завершите тривалий відпочинок."}]},{"name":"Школа бойової магії","engName":"School of War Magic","slug":"school-of-war-magic","kind":"Підклас","description":"Чимало магічних колегій готує чарівників до війни. Традиція бойової магії поєднує засади втілення й огородження, не віддаючи переваги жодній: вона підсилює заклинання й водночас зміцнює захист самого чарівника. Бойові маги вважають магію і зброєю, і обладунком, кращим за будь-яку сталь: вони діють швидко, беруть бій під контроль і вміють обертати магію інших заклинателів проти них самих.","features":[{"level":2,"name":"Арканне відхилення","engName":"Arcane Deflection","description":"На 2 рівні ви навчилися вплітати свою магію в захист від шкоди. Коли по вас влучає атака або ви провалюєте рятівний кидок, ви можете використати свою реакцію, щоб отримати бонус +2 до КБ проти цієї атаки або бонус +4 до цього рятівного кидка.\n\nКоли ви використовуєте цю рису, ви не можете накладати закляття, окрім замовлянь, до кінця свого наступного ходу."},{"level":2,"name":"Тактична кмітливість","engName":"Tactical Wit","description":"Починаючи з 2 рівня, ваша проникливість у тактичних обставинах дає вам змогу діяти в бою швидше. Ви можете додавати свій модифікатор Інтелекту до кидків ініціативи."},{"level":6,"name":"Сплеск сили","engName":"Power Surge","description":"Починаючи з 6 рівня, ви можете зберігати магічну енергію в собі, щоб пізніше підсилювати нею свої закляття, які завдають шкоди.\n\nВи можете зберігати максимальну кількість сплесків сили, що дорівнює вашому модифікатору Інтелекту (мінімум один). Щоразу, коли ви завершуєте тривалий відпочинок, ваша кількість сплесків сили скидається до одного. Щоразу, коли ви успішно завершуєте закляття за допомогою Розвіювання магії [Dispel Magic] або Контрчари [Counterspell], ви отримуєте один сплеск сили, ніби крадете магію у зірваного закляття. Якщо ви завершуєте короткий відпочинок без жодного сплеску сили, то отримуєте один сплеск сили.\n\nОдин раз за хід, коли ви завдаєте шкоди створінню або предмету закляттям чарівника, ви можете витратити один сплеск сили, щоб завдати цій цілі додаткової силової шкоди. Ця додаткова шкода дорівнює половині вашого рівня чарівника."},{"level":10,"name":"Стійка магія","engName":"Durable Magic","description":"Починаючи з 10 рівня, магія, яку ви спрямовуєте, допомагає вам відбивати шкоду. Поки ви підтримуєте концентрацію на заклятті, ви маєте бонус +2 до КБ і до всіх рятівних кидків."},{"level":14,"name":"Завіса відхилення","engName":"Deflecting Shroud","description":"На 14 рівні ваше Арканне відхилення наповнюється смертоносною магією. Коли ви використовуєте рису Арканне відхилення, ви можете спричинити спалах магічної енергії, що зірветься від вас. До трьох створінь на ваш вибір у межах 60 футів від себе кожне зазнає силової шкоди, що дорівнює половині вашого рівня чарівника."}]},{"name":"Школа віщування","engName":"School of Divination","slug":"school-of-divination","kind":"Підклас","description":"Поради віщуна шукають і королі, і прості люди, бо всі прагнуть ясніше бачити минуле, теперішнє й майбутнє. Віщун намагається розсунути завіси простору, часу й свідомості, щоб бачити чітко, й опановує заклинання розпізнавання, віддаленого бачення, надприродного знання й передбачення.","features":[{"level":2,"name":"Знавець ворожіння","engName":"Divination Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Ворожіння до своєї книги заклять, зменшуються вдвічі."},{"level":2,"name":"Провіщення","engName":"Portent","description":"Починаючи з 2 рівня, проблиски майбутнього починають прориватися у вашу свідомість. Коли ви завершуєте тривалий відпочинок, киньте два к20 і запишіть випалі числа. Ви можете замінити будь-який кидок атаки, рятівний кидок або перевірку здібності, зроблені вами чи створінням, яке ви бачите, одним із цих передбачених кидків. Ви мусите вирішити це до самого кидка, і таким способом можна замінити лише один кидок за хід.\n\n      Кожен передбачений кидок можна використати лише один раз. Коли ви завершуєте тривалий відпочинок, усі невикористані передбачені кидки втрачаються."},{"level":6,"name":"Майстер провидіння","engName":"Expert Divination","description":"Починаючи з 6 рівня, накладати закляття школи Ворожіння для вас так легко, що вони забирають лише частку ваших зусиль до чаклування. Коли ви накладаєте закляття школи Ворожіння 2 рівня чи вище, використовуючи чарослот, ви відновлюєте один витрачений чарослот. Чарослот, який ви відновлюєте, мусить бути нижчого рівня, ніж закляття, яке ви наклали, і не може бути вищим за 5 рівень."},{"level":10,"name":"Третє око","engName":"The Third Eye","description":"Починаючи з 10 рівня, ви можете використати свою дію, щоб посилити свою сприйнятливість. Коли ви робите це, оберіть одну з таких переваг, яка триває, доки ви не станете Недієздатні або не завершите короткий чи тривалий відпочинок. Ви не можете скористатися цією рисою знову, доки не завершите короткий або тривалий відпочинок.\n\n*Темнозір.* Ви отримуєте темнозір у межах 60 футів.\n*Ефірний зір.* Ви можете бачити в Ефірний План у межах 60 футів від себе.\n*Поглиблене розуміння.* Ви можете читати будь-якою мовою.\n*Бачення невидимого.* Ви можете бачити невидимих створінь і предмети в межах 10 футів від себе, якщо вони перебувають у межах вашої прямої видимості."},{"level":14,"name":"Велике провіщення","engName":"Greater Portent","description":"Починаючи з 14 рівня, видіння у ваших снах посилюються і малюють у вашій свідомості точнішу картину майбутнього. Для риси Провіщення ви кидаєте три к20 замість двох."}]},{"name":"Школа втілення","engName":"School of Evocation","slug":"school-of-evocation","kind":"Підклас","description":"Чарівник школи втілення вивчає магію, що творить потужні стихійні ефекти: лютий холод, палюче полумʼя, гуркітливий грім, тріскучі блискавки й пекучу кислоту. Одні такі чарівники служать у війську, мов артилерія, що громить ворожі армії здалеку. Інші захищають слабких, а дехто шукає власної вигоди як розбійник, шукач пригод чи майбутній тиран.","features":[{"level":2,"name":"Знавець втілення","engName":"Evocation Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Втілення до своєї книги заклять, зменшуються вдвічі."},{"level":2,"name":"Ліплення заклять","engName":"Sculpt Spells","description":"Починаючи з 2 рівня, ви можете створювати відносно безпечні осередки всередині ефектів своїх заклять школи Втілення. Коли ви накладаєте закляття школи Втілення, яке впливає на інших створінь, яких ви бачите, ви можете обрати кількість із них, що дорівнює 1 + рівень закляття. Обрані створіння автоматично успішно проходять рятівні кидки проти цього закляття і не зазнають шкоди, якщо зазвичай при успішному ряткидку отримували б половину шкоди."},{"level":6,"name":"Потужне замовляння","engName":"Potent Cantrip (Evocation)","description":"Починаючи з 6 рівня, ваші замовляння, що завдають шкоди, впливають навіть на створінь, які уникають основної сили ефекту. Коли створіння успішно проходить рятівний кидок проти вашого замовляння, воно зазнає половини шкоди від цього замовляння (якщо така є), але не зазнає жодного додаткового ефекту від нього."},{"level":10,"name":"Підсилене втілення","engName":"Empowered Evocation","description":"Починаючи з 10 рівня, ви можете додавати свій модифікатор Інтелекту (мінімум +1) до одного кидка шкоди будь-якого закляття чарівника школи Втілення, яке ви накладаєте."},{"level":14,"name":"Надзаряд","engName":"Overchannel","description":"Починаючи з 14 рівня, ви можете збільшувати силу своїх простіших заклять. Коли ви накладаєте закляття чарівника від 1 до 5 рівня, яке завдає шкоди, ви можете змусити це закляття завдати максимально можливої шкоди.\n\nПерший раз, коли ви робите це, ви не зазнаєте жодних шкідливих наслідків. Якщо ж ви знову скористаєтеся цією рисою до завершення тривалого відпочинку, то одразу після накладання закляття зазнаєте 2к12 некротичної шкоди за кожен рівень закляття. Кожного разу, коли ви знову використовуєте цю рису до завершення тривалого відпочинку, некротична шкода за рівень закляття збільшується на 1к12. Ця шкода ігнорує опір і імунітет."}]},{"name":"Школа гравітургії","engName":"School of Graviturgy","slug":"school-of-graviturgy","kind":"Підклас","description":"Учні традиції гравітургії осягають і підкоряють сили, що притягують тіла одне до одного чи розштовхують їх. Вони вчаться гнути й спрямовувати бурхливу енергію тяжіння собі на користь — і на страшну шкоду ворогам.","features":[{"level":2,"name":"Регулювання густини","engName":"Adjust Density","description":"На 2 рівні ви можете дією магічно змінити вагу одного предмета або створіння, яке бачите в межах 30 футів від себе. Предмет або створіння мусить бути Великим чи меншим. Вага цілі зменшується вдвічі або подвоюється на час до 1 хвилини або доки не закінчиться ваша концентрація (ніби ви концентруєтеся на заклятті).\n\nПоки вага створіння зменшена вдвічі цим ефектом, його швидкість збільшується на 10 футів, воно може стрибати вдвічі далі, ніж зазвичай, і має перешкоду на перевірки Сили та рятівні кидки Сили.\n\nПоки вага створіння подвоєна цим ефектом, його швидкість зменшується на 10 футів, а також воно має перевагу на перевірки Сили та рятівні кидки Сили.\n\nДосягнувши 10 рівня в цьому класі, ви можете цілити предмет або створіння, що є Величезним чи меншим."},{"level":6,"name":"Гравітаційна криниця","engName":"Gravity Well","description":"Коли ви досягаєте 6 рівня, щоразу, коли ви накладаєте закляття на створіння, ви можете перемістити ціль на 5 футів у вільний простір на свій вибір, якщо це створіння згодне рухатися, якщо закляття влучає по ньому атакою або якщо воно провалює рятівний кидок проти цього закляття."},{"level":10,"name":"Бурхливе тяжіння","engName":"Violent Attraction","description":"На 10 рівні, коли інше створіння, яке ви бачите в межах 60 футів від себе, влучає атакою зброєю, ви можете використати свою реакцію, щоб збільшити швидкість удару, через що ціль цієї атаки зазнає додаткової шкоди 1к10 того типу, що й зброя.\n\nАбо ж, якщо створіння в межах 60 футів від себе зазнає шкоди від падіння, ви можете використати свою реакцію, щоб збільшити цю шкоду на 2к10.\n\nВи можете скористатися цією рисою кількість разів, що дорівнює вашому модифікатору Інтелекту (мінімум один раз), і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":14,"name":"Горизонт подій","engName":"Event Horizon","description":"На 14 рівні Дією створюєте гравітаційну ауру 30 фт на 1 хв (концентрація). Ворожі істоти, що починають хід у ній, роблять ряткидок Сили: при провалі 2к10 силової шкоди та швидкість 0 до початку їхнього наступного ходу; при успіху половина шкоди, і кожен фут руху коштує додаткові 2 фути цього ходу. Використання відновлюється після тривалого відпочинку або витрати чарослоту 3 рівня чи вище."}]},{"name":"Школа заклику","engName":"School of Conjuration","slug":"school-of-conjuration","kind":"Підклас","description":"Чарівник школи заклику надає перевагу заклинанням, що творять речі й істот буквально з повітря: хмари смертоносного туману чи створінь з інших місць, які бʼються за нього. З майстерністю він опановує заклинання переміщення й за мить телепортується на величезні відстані — навіть на інші плани буття.","features":[{"level":2,"name":"Дрібна матеріалізація","engName":"Minor Conjuration","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, ви можете використати свою дію, щоб викликати неживий предмет у своїй руці або на землі у вільному просторі, який бачите в межах 10 футів від себе. Цей предмет не може бути більшим за 3 фути з боку і важити більш як 10 фунтів, а його форма мусить бути формою немагічного предмета, який ви бачили. Предмет є помітно магічним і випромінює тьмяне світло в радіусі 5 футів.\n\nПредмет зникає через 1 годину, коли ви знову використовуєте цю рису або якщо він завдає чи отримує будь-яку шкоду."},{"level":2,"name":"Знавець виклику","engName":"Conjuration Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Виклику до своєї книги заклять, зменшуються вдвічі."},{"level":6,"name":"Доброзичлива транспозиція","engName":"Benign Transposition","description":"Починаючи з 6 рівня, ви можете використати свою дію, щоб телепортуватися на відстань до 30 футів у незайнятий простір, який бачите. Або ж ви можете обрати простір у межах дистанції, зайнятий Малою чи Середньою істотою. Якщо це створіння згодне, ви обоє телепортуєтеся, міняючись місцями.\n\n      Після використання цієї риси ви не можете скористатися нею знову, доки не завершите тривалий відпочинок або не накладете закляття школи Виклику 1 рівня чи вище."},{"level":10,"name":"Сфокусований виклик","engName":"Focused Conjuration","description":"Починаючи з 10 рівня, поки ви концентруєтеся на заклятті школи Виклику, вашу концентрацію не може порушити зазнана вами шкода."},{"level":14,"name":"Стійкі заклики","engName":"Durable Summons","description":"Починаючи з 14 рівня, будь-яке створіння, яке ви викликаєте або створюєте закляттям школи Виклику, має 30 тимчасових хітів."}]},{"name":"Школа ілюзії","engName":"School of Illusion","slug":"school-of-illusion","kind":"Підклас","description":"Чарівник школи ілюзії вивчає магію, що засліплює чуття, затьмарює розум і ошукує навіть наймудріших. Ця магія тонка, але ілюзії, створені гострим розумом, роблять неможливе справжнім. Одні ілюзіоністи — зокрема чимало гномів — добродушні жартівники, що розважають інших, а інші — підступні майстри обману, що лякають і дурять заради власної вигоди.","features":[{"level":2,"name":"Знавець ілюзії","engName":"Illusion Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Ілюзії до своєї книги заклять, зменшуються вдвічі."},{"level":2,"name":"Удосконалена Мала ілюзія","engName":"Improved Minor Illusion","description":"Коли ви обираєте цю школу на 2 рівні, ви вивчаєте замовляння Мала ілюзія [Minor Illusion]. Якщо ви вже знаєте це замовляння, то натомість вивчаєте інше замовляння чарівника на свій вибір. Це замовляння не враховується у вашому звичному ліміті відомих замовлянь.\n\nКоли ви накладаєте Мала ілюзія [Minor Illusion], ви можете одним накладанням створити і звук, і образ."},{"level":6,"name":"Гнучкі ілюзії","engName":"Malleable Illusions","description":"Починаючи з 6 рівня, коли ви накладаєте закляття школи Ілюзії з тривалістю 1 хвилина або довше, ви можете використати свою дію, щоб змінити природу цієї ілюзії, користуючись звичайними параметрами закляття для цієї ілюзії, за умови, що ви бачите ілюзію."},{"level":10,"name":"Ілюзорний двійник","engName":"Illusory Self","description":"Починаючи з 10 рівня, ви можете створити ілюзорного двійника себе як миттєву, майже інстинктивну реакцію на небезпеку. Коли створіння робить кидок атаки проти вас, ви можете використати свою реакцію, щоб підставити між собою та нападником ілюзорного двійника. Атака автоматично по вас промахується, після чого ілюзія розсіюється.\n\n      Після використання цієї риси ви не можете скористатися нею знову, доки не завершите короткий або тривалий відпочинок."},{"level":14,"name":"Ілюзія реальності","engName":"Illusory Reality","description":"Досягнувши 14 рівня, ви пізнаєте таємницю вплітання тіньової магії у свої ілюзії, надаючи їм напівреальності. Коли ви накладаєте закляття школи Ілюзії 1 рівня чи вище, ви можете обрати один неживий немагічний предмет, що є частиною ілюзії, і зробити цей предмет реальним. Ви можете зробити це у свій хід бонусною дією, поки закляття триває. Предмет залишається реальним протягом 1 хвилини.\n\nПредмет не може завдавати шкоди або інакше безпосередньо шкодити будь-кому."}]},{"name":"Школа некромантії","engName":"School of Necromancy","slug":"school-of-necromancy","kind":"Підклас","description":"Школа некромантії досліджує космічні сили життя, смерті й нежиття. Некромант учиться керувати енергією, що оживляє все живе, а згодом — висмоктувати життєву силу з істоти, руйнуючи її тіло, й обертати цю снагу на магічну силу. Більшість вважає некромантів загрозою чи навіть лиходіями: не всі вони злі, але сили, з якими вони працюють, у багатьох суспільствах під забороною.","features":[{"level":2,"name":"Знавець некромантії","engName":"Necromancy Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Некромантії до своєї книги заклять, зменшуються вдвічі."},{"level":2,"name":"Похмурі жнива","engName":"Grim Harvest","description":"На 2 рівні ви здобуваєте здатність жати життєву енергію зі створінь, яких убиваєте своїми закляттями. Один раз за хід, коли ви вбиваєте одне чи кілька створінь закляттям 1 рівня чи вище, ви відновлюєте кількість хітів, що дорівнює подвоєному рівню закляття, або потроєному його рівню, якщо закляття належить до школи Некромантії. Ви не отримуєте цієї переваги за вбивство конструктів або нежиті."},{"level":6,"name":"Немертві прислужники","engName":"Undead Thralls","description":"На 6 рівні ви додаєте закляття Підіймання мерців [Animate dead] до своєї книги заклять, якщо його там ще немає. Коли ви накладаєте Підіймання мерців [Animate dead], ви можете націлити ще один труп або купу кісток, створюючи, відповідно, ще одного зомбі або скелета.\n\nЩоразу, коли ви створюєте нежить закляттям школи Некромантії, вона отримує додаткові переваги:\n• Максимум хітів створіння збільшується на величину, що дорівнює вашому рівню чарівника.\n• Створіння додає ваш Бонус Майстерності до кидків шкоди своїх атак зброєю."},{"level":10,"name":"Призвичаєність до нежиті","engName":"Inured to Undeath","description":"Починаючи з 10 рівня, ви маєте опір до некротичної шкоди, а ваш максимум хітів не може бути зменшений. Ви провели так багато часу поруч із нежиттю та силами, що оживляють її, що призвичаїлися до деяких із їхніх найгірших проявів."},{"level":14,"name":"Підкорення нежиті","engName":"Command Undead","description":"Починаючи з 14 рівня, ви можете використати магію, щоб підпорядкувати собі нежить, навіть створену іншими чарівниками. Дією ви можете обрати одну нежить, яку бачите в межах 60 футів від себе. Це створіння мусить зробити рятівний кидок Харизми проти СК ряткидка ваших заклять чарівника. Якщо воно успішне, ви не можете використати цю рису на ньому знову. Якщо ж воно провалює ряткидок, то стає дружнім до вас і кориться вашим наказам, доки ви не використаєте цю рису знову.\n\nРозумну нежить контролювати в такий спосіб важче. Якщо ціль має Інтелект 8 або вище, вона має перевагу на ряткидок. Якщо вона провалює ряткидок і має Інтелект 12 або вище, вона може повторювати цей ряткидок наприкінці кожної години, доки не досягне успіху й не звільниться."}]},{"name":"Школа огородження","engName":"School of Abjuration","slug":"school-of-abjuration","kind":"Підклас","description":"Школа огородження вивчає магію, що блокує, виганяє чи захищає. Хулителі кажуть, що вона лише заперечує, нічого не стверджуючи, але припиняти шкідливі ефекти, берегти слабких і виганяти зло — гідне й шановане покликання. До чарівників цієї школи звертаються, коли треба вигнати лихих духів, уберегти важливе місце від магічного шпигунства чи зачинити портал на інший план.","features":[{"level":2,"name":"Арканна варта","engName":"Arcane Ward","description":"Починаючи з 2 рівня, ви можете сплітати довкола себе захисну магію. Коли ви накладаєте закляття школи Захисту 1 рівня чи вище, ви водночас можете використати нитку його магії, щоб створити на собі магічну варту, яка триває, доки ви не завершите тривалий відпочинок. Варта має кількість хітів, що дорівнює подвоєному рівню вашого чарівника + вашому модифікатору Інтелекту. Щоразу, коли ви зазнаєте шкоди, цю шкоду замість вас отримує варта. Якщо через цю шкоду кількість хітів варти знижується до 0, ви отримуєте всю шкоду, що залишилася.\n\nПоки варта має 0 хітів, вона не може поглинати шкоду, але її магія зберігається. Щоразу, коли ви накладаєте закляття школи Захисту 1 рівня чи вище, варта відновлює кількість хітів, що дорівнює подвоєному рівню закляття.\n\nСтворивши варту, ви не можете створити її знову, доки не завершите тривалий відпочинок."},{"level":2,"name":"Знавець захисту","engName":"Abjuration Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Захисту до своєї книги заклять, зменшуються вдвічі."},{"level":6,"name":"Проєктована варта","engName":"Projected Ward","description":"Починаючи з 6 рівня, коли створіння, яке ви бачите в межах 30 футів від себе, зазнає шкоди, ви можете використати свою реакцію, щоб змусити вашу Арканну варту поглинути цю шкоду. Якщо ця шкода зменшує кількість хітів варти до 0, захищене створіння отримує всю шкоду, що залишилася."},{"level":10,"name":"Покращені захисні закляття","engName":"Improved Abjuration","description":"Починаючи з 10 рівня, коли ви накладаєте закляття школи Захисту, яке вимагає від вас перевірки здібності як частини його накладання (як-от Контрчари [Counterspell] або Розвіювання магії [Dispel Magic]), ви додаєте свій Бонус Майстерності до цієї перевірки здібності."},{"level":14,"name":"Опір закляттям","engName":"Spell Resistance","description":"На 14 рівні ви маєте перевагу на всі ряткидки проти заклять і опір будь-якій шкоді від заклять."}]},{"name":"Школа перетворення","engName":"School of Transmutation","slug":"school-of-transmutation","kind":"Підклас","description":"Чарівник школи перетворення вивчає заклинання, що змінюють енергію й матерію. Для нього світ не сталий, а вкрай мінливий, і він радо стає рушієм змін — ковалем у кузні реальності. Одні такі чарівники — майстри-вигадники й жартівники, що обертають людей на жаб, а мідь на срібло задля розваги, інші смертельно серйозно шукають сили богів творити й руйнувати світи.","features":[{"level":2,"name":"Дрібна алхімія","engName":"Minor Alchemy","description":"Починаючи з 2 рівня, ви можете тимчасово змінити фізичні властивості одного немагічного предмета, перетворивши одну речовину на іншу. Ви виконуєте особливу алхімічну процедуру над одним предметом, цілком складеним із дерева, каменю (але не коштовного каміння), заліза, міді або срібла, перетворюючи його на інший із цих матеріалів. За кожні 10 хвилин, які ви витрачаєте на процедуру, ви можете перетворити до 1 кубічного фута матеріалу. Через 1 годину або доки ви не втратите концентрацію (ніби концентруєтеся на заклятті), матеріал повертається до свого первісного стану."},{"level":2,"name":"Знавець трансмутації","engName":"Transmutation Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Трансмутації до своєї книги заклять, зменшуються вдвічі."},{"level":6,"name":"Камінь трансмутатора","engName":"Transmuter’s Stone","description":"Починаючи з 6 рівня, ви можете витратити 8 годин на створення каменя трансмутатора, у якому накопичується магія трансмутації. Ви можете користуватися перевагою каменя самі або віддати його іншому створінню. Створіння отримує одну перевагу на ваш вибір, поки камінь перебуває в його володінні. Коли ви створюєте камінь, оберіть одну з таких переваг:\n• Темнозір у межах 60 футів.\n• Збільшення швидкості на 10 футів, поки створіння не перевантажене.\n• Володіння рятівними кидками Статури.\n• Опір до кислотної, холодової, вогняної, блискавичної або громової шкоди (щоразу, коли обираєте цю перевагу, визначаєте тип шкоди).\n\nЩоразу, коли ви накладаєте закляття школи Трансмутації 1 рівня чи вище, ви можете змінити ефект свого каменя, якщо він перебуває при вас.\n\nЯкщо ви створюєте новий камінь трансмутатора, попередній перестає діяти."},{"level":10,"name":"Перевертень","engName":"Shapechanger (School of Transmutation)","description":"На 10 рівні ви додаєте закляття Перевтілення [Polymorph] до своєї книги заклять, якщо його там ще немає. Ви можете накласти Перевтілення [Polymorph], не витрачаючи чарослот. Коли ви робите це, ви можете націлити лише себе і перетворитися на звіра з рейтингом небезпеки 1 або нижче.\n\n      Після того як ви накладете Перевтілення [Polymorph] у цей спосіб, ви не можете зробити цього знову, доки не завершите короткий або тривалий відпочинок, хоча й надалі можете накладати це закляття звичайним способом, витрачаючи доступний чарослот."},{"level":14,"name":"Майстер трансмутації","engName":"Master Transmuter","description":"Починаючи з 14 рівня, ви можете використати свою дію, щоб вивільнити запас магії трансмутації, накопичений у вашому камені трансмутатора, одним спалахом. Коли ви робите це, оберіть один із таких ефектів. Ваш камінь трансмутатора знищується і не може бути створений знову, доки ви не завершите тривалий відпочинок.\n\n*Велика трансформація.* Ви можете перетворити один немагічний предмет — не більший за куб зі стороною 5 футів — на інший немагічний предмет подібного розміру й маси та рівної або меншої вартості. Ви мусите витратити 10 хвилин на маніпуляції з предметом, щоб перетворити його.\n*Панацея.* Ви знімаєте всі прокляття, хвороби й отрути, що діють на створіння, якого торкаєтеся каменем трансмутатора. Це створіння також відновлює всі свої хіти.\n*Повернення до життя.* Ви накладаєте на створіння, якого торкаєтеся каменем трансмутатора, закляття Оживлення мерців [Raise Dead], не витрачаючи чарослот і не маючи потреби, щоб це закляття було у вашій книзі заклять.\n*Повернення молодості.* Ви торкаєтеся каменем трансмутатора до згодного створіння, і його видимий вік зменшується на 3к10 років, але не нижче 13 років. Цей ефект не подовжує тривалість життя створіння."}]},{"name":"Школа співу клинків","engName":"School of Bladesinging","slug":"school-of-bladesinging","kind":"Підклас","description":"Співці клинків опановують чарівництво, що поєднує фехтування й танець. Цю традицію створили ельфи, але її перейняли й інші, шануючи й розвиваючи ельфійські звичаї. У бою співець клинків виконує витончені складні рухи, що відводять шкоду й спрямовують магію в нищівні атаки та хитрий захист, і багато хто памʼятає це видовище як чудовий танець під спів клинка.","features":[{"level":2,"name":"Навчання війні та пісні","engName":"Training in War and Song","description":"Коли ви приймаєте цю традицію на 2 рівні, ви отримуєте володіння легкими обладунками, а також володіння одним видом одноручної зброї ближнього бою на свій вибір.\n\nВи також отримуєте володіння навичкою Виступ, якщо ще не володієте нею."},{"level":2,"name":"Пісня клинка","engName":"Bladesong","description":"Починаючи з 2 рівня, ви можете закликати ельфійську магію, відому як Пісня клинка, якщо не носите середніх чи важких обладунків і не користуєтеся щитом. Вона наділяє вас надприродною швидкістю, спритністю й зосередженістю.\n\nВи можете бонусною дією почати Пісню клинка, яка триває 1 хвилину. Вона завершується раніше, якщо ви стаєте Недієздатні, якщо вдягаєте середні чи важкі обладунки або берете щит, чи якщо використовуєте обидві руки, щоб здійснити атаку зброєю. Ви також можете будь-коли припинити Пісню клинка (дії не потрібно).\n\nПоки ваша Пісня клинка активна, ви отримуєте такі переваги:\n• Ви отримуєте бонус до КБ, що дорівнює вашому модифікатору Інтелекту (мінімум +1).\n• Ваша швидкість ходи збільшується на 10 футів.\n• Ви маєте перевагу на перевірки Спритності (Акробатика).\n• Ви отримуєте бонус до будь-якого рятівного кидка Статури, який робите, щоб підтримувати концентрацію на заклятті. Цей бонус дорівнює вашому модифікатору Інтелекту (мінімум +1).\n\nВи можете скористатися цією рисою кількість разів, що дорівнює вашому Бонусу Майстерності, і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":6,"name":"Додаткова атака (клинок)","engName":"Extra Attack (Bladesinger)","description":"Починаючи з 6 рівня, коли ви виконуєте дію Атака у свій хід, ви можете атакувати двічі замість одного разу. Ба більше, ви можете накласти одне зі своїх замовлянь замість однієї з цих атак."},{"level":10,"name":"Пісня захисту","engName":"Song of Defense","description":"Починаючи з 10 рівня, поки ваша Пісня клинка активна, ви можете спрямувати свою магію на поглинання шкоди. Коли ви зазнаєте шкоди, ви можете використати свою реакцію, щоб витратити один чарослот і зменшити цю шкоду на величину, що дорівнює пʼятикратному рівню чарослоту."},{"level":14,"name":"Пісня перемоги","engName":"Song of Victory","description":"Починаючи з 14 рівня, поки ваша Пісня клинка активна, ви можете додавати свій модифікатор Інтелекту (мінімум +1) до шкоди ваших атак ближньою зброєю."}]},{"name":"Школа хронургії","engName":"School of Chronurgy","slug":"school-of-chronurgy","kind":"Підклас","description":"Послідовники традиції хронургії зосереджуються на керуванні часом і вчаться змінювати плин реальності на свій смак. Вони гнуть потік часу так само вправно, як умілий музикант грає на інструменті, миттєво даючи перевагу собі й союзникам.","features":[{"level":2,"name":"Зсув часу","engName":"Chronal Shift","description":"На 2 рівні ви можете магічно здійснювати обмежений контроль над плином часу навколо створіння. Реакцією, після того як ви або створіння, яке ви бачите в межах 30 футів від себе, зробите кидок атаки, перевірку здібності або рятівний кидок, ви можете змусити це створіння перекинути кидок. Ви приймаєте це рішення після того, як побачите, чи був кидок успішним, чи ні. Ціль мусить використати результат другого кидка.\n\nВи можете скористатися цією здатністю двічі й відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":2,"name":"Часова обізнаність","engName":"Temporal Awareness","description":"Починаючи з 2 рівня, ви можете додавати свій модифікатор Інтелекту до кидків ініціативи."},{"level":6,"name":"Миттєвий стазис","engName":"Momentary Stasis","description":"Коли ви досягаєте 6 рівня, ви можете дією магічно змусити Велику або меншу істоту, яку бачите в межах 60 футів від себе, зробити рятівний кидок Статури проти СК ряткидка ваших заклять. Якщо ряткидок не є успішним, створіння опиняється в полі магічної енергії до кінця вашого наступного ходу або доки не зазнає будь-якої шкоди. Поки воно замкнене таким чином, створіння Недієздатне і має швидкість 0.\n\nВи можете скористатися цією рисою кількість разів, що дорівнює вашому модифікатору Інтелекту (мінімум один раз), і відновлюєте всі витрачені використання після завершення тривалого відпочинку."},{"level":10,"name":"Арканне завмирання","engName":"Arcane Abeyance","description":"На 10 рівні, коли ви накладаєте закляття, використовуючи чарослот 4 рівня чи нижче, ви можете стиснути магію цього закляття в іскру. Закляття завмирає в часі в мить накладання й утримується в сірій намистині протягом 1 години. Ця намистина є Крихітним предметом із КБ 15 і 1 хітом, а також має імунітет до отруйної та психічної шкоди. Коли тривалість спливає або намистину знищують, вона зникає у спалаху світла, а закляття втрачається.\n\nСтворіння, що тримає намистину, може використати свою дію, щоб вивільнити закляття, яке в ній міститься, після чого намистина зникає. Закляття використовує ваш бонус атаки закляттям і СК ряткидка, а для всіх інших цілей вважає накладачем створіння, яке його вивільнило.\n\nСтворивши намистину за допомогою цієї риси, ви не можете зробити цього знову, доки не завершите короткий або тривалий відпочинок."},{"level":14,"name":"Схоження майбутнього","engName":"Convergent Future","description":"Починаючи з 14 рівня, ви можете зазирнути в можливі майбуття і магічно втягнути одне з них у події довкола себе, забезпечивши певний результат. Коли ви або створіння, яке ви бачите в межах 60 футів від себе, робить кидок атаки, перевірку здібності або рятівний кидок, ви можете реакцією проігнорувати результат кидка кубика і вирішити, що випале число є мінімально потрібним для успіху або на 1 меншим за це число (на ваш вибір).\n\nКоли ви використовуєте цю рису, ви отримуєте 1 рівень виснаження. Лише завершивши тривалий відпочинок, ви можете прибрати рівень виснаження, отриманий у цей спосіб."}]},{"name":"Школа чарування","engName":"School of Enchantment","slug":"school-of-enchantment","kind":"Підклас","description":"Чарівник школи чарування відточив уміння магією заворожувати й зваблювати людей і чудовиськ. Одні чарівники цієї школи — миротворці, що змушують жорстоких скласти зброю й схиляють лютих до милосердя. Інші — тирани, що магією силоміць підкоряють собі непокірних. Більшість же десь посередині.","features":[{"level":2,"name":"Гіпнотичний погляд","engName":"Hypnotic Gaze","description":"Починаючи з 2 рівня, ваші лагідні слова й чарівний погляд можуть магічно захопити інше створіння. Дією оберіть одне створіння, яке ви бачите в межах 5 футів від себе. Якщо ціль може бачити або чути вас, вона мусить успішно пройти рятівний кидок Мудрості проти СК ряткидка ваших заклять чарівника, інакше буде зачарована вами до кінця вашого наступного ходу. Швидкість зачарованого створіння знижується до 0, воно стає Недієздатним і помітно ошелешеним.\n\n      У наступні ходи ви можете використати свою дію, щоб підтримувати цей ефект, подовжуючи його тривалість до кінця свого наступного ходу. Однак ефект завершується, якщо ви відходите від створіння більш як на 5 футів, якщо створіння більше не може вас ні бачити, ні чути, або якщо створіння зазнає шкоди.\n\n      Після того як ефект завершиться, або якщо створіння успішно пройде свій початковий рятівний кидок проти цього ефекту, ви не можете використати цю рису на цьому створінні знову, доки не завершите тривалий відпочинок."},{"level":2,"name":"Знавець причарування","engName":"Enchantment Savant","description":"Починаючи з 2 рівня, коли ви обираєте цю школу, час і золото, які ви мусите витратити, щоб переписати закляття школи Причарування до своєї книги заклять, зменшуються вдвічі."},{"level":6,"name":"Інстинктивний чар","engName":"Instinctive Charm","description":"Починаючи з 6 рівня, коли створіння, яке ви бачите в межах 30 футів від себе, робить кидок атаки проти вас, ви можете використати свою реакцію, щоб відвернути атаку, за умови, що в межах досяжності цієї атаки є інше створіння. Нападник мусить зробити рятівний кидок Мудрості проти СК ряткидка ваших заклять чарівника. У разі провалу нападник мусить націлитися на створіння, яке є найближчим до нього, не враховуючи вас і самого себе. Якщо найближчих створінь кілька, нападник сам обирає, яке з них стане ціллю.\n\nУ разі успішного ряткидка ви не можете використати цю рису на цьому нападникові знову, доки не завершите тривалий відпочинок.\n\nВи мусите вирішити, що використовуєте цю рису, до того, як дізнаєтеся, чи атака влучає. Створіння, яких не можна зачарувати, мають імунітет до цього ефекту."},{"level":10,"name":"Розділені чари","engName":"Split Enchantment","description":"Починаючи з 10 рівня, коли ви накладаєте закляття школи Причарування 1 рівня чи вище, яке цілить лише одне створіння, ви можете змусити його також націлитися на друге створіння."},{"level":14,"name":"Зміна спогадів","engName":"Alter Memories","description":"На 14 рівні ви здобуваєте здатність робити створіння неусвідомленим до вашого магічного впливу на нього. Коли ви накладаєте закляття школи Причарування, щоб зачарувати одне чи кілька створінь, ви можете змінити розуміння одного створіння так, щоб воно не усвідомлювало, що було зачароване.\n\nКрім того, один раз до завершення дії закляття ви можете використати свою дію, щоб спробувати змусити обране створіння забути частину часу, проведеного під зачаруванням. Створіння мусить успішно пройти рятівний кидок Інтелекту проти СК ряткидка ваших заклять чарівника, інакше втратить кількість годин спогадів, що дорівнює 1 + вашому модифікатору Харизми (мінімум 1). Ви можете змусити створіння забути менше часу, але ця кількість не може перевищувати тривалість вашого закляття Причарування."}]}]},{"edition":"2014","name":"Варвар","engName":"Barbarian","slug":"barbarian","description":"Для одних варварів Лють народжується з єднання з грізними звіриними духами, для інших — із вируючого гніву на світ, сповнений болю. Та для кожного варвара Лють — це сила, що живить не лише бойове шаленство, а й надприродні рефлекси, стійкість і неймовірну міць.\n\nМешканці міст пишаються тим, що цивілізація відрізняє їх від тварин, але для варвара цивілізація — ознака слабкості. Сильні приймають свою звірину природу: гострі інстинкти, первісну міць тіла й несамовиту лють. Варварам тісно серед стін і натовпів — вони оживають у дикій природі рідних країв і в хаосі бою.\n\nСправжній варвар серед свого племені трапляється так само рідко, як умілий воїн у місті, і стає захисником народу та провідником у часи війни. Мужність перед небезпекою й звичка до мандрів роблять варварів природженими шукачами пригод.","facts":["Кістка хітів: к12","Підклас з 3 рівня","9 підкласів"],"features":[{"level":1,"name":"Захист без броні","engName":"Unarmored Defense","description":"Поки ви не носите жодної броні, ваш Клас Броні дорівнює 10 + ваш модифікатор Спритності + ваш модифікатор Статури. Ви можете використовувати щит і все ще отримувати цю перевагу."},{"level":1,"name":"Захист без обладунків","engName":"Unarmored Defense (Barbarian)","description":"Ваш КЗ дорівнює 10 + модифікатор Спритності + модифікатор Статури."},{"level":1,"name":"Лють","engName":"Rage","description":"У бою ви бʼєтеся з первісною Люттю. У свій хід ви можете увійти в лють бонусною дією. Перебуваючи в люті, ви отримуєте наступні переваги, якщо ви не носите важку броню: ви маєте перевагу на перевірки Сили та ряткидки Сили; коли ви робите атаку рукопашною зброєю, використовуючи Силу, ви отримуєте бонус до кидка шкоди, який збільшується з вашим рівнем варвара; ви маєте стійкість до дробильної, колючої та рубаючої шкоди. Ваша лють триває 1 хвилину. Вона закінчується достроково, якщо ви втрачаєте свідомість, або якщо ваш хід закінчується, а ви не атакували ворожого створіння з вашого останнього ходу або не отримували шкоди з того часу. Ви також можете закінчити свою лють у свій хід бонусною дією. Коли ви вичерпаєте кількість разів використання Люті, потрібно зробити довгий відпочинок, аби їх відновити. \n\nБонус до шкоди від Rage:\n1-8 рівні: +2 шкоди\n\n9-15 рівні: +3 шкоди\n\n16-20 рівні: +4 шкоди \n\nКількість використань Люті на Довгий Відпочинок:\n1-2 рівні: 2 рази\n\n3-5 рівні: 3 рази\n\n6-11 рівні: 4 рази\n\n12-16 рівні: 5 разів\n\n17-19 рівні: 6 разів\n\n20 рівень: безліміт!"},{"level":2,"name":"Безрозсудна атака","engName":"Reckless Attack","description":"Починаючи з 2 рівня, ви можете відкинути всі турботи про захист, щоб атакувати з шаленою відчайдушністю. Коли ви робите свою першу атаку у свій хід, ви можете вирішити атакувати безрозсудно. Це дає вам перевагу на кидки атаки рукопашною зброєю, що використовує Силу, протягом цього ходу, але кидки атаки проти вас мають перевагу до вашого наступного ходу."},{"level":2,"name":"Відчуття небезпеки","engName":"Danger Sense","description":"На 2 рівні ви отримуєте надзвичайне відчуття того, коли речі поряд не такі, якими повинні бути, даючи вам перевагу, коли ви ухиляєтеся від небезпеки. Ви маєте перевагу на ряткидки Спритності проти ефектів, які ви можете бачити, таких як пастки та заклинання. Щоб отримати цю перевагу, ви не можете бути засліпленими, оглушеними або недієздатними."},{"level":3,"name":"Первісний Шлях","engName":"Primal Path","description":"Ви обираєте шлях, що визначає природу вашої люті."},{"level":4,"name":"Покращення Характеристик","engName":"Ability Score Improvement","description":"+2 до однієї або +1 до двох характеристик."},{"level":5,"name":"Додаткова атака","engName":"Barbarian Extra Attack","description":"Починаючи з 5 рівня, ви можете атакувати двічі замість одного разу, коли ви виконуєте дію Атака у свій хід."},{"level":5,"name":"Швидкий рух","engName":"Fast Movement","description":"Починаючи з 5 рівня, ваша швидкість збільшується на 10 футів, поки ви не носите важку броню."},{"level":7,"name":"Дикий інстинкт","engName":"Feral Instinct","description":"На 7 рівні ваші інстинкти настільки відточені, що ви маєте перевагу на кидки ініціативи. \n\n Крім того, якщо вас застали зненацька на початку бою і ви не недієздатні, ви можете діяти нормально у свій перший хід, але тільки якщо ви увійдете в лють перед тим, як робити щось інше у цей хід."},{"level":9,"name":"Брутальний крит","engName":"Brutal Critical","description":"Починаючи з 9 рівня, ви можете кинути одну додаткову кість шкоди зброї при визначенні додаткової шкоди для критичного влучання рукопашною атакою. Це збільшується до двох додаткових кістей на 13 рівні та трьох додаткових кістей на 17 рівні."},{"level":11,"name":"Невпинна лють","engName":"Relentless Rage","description":"Починаючи з 11 рівня, ваша лють може тримати вас в бою, незважаючи на тяжкі рани. Якщо ви падаєте до 0 хіт-поінтів під час люті і не вмираєте відразу, ви можете здійснити ряткидок Статури зі СК 10. Якщо вам це вдається, у вас залишається 1 хіт-поінт замість натомість. Кожного разу, коли ви використовуєте цю здібність після першого разу, СК збільшується на 5. Коли ви завершуєте короткий або тривалий відпочинок, СК скидається до 10."},{"level":15,"name":"Постійна лють","engName":"Persistent Rage","description":"Починаючи з 15 рівня, ваша лють настільки жорстока, що вона закінчується достроково, тільки якщо ви втрачаєте свідомість або якщо ви вирішите закінчити її."},{"level":18,"name":"Незламна міць","engName":"Indomitable Might","description":"Починаючи з 18 рівня, якщо ваш загальний результат для перевірки Сили менший за ваш показник Сили, ви можете використати цей показник замість загального результату."},{"level":20,"name":"Первісний чемпіон","engName":"Primal Champion","description":"На 20 рівні ви втілюєте силу дикої природи. Ваші показники Сили та Статури збільшуються на 4. Ваш максимум для цих показників тепер становить 24."}],"children":[{"name":"Шлях берсерка","engName":"Path of the Berserker","slug":"path-of-the-berserker","kind":"Підклас","description":"Для деяких варварів Лють — лише засіб, а мета — насильство. Шлях берсерка — це шлях нестримного, залитого кровʼю шаленства: поринаючи в лють, берсерк упивається хаосом бою, не зважаючи ні на здоровʼя, ні на власну безпеку.","features":[{"level":3,"name":"Френзі","engName":"Frenzy","description":"На 3 рівні, коли ви впадаєте в лють, можете вирішити ввійти у френзі. Якщо так, до кінця люті ви можете бонусною дією кожного свого ходу робити одну атаку рукопашною зброєю. Коли лють закінчується, ви отримуєте один рівень виснаження."},{"level":6,"name":"Несамовита лють","engName":"Mindless Rage","description":"Починаючи з 6 рівня, поки ви перебуваєте в люті, ви не можете бути Причарованими або Наляканими. Якщо ви вже є Причарованими або Наляканими, коли входите в лють, цей ефект призупиняється на час її тривалості."},{"level":10,"name":"Залякуюча присутність","engName":"Intimidating Presence","description":"Починаючи з 10 рівня, ви можете використати свою дію, щоб налякати когось своєю грізною присутністю. Коли ви робите це, оберіть одну істоту, яку бачите в межах 30 футів від себе. Якщо істота може вас бачити або чути, вона мусить успішно пройти ряткидок Мудрості (КС дорівнює 8 + ваш Бонус Майстерності + ваш модифікатор Харизми), інакше буде Наляканою вами до кінця вашого наступного ходу. У наступні ходи ви можете використати свою дію, щоб продовжити тривалість цього ефекту на наляканій істоті до кінця вашого наступного ходу. Цей ефект завершується, якщо істота наприкінці свого ходу опиняється поза вашою лінією зору або більш ніж за 60 футів від вас.\n\nЯкщо істота успішно проходить свій ряткидок, ви не можете використати цю рису на ній знову протягом 24 годин."},{"level":14,"name":"Відплата берсерка","engName":"Retaliation","description":"На 14 рівні, коли істота в 5 футах від вас завдає вам шкоди рукопашною атакою, ви можете реакцією зробити одну атаку рукопашною зброєю по цій істоті."}]},{"name":"Шлях бойового шаленця","engName":"Path of the Battlerager","slug":"path-of-the-battlerager","kind":"Підклас","description":"Бойові шаленці — дворфи, що шанують богів війни й обирають цей шлях. Вони носять громіздкі шипасті обладунки, кидаються в гущу бою, бʼючи самим тілом, і цілком віддаються бойовій Люті.","features":[{"level":3,"name":"Обладунок лютого","engName":"Battlerager Armor","description":"Коли на 3 рівні ви обираєте цей шлях, ви здобуваєте здатність використовувати шипований обладунок як зброю.\n\nПоки ви носите шипований обладунок і перебуваєте в люті, ви можете бонусною дією зробити одну рукопашну атаку зброєю шипами обладунку проти цілі в межах 5 футів від вас. Якщо атака влучає, шипи завдають 1к4 колотої шкоди. Ви використовуєте свій модифікатор Сили для кидків атаки й кидків шкоди.\n\nКрім того, коли ви використовуєте Дію Атака, щоб захопити істоту, ціль отримує 3 колотої шкоди, якщо ваша перевірка Захоплення успішна."},{"level":3,"name":"Обмеження: лише дворфи","engName":"Restriction: Dwarves Only","description":"Лише дворфи можуть іти Шляхом батлрейджера. Батлрейджер займає особливу нішу в дворфському суспільстві та культурі.\n\nВаш Майстер може зняти це обмеження, щоб краще пристосувати його до кампанії. Це обмеження існує для Забутих Королівств і може не застосовуватися до світу вашого Майстра або до його версії Королівств."},{"level":6,"name":"Безрозсудне завзяття","engName":"Reckless Abandon","description":"Починаючи з 6 рівня, коли ви використовуєте Безрозсудну атаку під час люті, ви також отримуєте тимчасові хіти, рівні вашому модифікатору Статури (мінімум 1). Вони зникають, якщо якісь із них залишилися, коли ваша лють закінчується."},{"level":10,"name":"Натиск батлрейджера","engName":"Battlerager Charge","description":"На 10 рівні, поки ви у люті, можете бонусною дією здійснити Ривок."},{"level":14,"name":"Шипована відплата","engName":"Spiked Retribution","description":"Починаючи з 14 рівня, коли істота в межах 5 футів від вас влучає по вам рукопашною атакою, нападник отримує 3 колотої шкоди, якщо ви перебуваєте в люті, не є Недієздатними й носите шипований обладунок."}]},{"name":"Шлях велетня","engName":"Path of the Giant","slug":"path-of-the-giant","kind":"Підклас","description":"Варвари Шляху велетня черпають міць із тих самих первісних сил, що й велетні. У Люті їх переповнює стихійна енергія, і вони ростуть: одні стають просто більшими, зі спалахами стихії в очах і довкола зброї, інші набувають вигляду справжнього велетня чи елементаля, огорнутого вогнем, морозом або блискавками.","features":[{"level":3,"name":"Лють велетня","engName":"Giant’s Havoc","description":"Також на 3 рівні, коли ви у люті, ви збільшуєтеся до Великого розміру (якщо є простір), а ваша досяжність збільшується на 5 футів. Крім того, коли ви влучаєте атакою кидковою зброєю, що використовує Силу, додаєте ваш бонус люті до шкоди."},{"level":3,"name":"Сила велетня","engName":"Giant’s Power","description":"Коли ви обираєте цей шлях, ви вивчаєте, як говорити, читати й писати мовою велетнів або однією іншою мовою на свій вибір, якщо вже знаєте велетнів. Крім того, ви вивчаєте одне замовляння на свій вибір: Ремесло друїдів [Druidcraft] або Дивотворство [Thaumaturgy]. Мудрість є вашою базовою характеристикою чаротворства для цього заклинання."},{"level":6,"name":"Стихійний клинок","engName":"Elemental Cleaver","description":"На 6 рівні, коли ви входите в лють, обираєте одну зброю, яку тримаєте, й надаєте їй один тип шкоди: кислота, холод, вогонь, гром, блискавка. Поки ви тримаєте цю зброю під час люті, її тип змінюється на обраний, при влучанні вона завдає додаткові 1к6 цієї шкоди, і вона отримує властивість «метальна» з дальністю 20/60 футів та повертається в вашу руку після кидка. Бонусною дією під час люті можете змінити обраний тип. На 14 рівні додаткова шкода збільшується до 2к6."},{"level":10,"name":"Могутній поштовх","engName":"Mighty Impel","description":"На 10 рівні бонусною дією, поки ви у люті, можете перемістити істоту Середнього розміру чи меншу в межах досяжності в порожню клітинку, яку бачите, на до 30 футів. Незгідна істота робить ряткидок Сили (КС = 8 + БМ + модифікатор Сили); при успіху руху немає. Якщо в кінці руху істота не стоїть на поверхні чи рідині, що може її втримати, вона падає й може бути Повалена."},{"level":14,"name":"Деміург-колос","engName":"Demiurgic Colossus","description":"На 14 рівні ваша лють робить вас колосом: коли лютуєте, ваша досяжність збільшується на 10 футів, а розмір може зрости до Великого або Величезного (за вашим вибором, якщо є простір). Mighty Impel тепер може переміщувати істот Великих чи менших. Додаткова шкода від Стихійного клинка становить 2к6, якщо ще не збільшена."}]},{"name":"Шлях вісника шторму","engName":"Path of the Storm Herald","slug":"path-of-the-storm-herald","kind":"Підклас","description":"Варвари Шляху вісника шторму обертають свою Лють на покров первісної магії, що вирує довкола них, і в шаленстві черпають із сил природи потужні магічні ефекти. Одні з них — елітні захисники, що тренуються пліч-о-пліч із друїдами й слідопитами, інші гартуються в краях бур, на крижаних окраїнах світу чи в найспекотніших пустелях.","features":[{"level":3,"name":"Буревісна аура","engName":"Storm Aura","description":"Коли на 3 рівні ви обираєте цей шлях, ви випромінюєте штормову магічну ауру, поки перебуваєте в люті. Аура простягається від вас на 10 футів у кожному напрямку, але не проходить крізь повне укриття.\n\nВаша аура має ефект, який активується, коли ви входите в лють, і ви можете знову активувати цей ефект бонусною дією в кожному своєму ході. Оберіть Пустелю, Море або Тундру. Ефект вашої аури залежить від обраного середовища, як описано нижче. Ви можете змінювати свій вибір середовища щоразу, коли здобуваєте рівень у цьому класі.\n\nЯкщо ефекти вашої аури вимагають ряткидка, КС дорівнює 8 + ваш Бонус Майстерності + ваш модифікатор Статури.\n\n• **Пустеля.** Коли цей ефект активується, всі інші істоти у вашій аурі отримують по 2 шкоди вогнем. Шкода зростає, коли ви досягаєте певних рівнів у цьому класі: до 3 на 5 рівні, 4 на 10, 5 на 15 і 6 на 20.\n• **Море.** Коли цей ефект активується, ви можете обрати одну іншу істоту, яку бачите у своїй аурі. Ціль мусить зробити ряткидок Спритності. При провалі ціль отримує 1к6 блискавичної шкоди, а при успіху — половину цієї шкоди. Шкода зростає, коли ви досягаєте певних рівнів у цьому класі: до 2к6 на 10 рівні, 3к6 на 15 і 4к6 на 20.\n• **Тундра.** Коли цей ефект активується, кожна істота на ваш вибір у вашій аурі отримує 2 тимчасові хіти, оскільки крижані духи привчають її до страждання. Тимчасові хіти зростають, коли ви досягаєте певних рівнів у цьому класі: до 3 на 5 рівні, 4 на 10, 5 на 15 і 6 на 20."},{"level":6,"name":"Душа бурі","engName":"Storm Soul","description":"На 6 рівні буря дарує вам переваги, навіть коли ваша аура не активна. Переваги залежать від середовища, яке ви обрали для своєї Буревісної аури.\n\n• **Пустеля.** Ви отримуєте опір вогняній шкоді й не зазнаєте наслідків екстремальної спеки, як описано в *Dungeon Master's Guide*. Крім того, дією ви можете торкнутися займистого предмета, який ніхто не носить і не тримає, та підпалити його.\n• **Море.** Ви отримуєте опір блискавичній шкоді, можете дихати під водою й отримуєте швидкість плавання 30 футів.\n• **Тундра.** Ви отримуєте опір холодній шкоді й не зазнаєте наслідків екстремального холоду, як описано в *Dungeon Master's Guide*. Крім того, дією ви можете торкнутися води й перетворити її куб розміром 5 футів на лід, який тане через 1 хвилину. Ця дія провалюється, якщо в кубі є істота."},{"level":10,"name":"Захисна буря","engName":"Shielding Storm","description":"На 10 рівні ви навчаєтеся використовувати свою владу над бурею, щоб захищати інших. Кожна істота на ваш вибір має той самий опір до шкоди, який ви здобули завдяки рисі Душа бурі, поки ця істота перебуває у вашій Буревісній аурі."},{"level":14,"name":"Лють бурі","engName":"Raging Storm","description":"На 14 рівні сила бурі, яку ви спрямовуєте, зростає, бʼючи по ваших ворогах. Ефект залежить від середовища, яке ви обрали для своєї Буревісної аури.\n\n• **Пустеля.** Одразу після того, як істота у вашій аурі влучає по вас атакою, ви можете реакцією змусити цю істоту зробити ряткидок Спритності. При провалі істота отримує вогняну шкоду, що дорівнює половині вашого рівня варвара.\n• **Море.** Коли ви влучаєте по істоті у своїй аурі атакою, ви можете реакцією змусити цю істоту зробити ряткидок Сили. При провалі істота стає Поваленою, ніби її збила хвиля.\n• **Тундра.** Щоразу, коли активується ефект вашої Буревісної аури, ви можете обрати одну істоту, яку бачите в аурі. Ця істота мусить успішно пройти ряткидок Сили, інакше її швидкість зменшується до 0 до початку вашого наступного ходу, оскільки магічний мороз сковує її."}]},{"name":"Шлях дикої магії","engName":"Path of Wild Magic","slug":"path-of-wild-magic","kind":"Підклас","description":"Фейвайлд, Верхні Плани та інші краї надприродної сили вирують дикою магією, а варвари з їхніми глибокими почуттями особливо вразливі до неї — декого вона змінює назавжди. Такі варвари йдуть Шляхом дикої магії; його часто обирають ельфи, тифлінги, аазимари й геназі, прагнучи виявити потойбічну магію своїх предків.","features":[{"level":3,"name":"Дикий сплеск","engName":"Wild Surge","description":"Також на 3 рівні магічна енергія, що вирує всередині вас, іноді виривається назовні. Коли ви входите в лють, киньте к8 за таблицею Дикої магії, щоб визначити магічний ефект. Якщо ефект вимагає ряткидка, КС дорівнює 8 + ваш Бонус Майстерності + ваш модифікатор Статури.\n\n**Дика магія**
